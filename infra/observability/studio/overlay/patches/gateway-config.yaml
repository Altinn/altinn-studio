apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
spec:
  config:
    extensions:
      # The token is read from a mounted Secret (patches/gateway-victoria-volumes.yaml) and
      # re-read when the kubelet updates it, so a rotation needs no restart. Without
      # retry_on_failure, a token file missing at startup would never be read, even once the
      # Secret exists; with it, the file is looked for in the background until it appears.
      bearertokenauth/victoria:
        filename: /var/run/observability-ingest-token/token
        retry_on_failure:
          enabled: true
          max_retries: 0
          interval: 30s
      file_storage/victoria:
        directory: /var/lib/otelcol/victoria-queue
        compaction:
          on_rebound: true
          directory: /var/lib/otelcol/victoria-queue

    exporters:
      azure_monitor:
        spaneventsenabled: true
        connection_string: $${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
      # The Victoria backend in Studio prod. Every Studio environment exports here through
      # the public endpoint; Studio prod overrides the endpoint with the in-cluster proxy
      # (env/prod/kustomization.yaml).
      otlp_http/victoria:
        endpoint: https://altinn.studio/internal/observability/otlp
        auth:
          authenticator: bearertokenauth/victoria
        # Retry without a time limit, so an outage of the Studio prod endpoint is buffered
        # up to the queue size rather than dropped after a fixed time.
        retry_on_failure:
          max_elapsed_time: 0
        # A persistent queue survives a Collector restart. Its size is in bytes so it stays
        # well inside the emptyDir sizeLimit it is stored on.
        sending_queue:
          enabled: true
          storage: file_storage/victoria
          sizer: bytes
          queue_size: 268435456

    service:
      # The list replaces base's, so it repeats health_check, which the probes need.
      extensions: [health_check, bearertokenauth/victoria, file_storage/victoria]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [transform/azuremonitor, transform/azuremonitor_expected_404, tail_sampling, batch]
          exporters: [azure_monitor]
        # Victoria receives the canonical spans, without the Application Insights
        # transforms, and samples them with its own tail_sampling instance. The two
        # pipelines keep the same traces only while no sampling policy reads an attribute
        # those transforms change.
        traces/victoria:
          receivers: [otlp]
          processors: [tail_sampling, batch]
          exporters: [otlp_http/victoria]
        # Metrics go to Victoria only, not to Application Insights.
        metrics:
          receivers: [otlp]
          processors: [filter/metrics_allowlist, batch]
          exporters: [otlp_http/victoria]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [azure_monitor]
        logs/victoria:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/victoria]
