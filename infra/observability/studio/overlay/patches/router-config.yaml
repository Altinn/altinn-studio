apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-router
spec:
  config:
    exporters:
      load_balancing/traces:
        routing_key: traceID
        # Queue and retry here, not per gateway, so a retried export picks its gateway from the
        # current ring instead of being dropped with a gateway that has left it.
        timeout: 10s # two gateways during a rollout, each within the per-gateway 5s default
        retry_on_failure: # Collector defaults in full; unset, they are 0 here (0.161.0)
          enabled: true
          initial_interval: 5s # also the DNS resolver's default refresh interval
          randomization_factor: 0.5
          multiplier: 1.5
          max_interval: 30s
          max_elapsed_time: 300s # hold data through a gateway outage, up to the queue size
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: 8388608 # 8 MiB serialized, several times that in memory; the router has 256Mi
        protocol:
          otlp:
            tls:
              insecure: true
            retry_on_failure:
              enabled: false # a failure goes back to the retry above
            sending_queue:
              enabled: false # a queue here would accept the batch and tie it to one gateway
        resolver:
          dns:
            hostname: otel-gateway-collector-headless.observability.svc.cluster.local
            port: '4317'
      # Sink app metrics at router: Azure Monitor OTel metrics are currently high-cost, low-value.
      nop: {}
      load_balancing/logs:
        routing_key: traceID
        # Same settings as load_balancing/traces.
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          randomization_factor: 0.5
          multiplier: 1.5
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: 8388608
        protocol:
          otlp:
            tls:
              insecure: true
            retry_on_failure:
              enabled: false
            sending_queue:
              enabled: false
        resolver:
          dns:
            hostname: otel-gateway-collector-headless.observability.svc.cluster.local
            port: '4317'

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource_detection/aks, k8s_attributes, resource/environment, transform/drop, batch]
          exporters: [load_balancing/traces]
        metrics:
          receivers: [otlp]
          exporters: [nop]
        logs:
          receivers: [otlp]
          processors: [filter/logs, resource_detection/aks, k8s_attributes, resource/environment, transform/drop, batch]
          exporters: [load_balancing/logs]
