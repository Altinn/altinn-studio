apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Applied in Studio prod only, by its own Flux Kustomization,
# observability-victoria in infra/studio/syncroot/base/observability-victoria.yaml,
# not through the per-environment overlays in ../env.
#
# The Flux Kustomization also sets targetNamespace, but naming it here makes the
# rendered manifests carry it explicitly, so they can be read and applied on
# their own.
namespace: observability
resources:
  - metrics.yaml
  - traces.yaml
  - logs.yaml
