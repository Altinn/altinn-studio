  extraArgs:
    retention.maxDiskUsagePercent: "80"
    forceMergeAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/force-merge
    forceFlushAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/force-flush
    partitionManageAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/partition-manage
    logNewStreamsAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/log-new-streams
    pprofAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/pprof
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: studio-observability-premium-v2
    resources:
      requests:
        storage: 512Gi
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      memory: 16Gi
  nodeSelector:
    purpose: observability
  tolerations:
    - key: purpose
      operator: Equal
      value: observability
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
