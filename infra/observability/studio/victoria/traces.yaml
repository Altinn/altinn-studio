# Trace storage, same disk-bound retention shape as logs.
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: traces-a
  annotations:
    # Never pruned by Flux; see the note on the VMSingle in metrics.yaml.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Same hardened pod and container security context as the rest of the stack;
  # see the note in metrics.yaml.
  useStrictSecurity: true
  image:
    repository: victoriametrics/victoria-traces
    tag: v0.11.1
  retentionPeriod: 100y
  secrets:
    - observability-backend-auth-keys
  extraArgs:
    retention.maxDiskUsagePercent: "80"
    # Admin auth keys; see logs.yaml.
    forceMergeAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/force-merge
    forceFlushAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/force-flush
    partitionManageAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/partition-manage
    logNewStreamsAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/log-new-streams
    pprofAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/pprof
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: studio-observability-premium-v2
    resources:
      requests:
        storage: 512Gi
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      memory: 16Gi
  nodeSelector:
    purpose: observability
  tolerations:
    - key: purpose
      operator: Equal
      value: observability
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: vtsingle
          topologyKey: kubernetes.io/hostname
---
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: traces-b
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  useStrictSecurity: true
  image:
    repository: victoriametrics/victoria-traces
    tag: v0.11.1
  retentionPeriod: 100y
  secrets:
    - observability-backend-auth-keys
  extraArgs:
    retention.maxDiskUsagePercent: "80"
    forceMergeAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/force-merge
    forceFlushAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/force-flush
    partitionManageAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/partition-manage
    logNewStreamsAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/log-new-streams
    pprofAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/pprof
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: studio-observability-premium-v2
    resources:
      requests:
        storage: 512Gi
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      memory: 16Gi
  nodeSelector:
    purpose: observability
  tolerations:
    - key: purpose
      operator: Equal
      value: observability
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: vtsingle
          topologyKey: kubernetes.io/hostname
---
# The trace agent has no CRD in operator v0.74.1 - VTAgent arrives in v0.75.0,
# which is still a release candidate. This runs the same vtagent binary the CRD
# will run, under the names the operator would generate, so replacing this with
# a VTAgent object later leaves the service DNS unchanged.
apiVersion: v1
kind: Service
metadata:
  name: vtagent-traces
  labels:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
  ports:
    - name: http
      port: 10429
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: vtagent-traces-headless
  labels:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
  ports:
    - name: http
      port: 10429
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vtagent-traces
  labels:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
spec:
  replicas: 2
  serviceName: vtagent-traces-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: vtagent
      app.kubernetes.io/instance: traces
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vtagent
        app.kubernetes.io/instance: traces
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vtagent
          image: victoriametrics/vtagent:v0.11.1
          imagePullPolicy: IfNotPresent
          args:
            - -httpListenAddr=:10429
            - -remoteWrite.url=http://vtsingle-traces-a.observability.svc.cluster.local:10428/insert/native
            - -remoteWrite.url=http://vtsingle-traces-b.observability.svc.cluster.local:10428/insert/native
            - -remoteWrite.tmpDataPath=/vtagent-data
            - -remoteWrite.maxDiskUsagePerURL=20GiB
          ports:
            - containerPort: 10429
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /vtagent-data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
      nodeSelector:
        purpose: observability
      tolerations:
        - key: purpose
          operator: Equal
          value: observability
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vtagent
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: studio-observability-premium-v2
        resources:
          requests:
            storage: 50Gi
---
# The operator writes this for the VMAgent and VLAgent; vtagent has no CRD in
# v0.74.1, so its PodDisruptionBudget is written by hand. One replica per node,
# so a voluntary disruption may only take one at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vtagent-traces
  labels:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vtagent
      app.kubernetes.io/instance: traces
