# Trace storage, same disk-bound retention shape as logs.
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: traces-a
  annotations:
    # Never pruned by Flux; see the note on the VMSingle in metrics.yaml.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Same hardened pod and container security context as the rest of the stack;
  # see the note in metrics.yaml.
  useStrictSecurity: true
  # Storage never calls the Kubernetes API, so the pod gets no token.
  disableAutomountServiceAccountToken: true
  image:
    repository: victoriametrics/victoria-traces
    tag: v0.11.1
  retentionPeriod: 100y
  secrets:
    - observability-backend-auth-keys
  extraArgs:
    retention.maxDiskUsagePercent: "80"
    # Admin auth keys; see logs.yaml.
    forceMergeAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/force-merge
    forceFlushAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/force-flush
    partitionManageAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/partition-manage
    logNewStreamsAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/log-new-streams
    pprofAuthKey: file:///etc/vm/secrets/observability-backend-auth-keys/pprof
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: studio-observability-premium-v2
    resources:
      requests:
        storage: 512Gi
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      memory: 16Gi
  nodeSelector:
    purpose: observability
  tolerations:
    - key: purpose
      operator: Equal
      value: observability
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: vtsingle
          topologyKey: kubernetes.io/hostname
---
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: traces-b
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
