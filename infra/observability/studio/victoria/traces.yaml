---
# The trace agent has no CRD in operator v0.74.1 - VTAgent arrives in v0.75.0,
# which is still a release candidate. Until then vtagent runs as the Service,
# StatefulSet and PodDisruptionBudget the v0.75.0-rc1 operator generates for
#
#   apiVersion: operator.victoriametrics.com/v1
#   kind: VTAgent
#   metadata:
#     name: traces
#   spec:
#     replicaCount: 2
#     useStrictSecurity: true
#     disableAutomountServiceAccountToken: true
#     podDisruptionBudget:
#       maxUnavailable: 1
#     remoteWrite: the two URLs below
#     remoteWriteSettings:
#       maxDiskUsagePerURL: 20GiB
#     storage: the volumeClaimTemplate below
#     plus the image, resources and placement below
#
# with the same names, labels, selector, service name, claim name, flags,
# ports, probes and security context, so that switching to that object adopts
# these rather than replacing them. The selector, the service name and the claim
# template are what the operator cannot change in place. Two differences are
# left, both updated in place at the switch: the operator runs its pods as a
# vtagent-traces service account it creates, where these run as the namespace
# default with no token, so adoption rolls the pods once; and it sets the
# OnDelete update strategy because it rolls pods itself, which nothing does
# here, so this keeps the default RollingUpdate.
apiVersion: v1
kind: Service
metadata:
  name: vtagent-traces
  labels:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
    app.kubernetes.io/component: monitoring
    managed-by: vm-operator
  annotations:
    # So that removing these objects from Git at the switch hands them to the
    # operator instead of Flux deleting them first.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Headless, as the operator makes it, and the StatefulSet's governing Service.
  # Cluster DNS returns the ready replicas' addresses.
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
    app.kubernetes.io/component: monitoring
    managed-by: vm-operator
  ports:
    - name: http
      protocol: TCP
      port: 10429
      targetPort: 10429
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vtagent-traces
  labels:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
    app.kubernetes.io/component: monitoring
    managed-by: vm-operator
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  replicas: 2
  serviceName: vtagent-traces
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: vtagent
      app.kubernetes.io/instance: traces
      app.kubernetes.io/component: monitoring
      managed-by: vm-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vtagent
        app.kubernetes.io/instance: traces
        app.kubernetes.io/component: monitoring
        managed-by: vm-operator
    spec:
      # vtagent never calls the Kubernetes API.
      automountServiceAccountToken: false
      # The operator's strict security context, as on the other components.
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: vtagent
          image: victoriametrics/vtagent:v0.11.1
          imagePullPolicy: IfNotPresent
          # In the operator's order and form: sorted, with the remote write
          # URLs as one comma-separated flag. -tmpDataPath rather than
          # -remoteWrite.tmpDataPath, because vtagent keeps its queues in a
          # subdirectory of -tmpDataPath, and the operator sets that flag; the
          # other would put them somewhere the operator's pods do not look.
          args:
            - -httpListenAddr=:10429
            - -remoteWrite.maxDiskUsagePerURL=20GiB
            - -remoteWrite.url=http://vtsingle-traces-a.observability.svc.cluster.local:10428/insert/native,http://vtsingle-traces-b.observability.svc.cluster.local:10428/insert/native
            - -tmpDataPath=/vtagent-data
          ports:
            - name: http
              containerPort: 10429
              protocol: TCP
          volumeMounts:
            - name: tmp-data
              mountPath: /vtagent-data
          livenessProbe:
            httpGet:
              path: /health
              port: 10429
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 10429
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          # The operator's default preStop hook, so a replica leaves the
          # Service's DNS answers before it stops accepting writes.
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          terminationMessagePolicy: FallbackToLogsOnError
      nodeSelector:
        purpose: observability
      tolerations:
        - key: purpose
          operator: Equal
          value: observability
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vtagent
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - metadata:
        name: tmp-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: studio-observability-premium-v2
        resources:
          requests:
            storage: 50Gi
---
# One replica per node, so a voluntary disruption may only take one at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vtagent-traces
  labels:
    app.kubernetes.io/name: vtagent
    app.kubernetes.io/instance: traces
    app.kubernetes.io/component: monitoring
    managed-by: vm-operator
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vtagent
      app.kubernetes.io/instance: traces
      app.kubernetes.io/component: monitoring
      managed-by: vm-operator
