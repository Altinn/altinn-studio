---
# Both instances of each pair: writes from the pair's agent, reads from the
# proxy, on the one HTTP port that serves both.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmsingle-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: metrics
        - podSelector:
            matchLabels:
              app: observability-proxy
      ports:
        - protocol: TCP
          port: 8428
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vtsingle-traces
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vtsingle
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vtagent
              app.kubernetes.io/instance: traces
        - podSelector:
            matchLabels:
              app: observability-proxy
      ports:
        - protocol: TCP
          port: 10428
---
apiVersion: networking.k8s.io/v1
