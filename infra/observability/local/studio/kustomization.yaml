apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The observability-proxy on the devenv kind fixture (src/Runtime/devenv, run with
# monitoring), light profile: the proxy writes to the single-instance backend in
# ../victoria directly. ../studio-common has what both profiles share.
resources:
  - ../../studio/overlay

components:
  - ../studio-common

patches:
  - path: proxy.yaml
