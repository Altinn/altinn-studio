# The light profile: one replica, which writes straight to the one storage instance per
# signal in ../victoria, as there are no agents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-proxy
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: observability-proxy
          env:
            # Without agents, writes go straight to storage, which accepts the
            # same OTLP paths. Both read addresses name the one instance, since
            # a configured list can be overridden entry by entry but not shortened.
            - name: ObservabilityProxy__Downstreams__Agents__Metrics
              value: http://vmsingle-metrics-a:8428
            - name: ObservabilityProxy__Downstreams__Agents__Traces
              value: http://vtsingle-traces-a:10428
            - name: ObservabilityProxy__Downstreams__Agents__Logs
              value: http://vlsingle-logs-a:9428
            - name: ObservabilityProxy__Downstreams__Storage__Metrics__0
              value: http://vmsingle-metrics-a:8428
            - name: ObservabilityProxy__Downstreams__Storage__Metrics__1
              value: http://vmsingle-metrics-a:8428
            - name: ObservabilityProxy__Downstreams__Storage__Traces__0
              value: http://vtsingle-traces-a:10428
            - name: ObservabilityProxy__Downstreams__Storage__Traces__1
              value: http://vtsingle-traces-a:10428
            - name: ObservabilityProxy__Downstreams__Storage__Logs__0
              value: http://vlsingle-logs-a:9428
            - name: ObservabilityProxy__Downstreams__Storage__Logs__1
              value: http://vlsingle-logs-a:9428
