apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ../syncroot for the full monitoring profile: the same syncroot entries, reconciling the
# full Studio and Victoria overlays (../studio-full, ../victoria-full) instead of the
# light ones. Applied by devenv (src/Runtime/devenv, run with --monitoring-profile full).
resources:
  - ../syncroot

patches:
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./local/studio-full
    target:
      kind: Kustomization
      namespace: default
      name: observability
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./local/victoria-full
    target:
      kind: Kustomization
      name: observability-victoria
