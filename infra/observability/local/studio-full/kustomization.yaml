apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The observability-proxy on the devenv kind fixture, full profile: production's
# configuration, writing to the agents and reading from both storage copies in
# ../victoria-full, with production's two replicas, one per node. ../studio-common has
# what both profiles share.
resources:
  - ../../studio/overlay

components:
  - ../studio-common

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: observability-proxy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
