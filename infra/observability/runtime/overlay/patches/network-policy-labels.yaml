apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-router-ingress
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              altinn.studio/runtime: "true"
        # Apps, and kubernetes-wrapper, which runs among them. Kubernetes sets this label on
        # every namespace, and default has no altinn.studio/runtime label.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        # The platform's collector, which forwards Traefik's spans so app traces keep their
        # ingress span.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        # Linkerd rewrites meshed ingress to the proxy's inbound port.
        - protocol: TCP
          port: 4143
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
