apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-router
spec:
  config:
    processors:
      # A service owner's own cluster runs only its services, so they all work for it. insert,
      # not upsert: a service that sets its own value keeps it. Studio's router has none, as its
      # services set altinn.service_owner per unit of work.
      resource/service_owner:
        attributes:
          - key: altinn.service_owner
            value: ${SERVICEOWNER_ID}
            action: insert
      # k8s_attributes keeps a value the sender has already set, so a service could otherwise
      # choose the attributes transform/route reads. Remove them first: then they come only
      # from the pod that k8s_attributes finds by the sender's k8s.pod.uid.
      resource/untrusted:
        attributes:
          - key: k8s.namespace.name
            action: delete
          - key: k8s.deployment.name
            action: delete
          - key: altinn.k8s.namespace.runtime
            action: delete
          - key: altinn.telemetry.route
            action: delete
      # Finds the pod only by k8s.pod.uid, which every workload here sets from the downward API
      # (the app chart, our deployments, and the platform's collector for Traefik). Base's
      # fallbacks would let a service name another pod by its IP, which is easy to learn, and
      # the connection's address is the router's own Linkerd proxy, which matches no pod.
      # Telemetry without a known pod gets no namespace and no route.
      #
      # Also extracts the namespace's altinn.studio/runtime label, the one otel-router-ingress
      # admits our namespaces by. transform/route reads it and then removes it.
      k8s_attributes:
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          labels:
            - tag_name: altinn.k8s.namespace.runtime
              key: altinn.studio/runtime
              from: namespace
      # Where each resource's telemetry goes, from the pod k8s_attributes found, never from
      # what the service says about itself. The gateway routes on altinn.telemetry.route and
      # removes it before export. Later statements win:
      #   studio   our services, in the namespaces labeled altinn.studio/runtime, and
      #            kubernetes-wrapper, which runs among the apps
      #   apps     apps, which are everything else in default
      #   ingress  Traefik, which the platform's collector forwards from the traefik namespace.
      #            Its spans start the traces of requests through it. The gateway sends those
      #            of requests to our services where ours go, and the rest only to Victoria.
      #            Most of them are apps' traffic, so they take apps' queues here.
      # Anything else gets no route and is dropped (routing/*, filter/unrouted).
      transform/route:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements: &route
              - set(resource.attributes["altinn.telemetry.route"], "studio") where resource.attributes["altinn.k8s.namespace.runtime"] == "true"
              - set(resource.attributes["altinn.telemetry.route"], "apps") where resource.attributes["k8s.namespace.name"] == "default"
              - set(resource.attributes["altinn.telemetry.route"], "studio") where resource.attributes["k8s.namespace.name"] == "default" and resource.attributes["k8s.deployment.name"] == "kuberneteswrapper-kubernetes-api-wrapper"
              - set(resource.attributes["altinn.telemetry.route"], "ingress") where resource.attributes["k8s.namespace.name"] == "traefik"
              - delete_key(resource.attributes, "altinn.k8s.namespace.runtime")
        metric_statements:
          - context: resource
            statements: *route
        log_statements:
          - context: resource
            statements: *route
      # Telemetry from a pod transform/route doesn't know. Dropped rather than sent to our
      # workspace or the service owner's. otelcol_processor_filter_*_filtered counts it, by
      # processor and pipeline.
      filter/unrouted:
        error_mode: ignore
        traces:
          span: ['true']
        metrics:
          metric: ['true']
        logs:
          log_record: ['true']

    # Apps' telemetry, and Traefik's, which is mostly apps' traffic, gets exporters and
    # queues of its own, so a flood from apps fills only its own queue and our telemetry still
    # reaches the gateway.
    connectors:
      routing/traces:
        default_pipelines: [traces/unrouted]
        table:
          - condition: resource.attributes["altinn.telemetry.route"] == "apps" or resource.attributes["altinn.telemetry.route"] == "ingress"
            pipelines: [traces/apps]
          - condition: resource.attributes["altinn.telemetry.route"] != nil
            pipelines: [traces/studio]
      routing/metrics:
        default_pipelines: [metrics/unrouted]
        table:
          - condition: resource.attributes["altinn.telemetry.route"] == "apps" or resource.attributes["altinn.telemetry.route"] == "ingress"
            pipelines: [metrics/apps]
          - condition: resource.attributes["altinn.telemetry.route"] != nil
            pipelines: [metrics/studio]
      routing/logs:
        default_pipelines: [logs/unrouted]
        table:
          - condition: resource.attributes["altinn.telemetry.route"] == "apps" or resource.attributes["altinn.telemetry.route"] == "ingress"
            pipelines: [logs/apps]
          - condition: resource.attributes["altinn.telemetry.route"] != nil
            pipelines: [logs/studio]

    exporters:
      load_balancing/traces: &load_balancing
        routing_key: traceID
        # Queue and retry here, not per gateway, so a retried export picks its gateway from the
        # current ring instead of being dropped with a gateway that has left it.
        timeout: 10s # two gateways during a rollout, each within the per-gateway 5s default
        retry_on_failure: # Collector defaults in full; unset, they are 0 here (0.161.0)
          enabled: true
          initial_interval: 5s # also the DNS resolver's default refresh interval
          randomization_factor: 0.5
          multiplier: 1.5
          max_interval: 30s
          max_elapsed_time: 300s # hold data through a gateway outage, up to the queue size
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: 8388608 # 8 MiB serialized, several times that in memory; the router has 256Mi
        protocol:
          otlp:
            tls:
              insecure: true
            retry_on_failure:
              enabled: false # a failure goes back to the retry above
            sending_queue:
              enabled: false # a queue here would accept the batch and tie it to one gateway
        resolver:
          dns:
            hostname: otel-gateway-collector-headless.runtime-obs.svc.cluster.local
            port: '4317'
      load_balancing/logs: *load_balancing
      load_balancing/metrics: &load_balancing_metrics
        <<: *load_balancing
        # Metrics carry no trace ID; each resource's series stay on one gateway.
        routing_key: resource
      load_balancing/apps_traces: *load_balancing
      load_balancing/apps_logs: *load_balancing
      load_balancing/apps_metrics: *load_balancing_metrics
      nop: {}

    service:
      pipelines:
        # The router's pipelines start here, at the receiver, and classify; routing/* hands each
        # resource on to the pipeline for its route.
        traces/in:
          receivers: [otlp]
          processors: [memory_limiter, resource/untrusted, resource_detection/aks, k8s_attributes, transform/route, resource/environment, resource/service_owner, transform/drop]
          exporters: [routing/traces]
        traces/studio:
          receivers: [routing/traces]
          processors: [batch]
          exporters: [load_balancing/traces]
        traces/apps:
          receivers: [routing/traces]
          processors: [batch]
          exporters: [load_balancing/apps_traces]
        traces/unrouted:
          receivers: [routing/traces]
          processors: [filter/unrouted]
          exporters: [nop]
        metrics/in:
          receivers: [otlp]
          processors: [memory_limiter, filter/exporter_calls, resource/untrusted, resource_detection/aks, k8s_attributes, transform/route, resource/environment, resource/service_owner, transform/drop]
          exporters: [routing/metrics]
        metrics/studio:
          receivers: [routing/metrics]
          processors: [batch]
          exporters: [load_balancing/metrics]
        metrics/apps:
          receivers: [routing/metrics]
          processors: [batch]
          exporters: [load_balancing/apps_metrics]
        metrics/unrouted:
          receivers: [routing/metrics]
          processors: [filter/unrouted]
          exporters: [nop]
        # filter/logs, base's WARN and above, applies to apps as to our services. A per-app level
        # from deployment/app.yaml (#21792) would come from a label on the app's Deployment,
        # which k8s_attributes reads, so it comes after transform/route.
        logs/in:
          receivers: [otlp]
          processors: [memory_limiter, resource/untrusted, resource_detection/aks, k8s_attributes, transform/route, filter/logs, resource/environment, resource/service_owner, transform/drop]
          exporters: [routing/logs]
        logs/studio:
          receivers: [routing/logs]
          processors: [batch]
          exporters: [load_balancing/logs]
        logs/apps:
          receivers: [routing/logs]
          processors: [batch]
          exporters: [load_balancing/apps_logs]
        logs/unrouted:
          receivers: [routing/logs]
          processors: [filter/unrouted]
          exporters: [nop]
