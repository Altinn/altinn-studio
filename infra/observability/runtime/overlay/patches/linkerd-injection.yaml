apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
spec:
  podAnnotations:
    linkerd.io/inject: "enabled"
    config.linkerd.io/skip-outbound-ports: "443"
    # Linkerd runs as a regular sidecar: keep the proxy up through the Collector's 10s preStop
    # and its flush, then let it drain; 25s + 10s fits the 40s termination grace period.
    config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "25"
    config.linkerd.io/shutdown-grace-period: "10s"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-router
spec:
  podAnnotations:
    linkerd.io/inject: "enabled"
    config.linkerd.io/skip-outbound-ports: "443"
    # Linkerd runs as a regular sidecar: keep the proxy up through the Collector's 10s preStop
    # and its flush, then let it drain; 25s + 10s fits the 40s termination grace period.
    config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "25"
    config.linkerd.io/shutdown-grace-period: "10s"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
