apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
spec:
  podAnnotations:
    linkerd.io/inject: "enabled"
    config.linkerd.io/skip-outbound-ports: "443"
    # Graceful shutdown relies on Kubernetes stopping the proxy only after the Collector has
    # exited, so it runs as a native sidecar, with no wait before exit, and gets 5s to drain.
    # The wait is "0" rather than absent: the operator leaves an annotation it no longer sets.
    config.beta.linkerd.io/proxy-enable-native-sidecar: "true"
    config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "0"
    config.linkerd.io/shutdown-grace-period: "5s"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-router
spec:
  podAnnotations:
    linkerd.io/inject: "enabled"
    config.linkerd.io/skip-outbound-ports: "443"
    # Graceful shutdown relies on Kubernetes stopping the proxy only after the Collector has
    # exited, so it runs as a native sidecar, with no wait before exit, and gets 5s to drain.
    # The wait is "0" rather than absent: the operator leaves an annotation it no longer sets.
    config.beta.linkerd.io/proxy-enable-native-sidecar: "true"
    config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "0"
    config.linkerd.io/shutdown-grace-period: "5s"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
