apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
spec:
  podAnnotations:
    linkerd.io/inject: "enabled"
    config.linkerd.io/skip-outbound-ports: "443"
    # Linkerd runs as a regular sidecar: keep the proxy up through the Collector's 60s preStop
    # and 30s shutdown, then let it drain; 90s + 20s fits the 120s termination grace period.
    config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "90"
    config.linkerd.io/shutdown-grace-period: "20s"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-router
spec:
  podAnnotations:
    linkerd.io/inject: "enabled"
    config.linkerd.io/skip-outbound-ports: "443"
    # Linkerd runs as a regular sidecar: keep the proxy up through the Collector's 60s preStop
    # and 30s shutdown, then let it drain; 90s + 20s fits the 120s termination grace period.
    config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "90"
    config.linkerd.io/shutdown-grace-period: "20s"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
