# Appended to base's env, which the Collector's own metrics need; a strategic merge patch
# would replace the whole list, as the list has no merge key in a custom resource.
- op: add
  path: /spec/env/-
  value:
    name: CONTROL_PLANE_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: control-plane-azure-monitor-secret
        key: connection-string
- op: add
  path: /spec/env/-
  value:
    name: DATA_PLANE_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: data-plane-azure-monitor-secret
        key: connection-string
