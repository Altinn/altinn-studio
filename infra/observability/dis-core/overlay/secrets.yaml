# The token the gateway authenticates to Studio's observability ingest with: dis-core-nonprod in
# at22, at23, yt01 and tt02, dis-core-prod in prod. Until someone writes it to the Vault, this
# ExternalSecret is not ready and the gateway sends nothing to Victoria, which is why the Flux
# Kustomization doesn't wait for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-ingest-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: observability-secret-store
  target:
    name: observability-ingest-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: observability-ingest-token
