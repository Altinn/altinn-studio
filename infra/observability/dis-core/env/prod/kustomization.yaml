apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Flux Kustomization observability, which applies ./dis-core/env/prod/app from the same
# artifact, with pruning. The artifact's ./prod folder, which the product's root Kustomization
# applies without pruning, points here (build.sh).
resources:
  - ../../flux-kustomization

patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: observability
    patch: |-
      - op: replace
        path: /spec/path
        value: ./dis-core/env/prod/app
      - op: replace
        path: /spec/postBuild/substitute
        value:
          ENVIRONMENT: prod
          K8S_CLUSTER_NAME: dis-core-prod-aks
