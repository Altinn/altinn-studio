apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvt
  namespace: nvt
spec:
  chartRef:
    kind: OCIRepository
    name: nvt-chart
    namespace: nvt
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 5m
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              kind: Deployment
              name: nvt-(broker|operator|agent-gateway|credential-portal|github-comments-producer)
              version: v1
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  purpose: nvt-agent
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - effect: NoSchedule
                    key: purpose
                    operator: Equal
                    value: nvt-agent
          - target:
              group: apps
              kind: Deployment
              name: nvt-broker
              version: v1
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  limits:
                    cpu: "1"
                    memory: 2Gi
                  requests:
                    cpu: 250m
                    memory: 512Mi
          - target:
              group: apps
              kind: Deployment
              name: nvt-operator
              version: v1
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  limits:
                    cpu: "1"
                    memory: 1Gi
                  requests:
                    cpu: 250m
                    memory: 512Mi
          - target:
              group: apps
              kind: Deployment
              name: nvt-agent-gateway
              version: v1
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  limits:
                    cpu: 500m
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi
  releaseName: nvt
  targetNamespace: nvt
  timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  values:
    agentSchedule:
      enabled: true
      maxParallelism: 2
      name: default
      producerPolicies:
        - defaultWorkflow: implement-pr
          identity: system:serviceaccount:nvt:nvt-github-comments-producer
          allowedPrincipalIssuers:
            - https://github.com
          workflows:
            - implement-pr
            - review-pr
            - generic-run
      principalCredentialSelection:
        enabled: true
        onNoMatch: deny
        templateProfiles:
          - profile: member-codex
            template: codex-member
          - profile: member-claude
            template: claude-member
      profiles:
        - agentRuntimeConfig:
            command: codex
            proxy:
              provider: $principal-account
            resume:
              command: codex
              args:
                - resume
                - --last
                - --sandbox
                - danger-full-access
                - --ask-for-approval
                - never
          broker:
            grants:
              - egressHosts:
                  - chatgpt.com:443
                  - api.openai.com:443
                  - auth.openai.com:443
                materialization: placeholder-file
                provider: $principal-account
                repositories:
                  - Altinn/altinn-studio
              - egressHosts:
                  - github.com:443
                  - api.github.com:443
                git: true
                materialization: header-inject
                permissions:
                  checks: read
                  contents: write
                  issues: write
                  pull_requests: write
                  workflows: write
                provider: github-main
                repositories:
                  - Altinn/altinn-studio
          egress: mediated
          egressEnforcement: true
          egressTransport: transparent
          execution:
            kind: pod
            driver: kubernetes
          name: member-codex
          runtime:
            autonomy: trusted-local
            effort: high
            model: gpt-5.6-sol
            container:
              capabilities:
                add:
                  - SYS_PTRACE
            docker:
              kernelLogDevice: true
              requiredNetworks:
                - name: kind
                  subnet: 172.31.250.0/24
            type: codex
            user: root
        - agentRuntimeConfig:
            command: claude
            proxy:
              provider: $principal-account
            resume:
              command: claude
              args:
                - --continue
                - --dangerously-skip-permissions
          broker:
            grants:
              - egressHosts:
                  - api.anthropic.com:443
                  - mcp-proxy.anthropic.com:443
                materialization: placeholder-file
                provider: $principal-account
                repositories:
                  - Altinn/altinn-studio
              - egressHosts:
                  - github.com:443
                  - api.github.com:443
                git: true
                materialization: header-inject
                permissions:
                  checks: read
                  contents: write
                  issues: write
                  pull_requests: write
                  workflows: write
                provider: github-main
                repositories:
                  - Altinn/altinn-studio
          egress: mediated
          egressEnforcement: true
          egressTransport: transparent
          execution:
            kind: pod
            driver: kubernetes
          name: member-claude
          runtime:
            autonomy: trusted-local
            docker:
              kernelLogDevice: true
              requiredNetworks:
                - name: kind
                  subnet: 172.31.250.0/24
            type: claude
            user: non-root
      workflowProfiles:
        - name: implement-pr
          lifecycle:
            completeOn:
              - plugin.github.pr.merged
              - plugin.github.pr.closed
            failOn:
              - plugin.agent.signal.failed
          workspaceInstructions: |
            - Install any tool needed for the task. For system packages, use `nvt-as-root <command>`; it runs directly as root or through passwordless sudo for non-root agents.
            - Work directly in the `Altinn/altinn-studio` checkout and push task branches to its `origin`; do not use a fork.
            - Create and update pull requests with `gh-auth --provider github-main --repo Altinn/altinn-studio`.
            - Use a Conventional Commits prefix in PR titles, such as `feat:`, `fix:`, `docs:`, `refactor:`, `test:`, or `chore:`.
            - Register the created pull request with `github-watch`. Do not invoke `nvt-work complete`; this workflow ends only when the pull request is merged or closed.
        - name: review-pr
          lifecycle:
            completeOn:
              - plugin.work.completed
            failOn:
              - plugin.work.failed
          workspaceInstructions: |
            - Install any tool needed for the review. For system packages, use `nvt-as-root <command>`; it runs directly as root or through passwordless sudo for non-root agents.
            - Work directly in the `Altinn/altinn-studio` checkout and use `gh-auth --provider github-main --repo Altinn/altinn-studio` for GitHub operations.
            - Post the review to the source pull request, then invoke `nvt-work complete`. Invoke `nvt-work fail` only when the result cannot be delivered.
        - name: generic-run
          lifecycle:
            completeOn:
              - plugin.work.completed
            failOn:
              - plugin.work.failed
          workspaceInstructions: |
            - Install any tool needed for the task. For system packages, use `nvt-as-root <command>`; it runs directly as root or through passwordless sudo for non-root agents.
            - Work directly in the `Altinn/altinn-studio` checkout and use `gh-auth --provider github-main --repo Altinn/altinn-studio` for GitHub operations.
            - Post the final result to the source thread, then invoke `nvt-work complete`. Invoke `nvt-work fail` only when the result cannot be delivered.
      suspend: false
      template:
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "2"
            memory: 8Gi
        agent:
          config:
            preseed:
              files:
                - path: "$HOME/.claude/settings.json"
                  mode: "0600"
                  overwrite: false
                  json:
                    theme: dark-daltonized
                    skipDangerousModePermissionPrompt: true
                    env:
                      DISABLE_AUTOUPDATER: "1"
                - path: "$HOME/.claude.json"
                  mode: "0600"
                  overwrite: false
                  json:
                    hasCompletedOnboarding: true
                    bypassPermissionsModeAccepted: true
                    projects:
                      /workspace:
                        hasTrustDialogAccepted: true
                - path: "$HOME/.codex/config.toml"
                  mode: "0600"
                  overwrite: false
                  content: |
                    check_for_update_on_startup = false

                    [notice]
                    hide_rate_limit_model_nudge = true

                    [projects."/workspace"]
                    trust_level = "trusted"
            plugins:
              - config:
                  default-provider: github-main
                  providers:
                    - broker-provider: github-main
                      credential-kind: mediated
                      match:
                        - github.com/Altinn/altinn-studio
                      name: github-main
                      type: broker
                name: git-host-credentials
                source: builtin
              - config:
                  credentials:
                    - identity:
                        mode: explicit
                        name: "nvt-agent[bot]"
                        email: "289161147+nvt-agent[bot]@users.noreply.github.com"
                      match: https://github.com/Altinn/altinn-studio
                      provider: github-main
                      username: x-access-token
                name: git-credentials
                source: builtin
                when: before-agent
              - config:
                  repos:
                    - path: altinn-studio
                      url: https://github.com/Altinn/altinn-studio.git
                name: checkout-repos
                restart: never
                source: builtin
                when: before-agent
              - name: work-control
                source: builtin
              - config:
                  ignored-comment-prefixes:
                    - /nvtagent
                    - /nvtlocal
                  poll-seconds: 60
                egress:
                  provider: github-main
                name: github-watcher
                restart: always
                source: builtin
                when: after-agent
            tools:
              packages:
                - git
                - jq
        lifecycle:
          completeOn:
            - plugin.github.pr.merged
            - plugin.github.pr.closed
            - plugin.agent.signal.done
          failOn:
            - plugin.agent.signal.failed
        runtimeClassName: kata-vm-isolation
        tolerations:
          - effect: NoSchedule
            key: purpose
            operator: Equal
            value: nvt-agent
        ttl:
          activeDeadlineSeconds: 259200
          completedTTLSeconds: 300
          failedTTLSeconds: 3600
          runRetentionSeconds: 2592000
        workspace:
          mode: Persistent
          size: 30Gi
          storageClassName: nvt-managed-csi
    broker:
      dynamicAccountAssertionRotationEpoch: "2026-08-12-1"
      config:
        dynamic-accounts:
          enabled: true
          state-dir: /state/principal-accounts
          authentication:
            hmac-key-env: NVT_DYNAMIC_ACCOUNT_ASSERTION_KEY
          template-switching:
            enabled: true
            operator-hmac-key-env: NVT_DYNAMIC_ACCOUNT_COORDINATION_KEY
          provider-templates:
            - name: principal-codex
              plugin: codex-oauth
              credential-config-key: auth-file
              config:
                injection-claim-headers:
                  - claim-path:
                      - https://api.openai.com/auth
                      - chatgpt_account_id
                    header: chatgpt-account-id
                injection-hosts:
                  - chatgpt.com
                  - api.openai.com
                  - auth.openai.com
                placeholder-file:
                  hosts:
                    - chatgpt.com
                    - api.openai.com
                    - auth.openai.com
                  id-token-claims:
                    - claim: chatgpt_account_id
                      claim-path:
                        - https://api.openai.com/auth
                        - chatgpt_account_id
                  path: .codex/auth.json
            - name: principal-claude
              plugin: claude-oauth
              credential-config-key: credentials-file
              config:
                injection-extra-headers:
                  anthropic-beta: oauth-2025-04-20
                injection-hosts:
                  - api.anthropic.com
                  - mcp-proxy.anthropic.com
                placeholder-file:
                  hosts:
                    - api.anthropic.com
                    - mcp-proxy.anthropic.com
                  path: .claude/.credentials.json
          credential-templates:
            - name: codex-member
              label: Codex
              enrollment-adapter: codex-oauth-file
              provider-template: principal-codex
            - name: claude-member
              label: Claude Code
              enrollment-adapter: claude-oauth-file
              provider-template: principal-claude
        providers:
          - allow:
              methods:
                - GET
                - POST
                - PATCH
                - PUT
              permissions:
                checks: read
                contents: write
                issues: write
                pull_requests: write
                workflows: write
              repositories:
                - Altinn/altinn-studio
            config:
              api-url: https://api.github.com
              app-id-env: NVT_GITHUB_APP_ID
              injection-hosts:
                - github.com
                - api.github.com
              installation-id-env: NVT_GITHUB_APP_INSTALLATION_ID
              private-key-base64-env: NVT_GITHUB_APP_PRIVATE_KEY_BASE64
            name: github-main
            plugin: github-app
      envSecretName: nvt-broker-env
      persistence:
        enabled: true
        seedSecretName: nvt-portal-seed
        seedTargetDir: auth
        size: 10Gi
        storageClassName: nvt-managed-csi
      tls:
        enabled: true
    operator:
      principalAccounts:
        enabled: true
        brokerURL: https://nvt-broker:7347
        ca:
          existingSecret: nvt-broker-tls
          key: ca.crt
        authentication:
          existingSecret: nvt-broker-env
          key: NVT_DYNAMIC_ACCOUNT_ASSERTION_KEY
        templateSwitching:
          enabled: true
          authentication:
            existingSecret: nvt-broker-env
            key: NVT_DYNAMIC_ACCOUNT_COORDINATION_KEY
    credentialPortal:
      enabled: true
      publicURL: https://staging.altinn.studio/agents/credentials
      maxUploadBytes: 786432
      enrollment:
        experimentalCodexDeviceAuth: true
      recoveryUpload:
        enabled: true
      dynamic:
        enabled: true
        broker:
          url: https://nvt-broker:7347
          ca:
            existingSecret: nvt-broker-tls
            key: ca.crt
          authentication:
            existingSecret: nvt-broker-env
            key: NVT_DYNAMIC_ACCOUNT_ASSERTION_KEY
        templateSwitch:
          enabled: true
          coordinatorURL: http://nvt-operator:8082
        templates:
          - name: codex-member
            label: Codex
            adapter: codex-oauth-file
          - name: claude-member
            label: Claude Code
            adapter: claude-oauth-file
      auth:
        eligibility:
          default: deny
          rules:
            - id: altinn-studio-team
              effect: allow
              where:
                array: teams[]
                all:
                  - claimPath: organization.login
                    values:
                      - Altinn
                  - claimPath: slug
                    values:
                      - team-altinn-studio
        claimEnrichment:
          allowedHosts:
            - api.github.com
          limits:
            maxResponseBytes: 262144
            maxArrayItems: 60
            maxTotalNodes: 4096
          sources:
            - endpoint: https://api.github.com/user/teams
              outputClaim: teams
              valuePath: $
              pagination:
                mode: link
                maxPages: 2
        mode: oauth2
        session:
          existingSecret: nvt-credential-portal-session
          cookieName: nvt_credential_portal
          maxAgeSeconds: 3600
          secure: true
        oauth2:
          authorizationURL: https://github.com/login/oauth/authorize
          callbackPath: /oauth2/callback
          clientAuthMethod: client_secret_post
          credentials:
            existingSecret: nvt-gateway-github
          identity:
            allowedHosts:
              - api.github.com
            displayNamePath: login
            endpoint: https://api.github.com/user
            subjectPath: id
          issuer: https://github.com
          scopes: []
          tokenURL: https://github.com/login/oauth/access_token
      slots: []
      networkPolicy:
        egressTCPPorts:
          - 443
          - 7347
          - 8082
    egress:
      allowInsecureUpstreams: false
      defaultMode: mediated
      denyCIDRs:
        - 10.48.0.0/16
        - 10.250.0.0/24
      networkPolicyCapable: true
    gateway:
      auth:
        admission:
          default: deny
          rules:
            - id: altinn-studio-team
              effect: allow
              where:
                array: teams[]
                all:
                  - claimPath: organization.login
                    values:
                      - Altinn
                  - claimPath: slug
                    values:
                      - team-altinn-studio
        authorization:
          default: deny
          rules:
            - effect: allow
              id: agent-owner
              owner: true
        claimEnrichment:
          allowedHosts:
            - api.github.com
          limits:
            maxResponseBytes: 262144
            maxArrayItems: 60
            maxTotalNodes: 4096
          sources:
            - endpoint: https://api.github.com/user/teams
              outputClaim: teams
              valuePath: $
              pagination:
                mode: link
                maxPages: 2
        mode: oauth2
        oauth2:
          authorizationURL: https://github.com/login/oauth/authorize
          callbackPath: /oauth2/callback
          clientAuthMethod: client_secret_post
          credentials:
            existingSecret: nvt-gateway-github
          identity:
            allowedHosts:
              - api.github.com
            displayNamePath: login
            endpoint: https://api.github.com/user
            subjectPath: id
          issuer: https://github.com
          scopes: []
          tokenURL: https://github.com/login/oauth/access_token
        session:
          cookieDomain: ""
          existingSecret: nvt-gateway-session
          maxAgeSeconds: 3600
          secure: true
      baseDomain: ""
      credentialPortal:
        url: /agents/credentials
        label: Manage credentials
      enabled: true
      publicURL: https://staging.altinn.studio/agents
      replicas: 1
      routing:
        mode: path
    namespace:
      create: false
      name: nvt
    producer:
      allowedAuthors:
        - "*"
      enabled: true
      githubApp:
        appID: ${NVT_GITHUB_APP_ID}
        existingSecret: nvt-github-app
        installationID: ${NVT_GITHUB_APP_INSTALLATION_ID}
        privateKeyKey: private-key.pem
      idempotency:
        scope: comment
      nodeSelector:
        purpose: nvt-agent
      persistence:
        enabled: true
        size: 2Gi
        storageClass: nvt-managed-csi
      repositories:
        - name: altinn-studio
          owner: Altinn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      schedulingReactions:
        accepted: "+1"
        enabled: true
        rejected: "-1"
      submission:
        admissionMode: profiled
        mode: scheduleAdmission
        scheduleName: default
        scheduleNamespace: nvt
        tokenExpirationSeconds: 3600
        workflow: implement-pr
        commandWorkflows:
          pr-create: implement-pr
          pr-continue: implement-pr
          review: review-pr
          run: generic-run
      tolerations:
        - effect: NoSchedule
          key: purpose
          operator: Equal
          value: nvt-agent
