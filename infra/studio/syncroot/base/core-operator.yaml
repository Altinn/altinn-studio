# The core operator does the cluster work of the assistant and Designer, so that they hold no Kubernetes permission. See
# src/core/operator/README.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: core-operator
  namespace: default
spec:
  interval: 5m
  # The deploy-core-operator workflow pushes one artifact per build SHA and tags it with the environment name.
  url: oci://altinntjenestercontainerregistry.azurecr.io/altinn-studio/configs/core-operator-repo
  ref:
    tag: ${ENVIRONMENT}
  provider: azure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-operator
  namespace: default
spec:
  # No targetNamespace: the artifact sets the namespace of each object, and it has cluster-scoped RBAC for TokenReview.
  interval: 5m
  sourceRef:
    kind: OCIRepository
    name: core-operator
    namespace: default
  path: ./${ENVIRONMENT}
  prune: true
  wait: true
  timeout: 5m
