apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-kvm-device-plugin
  namespace: default
spec:
  interval: 5m
  url: oci://altinntjenestercontainerregistry.azurecr.io/altinn-studio/configs/k8s-kvm-device-plugin-repo
  ref:
    tag: ${ENVIRONMENT}
  provider: azure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-kvm-device-plugin
  namespace: default
spec:
  interval: 5m
  targetNamespace: kube-system
  sourceRef:
    kind: OCIRepository
    name: k8s-kvm-device-plugin
    namespace: default
  path: ./prod
  prune: true
  timeout: 1m
