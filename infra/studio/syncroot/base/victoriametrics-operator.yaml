apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoriametrics-operator
  namespace: default
spec:
  interval: 5m
  url: oci://altinntjenestercontainerregistry.azurecr.io/altinn-studio/configs/victoriametrics-operator-repo
  ref:
    tag: ${ENVIRONMENT}
  provider: azure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoriametrics-operator
  namespace: default
spec:
  interval: 5m
  targetNamespace: victoriametrics-operator
  sourceRef:
    kind: OCIRepository
    name: victoriametrics-operator
    namespace: default
  path: ./
  prune: true
  # The prod-only observability-victoria Kustomization, which applies the Victoria
  # custom resources, dependsOn this one so they are not applied before their CRDs
  # exist. A dependency is only satisfied once it reports Ready, and without wait
  # this Kustomization is Ready as soon as the HelmRelease object is applied, not
  # when the chart is installed. The timeout has to cover the HelmRelease install,
  # which has its own 5m timeout. The observability Kustomization does not depend
  # on this one.
  wait: true
  timeout: 10m
  postBuild:
    substitute:
      ENVIRONMENT: ${ENVIRONMENT}
