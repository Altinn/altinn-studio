apiVersion: v1
kind: Namespace
metadata:
  name: assistant-runner
  labels:
    # The runner pod runs app code. No pod in this namespace can be privileged.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: altinn-assistant-runner-repo
  namespace: default
spec:
  interval: 5m
  provider: azure
  ref:
    tag: ${ENVIRONMENT}
  timeout: 5m
  url: oci://altinntjenestercontainerregistry.azurecr.io/configs/altinn-assistant-runner-repo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: altinn-assistant-runner
  namespace: default
spec:
  targetNamespace: assistant-runner
  interval: 5m
  retryInterval: 5m
  # A Kata VM starts slower than a container.
  timeout: 5m
  prune: true
  force: false
  wait: true
  path: ./
  sourceRef:
    kind: OCIRepository
    name: altinn-assistant-runner-repo
    namespace: default
