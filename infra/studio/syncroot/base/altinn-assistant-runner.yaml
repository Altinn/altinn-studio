apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: altinn-assistant-runner-repo
  namespace: default
spec:
  interval: 5m
  provider: azure
  ref:
    tag: ${ENVIRONMENT}
  timeout: 5m
  url: oci://altinntjenestercontainerregistry.azurecr.io/configs/altinn-assistant-runner-repo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: altinn-assistant-runner
  namespace: default
spec:
  # No targetNamespace: every namespaced object in the artifact sets its namespace, and the admission policy in it is
  # cluster-scoped.
  interval: 5m
  retryInterval: 5m
  timeout: 5m
  prune: true
  wait: true
  path: ./${ENVIRONMENT}
  sourceRef:
    kind: OCIRepository
    name: altinn-assistant-runner-repo
    namespace: default
