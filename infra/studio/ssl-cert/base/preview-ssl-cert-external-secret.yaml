# Preview's certificate, for its domain of its own; see src/core/preview/README.md. The load balancer serves preview's
# host with it, in the environments its chart names in previewHosts. The certificate is in the same platform-owned
# Key Vault as Studio's, so the store and its identity are Studio's, from ssl-cert-external-secret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preview-ssl-key-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-tls-cert-store
  target:
    name: preview-ssl-key-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      data:
        preview.cert: "{{ .crt }}"
        preview.key: "{{ .key }}"
      type: Opaque
  data:
    - secretKey: crt
      remoteRef:
        key: ${PREVIEW_TLS_CERT_SECRET_NAME_CRT}
    - secretKey: key
      remoteRef:
        key: ${PREVIEW_TLS_CERT_SECRET_NAME_KEY}
