apiVersion: v1
kind: Namespace
metadata:
  name: runtime-platform-proxy
  labels:
    altinn.studio/runtime: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-environment
  namespace: runtime-platform-proxy
data:
  upgrade_channel: ${UPGRADE_CHANNEL}
  environment: ${ENVIRONMENT}
  serviceowner: ${SERVICEOWNER_ID}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: platform-proxy-repo
  namespace: runtime-platform-proxy
spec:
  interval: 5m
  provider: azure
  ref:
    tag: ${UPGRADE_CHANNEL}
  timeout: 5m
  url: oci://altinncr.azurecr.io/studio-apps/runtime-platform-proxy-repo
---
# No targetNamespace: the proxy's Role is in default, where the Secret it reads is.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-proxy
  namespace: runtime-platform-proxy
spec:
  interval: 5m
  retryInterval: 5m
  timeout: 2m
  prune: true
  force: false
  wait: true
  path: ./${ENVIRONMENT}
  sourceRef:
    kind: OCIRepository
    name: platform-proxy-repo
    namespace: runtime-platform-proxy
