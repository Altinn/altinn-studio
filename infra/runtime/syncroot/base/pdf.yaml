apiVersion: v1
kind: Namespace
metadata:
  name: pdf
---
# Apps call http://pdf-generator.pdf.svc.cluster.local/pdf. The Service has no
# endpoints; Linkerd routes the traffic client-side through pdf/pdf3, owned by pdf3-app
# in the pdf3 artifact (src/Runtime/pdf3/infra/relay/base/httproute.yaml).
apiVersion: v1
kind: Service
metadata:
  name: pdf-generator
  namespace: pdf
spec:
  type: ClusterIP
  ports:
  - name: pdf-generator
    port: 80
    protocol: TCP
    appProtocol: http
    targetPort: 3000
  selector:
    app: pdf-generator
    release: pdf-generator
