apiVersion: v1
kind: Namespace
metadata:
  name: pdf
---
# Apps call http://pdf-generator.pdf.svc.cluster.local/pdf. The Service was created
# by the removed pdf-generator HelmRelease and has no endpoints; the spec matches what
# Helm created so the live Service is adopted unchanged. Linkerd routes the traffic
# client-side to pdf3 using the HTTPRoute below.
apiVersion: v1
kind: Service
metadata:
  name: pdf-generator
  namespace: pdf
spec:
  type: ClusterIP
  ports:
  - name: pdf-generator
    port: 80
    protocol: TCP
    targetPort: 3000
  selector:
    app: pdf-generator
    release: pdf-generator
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pdf3-migration
  namespace: pdf
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: pdf-generator
    namespace: pdf
    port: 80
  rules:
  - backendRefs:
    - name: pdf3-proxy
      namespace: runtime-pdf3
      kind: Service
      port: 80
      weight: 100
