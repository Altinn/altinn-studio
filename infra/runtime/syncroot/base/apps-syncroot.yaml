apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: apps-syncroot-repo
  namespace: default
spec:
  interval: 5m
  provider: azure
  ref:
    tag: ${ENVIRONMENT}
  timeout: 5m
  url: oci://${SERVICEOWNER_ID}altinnregistry01.azurecr.io/configs/sync-root/prod
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: syncroot-apps-kustomization
  namespace: default
spec:
  targetNamespace: default
  interval: 5m
  retryInterval: 5m
  timeout: 1m
  prune: true
  force: false
  wait: false
  path: ./${ENVIRONMENT}
  postBuild:
    substitute:
      ENVIRONMENT: ${ENVIRONMENT}
  sourceRef:
    kind: OCIRepository
    name: apps-syncroot-repo
    namespace: default
  # An app's first install retries until it succeeds, such as when the cluster has to add a node first. Each app's
  # HelmRelease comes from its deploy's artifact, which only a deploy changes, so every per-app Kustomization patches
  # it here. retries: -1 uninstalls a failed install and installs again, with no limit. Upgrades keep their own
  # remediation: roll back, retry once, then stop.
  # In ttd's test clusters, the GitOps repository also holds the syncroots of Studio dev and staging, which hold
  # per-app Kustomizations of their own. So every Kustomization gets the HelmRelease patch, and a second patch that
  # hands it on to the Kustomizations it applies. Each patch matches nothing where there is nothing to patch.
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
              patch: |
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  install:
                    remediation:
                      retries: -1
            - target:
                group: kustomize.toolkit.fluxcd.io
                kind: Kustomization
              patch: |
                apiVersion: kustomize.toolkit.fluxcd.io/v1
                kind: Kustomization
                metadata:
                  name: not-used
                spec:
                  patches:
                    - target:
                        group: helm.toolkit.fluxcd.io
                        kind: HelmRelease
                      patch: |
                        apiVersion: helm.toolkit.fluxcd.io/v2
                        kind: HelmRelease
                        metadata:
                          name: not-used
                        spec:
                          install:
                            remediation:
                              retries: -1
