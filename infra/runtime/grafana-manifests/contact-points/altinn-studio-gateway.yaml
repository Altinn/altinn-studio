apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: external-grafana-altinn-studio-gateway
spec:
  name: altinn-studio-gateway
  type: webhook
  # Every sync re-encrypts authorization_credentials, which Grafana treats as a new Alertmanager
  # configuration: it restarts notification dispatch and cancels webhooks in flight to the gateway.
  # Keep periodic syncs rare; spec and token secret changes still sync immediately.
  resyncPeriod: 24h
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  settings:
    httpMethod: POST
    url: "${GATEWAY_URL}/alerts"
    authorization_scheme: Bearer
  valuesFrom:
    - targetPath: authorization_credentials
      valueFrom:
        secretKeyRef:
          name: external-grafana-altinn-studio-gateway-token
          key: token
