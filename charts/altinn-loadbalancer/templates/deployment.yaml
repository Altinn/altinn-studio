apiVersion: apps/v1
kind: Deployment
metadata:
  name: altinn-loadbalancer
  labels:
    release: altinn-loadbalancer
spec:
  selector:
    matchLabels:
      run: altinn-loadbalancer
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        run: altinn-loadbalancer
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.image.containerPorts.http }}
            - containerPort: {{ .Values.image.containerPorts.https }}
            - containerPort: {{ .Values.image.containerPorts.lhci }}
          # With the Service's Local traffic policy, a node stops passing the load balancer's
          # health probe once its pod is terminating, but the load balancer only notices after a
          # few failed probes. nginx stops accepting connections as soon as it is signaled, so
          # the pod keeps serving until new connections have moved to the replacement pod's node.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          env:
            {{- if not (hasKey $.Values.hosts $.Values.environment) }}
            {{- fail "the chosen environment has no host" }}
            {{- end }}
            {{- $host := index $.Values.hosts $.Values.environment }}
            - name: SERVER_NAME
              value: {{ $host | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.uid=$(POD_UID)"
          {{- if .Values.volumeMounts }}
          volumeMounts:
          {{- range $mount := .Values.volumeMounts }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
          {{- end }}
          {{- end }}
        {{- if .Values.sidecar.enabled }}
        - name: {{ .Values.sidecar.name }}
          image: "{{ .Values.sidecar.image}}"
          {{- if .Values.sidecar.args }}
          args:
          {{- range $arg := .Values.sidecar.args }}
            - {{ $arg }}
          {{- end }}
          {{- end }}
          {{- if .Values.sidecar.ports }}
          ports:
          {{- range $port := .Values.sidecar.ports }}
            - containerPort: {{ $port.containerPort }}
              name: {{ $port.name }}
              protocol: {{ $port.protocol }}
          {{- end }}
          {{- end }}
          {{- if .Values.sidecar.volumeMounts }}
          volumeMounts:
          {{- range $mount := .Values.sidecar.volumeMounts }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
          {{- end }}
          {{- end }}
        {{- end }}
      {{- if .Values.volumes }}
      volumes:
        {{- range $volume := .Values.volumes }}
        - name: {{ $volume.name }}
          {{- if $volume.configMap }}
          configMap:
            name: {{ $volume.configMap.name }}
          {{- end }}
          {{- if $volume.secret }}
          secret:
            secretName: {{ $volume.secret.secretName }}
          {{- end }}
        {{- end }}
      {{- end }}
