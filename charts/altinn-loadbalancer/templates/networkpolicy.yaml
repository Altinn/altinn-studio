# Egress only to the namespaces nginx proxies to, and to cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-nginx
  namespace: default
spec:
  podSelector:
    matchLabels:
      run: altinn-loadbalancer
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "default"
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "lhci"
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "observability"
  # Cluster DNS: CoreDNS in kube-system, behind the kube-dns Service, which nginx
  # resolves its upstream names through.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "kube-system"
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
