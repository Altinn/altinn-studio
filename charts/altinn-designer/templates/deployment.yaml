apiVersion: apps/v1
kind: Deployment
metadata:
  name: altinn-designer
  labels:
    release: altinn-designer
spec:
  selector:
    matchLabels:
      run: altinn-designer
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        run: altinn-designer
        {{- if .Values.serviceAccount.useWorkloadIdentity }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- if .Values.serviceAccount.useWorkloadIdentity }}
      annotations:
        azure.workload.identity/use: "true"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      # The app user of the .NET container images. No fsGroup: kubelet could then try to change the group of every file
      # on the repository share, which the share's mount options already present as owned by this user.
      securityContext:
        runAsUser: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag not set" .Values.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.image.containerPort }}
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.uid=$(POD_UID)"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            {{- if not (hasKey .Values.environmentVariables .Values.environment) }}
              {{ fail "the chosen environment does not exist" }}
            {{- end }}
            {{- $environmentVariables := index $.Values.environmentVariables $.Values.environment }}
            {{- range $variable := $environmentVariables }}
            - name: {{ $variable.name }}
              {{- if $variable.value }}
              value: {{ $variable.value | quote }}
              {{- end }}
              {{- if $variable.valueFrom }}
              valueFrom:
                {{- if $variable.valueFrom.secretKeyRef}}
                secretKeyRef:
                  name: {{ $variable.valueFrom.secretKeyRef.name }}
                  key: {{ $variable.valueFrom.secretKeyRef.key }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- if .Values.volumeMounts}}
          readinessProbe:
            # an http probe
            httpGet:
              path: /health/
              port: {{ .Values.service.internalPort }}
            # length of time to wait for a pod to initialize
            # after pod startup, before applying health checking
            initialDelaySeconds: 30
            failureThreshold: 3
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
              # an http probe
              httpGet:
                path: /health/
                port: {{ .Values.service.internalPort }}
              #  The initialDelaySeconds field tells the kubelet that it should wait 15 seconds before performing the first probe.
              initialDelaySeconds: 10
              failureThreshold: 3
              periodSeconds: 10
          {{- end }}
          volumeMounts:
            # The root filesystem is read-only, so temporary files go here.
            - name: tmp
              mountPath: /tmp
            {{- range $mount := .Values.volumeMounts}}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- range $volume := .Values.volumes }}
        - name: {{ $volume.name }}
          {{- if $volume.persistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ $volume.persistentVolumeClaim.claimName }}
          {{- end }}
          {{- if $volume.secret }}
          secret:
            secretName: {{ $volume.secret.secretName }}
          {{- end }}
      {{- end }}
      {{- if .Values.image.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.imagePullSecret }}
      {{- end }}
