# Spell check for Altinn Studio — code, identifiers, comments and docs, in
# US English. ENGINE configuration only.
#
# This file decides what typos scans and how words parse. It deliberately
# contains NO named exceptions: no extend-identifiers, no extend-words, no
# per-project excludes. Every accepted misspelling lives in
# .github/spellcheck/suppressions.mjs instead, scoped to the paths and
# identifiers where it is load-bearing and enforced by the runner — a
# suppressed token outside its scope is still reported, and a suppression
# that matches nothing is itself a finding. (typos' own mechanisms are
# repo-wide, which measurably over-suppressed: a bare `organisation`
# allowlist entry hid 1,132 findings, mostly prose.)
#
# Because policy lives in the runner, `typos` invoked directly reports
# suppressed contract tokens too — use `yarn spell:quick` (changed files) or
# `yarn spell:check` (everything) instead. For the same reason
# `typos --write-changes` must never be used: it would "fix" wire contracts.
#
# The excludes below are ENGINE decisions, three kinds only: generated or
# vendored output nobody can fix by hand, pure fixture/wire data ("spellcheck
# prose and code, never data"), and whole files written in another language
# where per-token suppression is meaningless.
#
# Run:  yarn spell:check     Fix:  yarn spell:fix     Fast: yarn spell:quick

[files]
# typos skips hidden paths by default, which would exempt everything under
# .github — including every workflow comment. Check them; only the git
# database itself is opted out.
ignore-hidden = false

extend-exclude = [
    ".git/**",

    # Agent tooling: skills are deliberately written in Norwegian, and
    # .claude/worktrees may hold entire nested checkouts of this repository.
    ".claude/**",

    # Build output, generated and vendored code. Kept even when currently
    # silent: a typo a generator emits cannot be fixed by hand, so it must
    # never block CI. The presentation HTML embeds minified reveal.js.
    "**/bin/**", "**/obj/**", "**/dist/**", "**/node_modules/**", "**/.yarn/**",
    "**/gen/**", "*.g.cs", "*.Designer.cs", "*.verified.*", "**/Migrations/**",
    "src/Runtime/workflow-engine/docs/presentation/**",

    # The spell-check harness itself: fixtures with deliberately planted
    # errors (the self-test copies them elsewhere and checks them with THIS
    # config), the Norwegian glossaries, and the suppression registry — which
    # necessarily quotes the misspellings it governs.
    ".github/spellcheck/selftest/**", ".github/spellcheck/glossary.*.txt",
    ".github/spellcheck/suppressions.mjs",

    # The registered language files (see .github/spellcheck/registry.mjs).
    # Their values are Norwegian or British and are checked by the runner;
    # excluding them here is asserted by the coverage check.
    "app-libs/language/src/texts/*.ts",
    "src/Designer/frontend/language/src/*.json",
    "src/Designer/frontend/resourceadm/language/src/*.json",
    "src/Designer/frontend/packages/shared/src/constants.js",
    "src/Designer/frontend/app-development/features/overview/components/News/NewsContent/news.nb.json",
    "src/App/template/src/App/config/applicationmetadata.json",
    "src/App/template/src/App/config/texts/resource.nb.json",
    "src/gitea/files/locale/**",

    # Test-only surface ships nowhere: test projects, colocated test files,
    # test data, mocks, e2e suites and Storybook stories. A typo there costs
    # nothing a user ever sees, so the whole class is out of scope — one rule
    # instead of the dozen surgical excludes and suppressions it replaces.
    # (Deliberate trade-off: typos in test names can propagate by copy-paste,
    # and the e2e specs did hide a dozen real ones. Non-shipping, accepted.)
    "**/test/**", "**/tests/**", "**/testing/**",
    "**/[Tt]est[Dd]ata/**", "**/test-data/**", "**/__mocks__/**",
    "*.test.*", "*.spec.*", "*_test.go", "*.stories.tsx", "*.pretest",
    "**/*SourceGenerator*/**",

    # Data embedded in source: an Altinn 2 code list.
    "**/Options/Altinn2Provider/Altinn2CodeListProvider.cs",

    # Whole files in another language: Norwegian in markup text nodes and JSX
    # that the runner's string classifier cannot see (it reads string
    # literals, not markup text), and a Norwegian-only internal dashboard.
    # Candidates for the extraction pipeline later.
    "src/tools/altinn-fleet-stats/**",
    "src/Designer/backend/src/Designer/Views/Home/StartPage.cshtml",
    "src/gitea/files/custom/templates/**",
]

# Data formats hold fixtures, schemas, code lists and wire payloads, not
# prose. Deliberately NOT here, although the previous harness classified them
# as data: .cshtml/.html (server-rendered pages users read), .yaml/.yml
# (workflow and config comments are prose), .txt and .tmpl. Those are checked.
[type.data]
extend-glob = [
    "*.json", "*.xml", "*.xsd", "*.bpmn", "*.csproj", "*.props", "*.sln*",
    "*.svg", "*.css", "*.env", "*.snap", "*.lock",
]
check-file = false

[default]
locale = "en-us"

# There are deliberately no extend-ignore-re patterns. Norwegian product copy
# inside string literals, and typo-shaped tokens inside base64/JWT data runs,
# are recognized and classified by the RUNNER (classifyFindings in
# .github/spellcheck/lib.mjs), not exempted here: an engine-side regex has no
# hit counting, no self-test reach and no rot detection — two of the five
# patterns this replaced were found dead within days of a scope change,
# silently. The classifier's work is counted on every run and its behavior is
# asserted by the self-test.
