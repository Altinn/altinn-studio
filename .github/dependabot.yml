version: 2
updates:
  - package-ecosystem: uv
    directories:
      - "/src/AI/agents"
      - "/src/AI/mcp"
    # Required by Dependabot; version PRs are disabled below and security updates ignore this schedule.
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      altinity-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
