version: 2

# Renovate owns routine dependency updates. These entries only customize
# Dependabot security updates and explicitly disable version-update PRs.
updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/src/lhci-server'
      - '/src/Runtime/localtest'
      - '/src/Runtime/pdf3'
      - '/src/test/K6'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: nuget
    directories:
      - '**/*'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: gomod
    directories:
      - '**/*'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: '/src/tools/altinn-fleet-stats/backend'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      pip-security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: uv
    directories:
      - '/src/AI/agents'
      - '/src/AI/mcp'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      uv-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
