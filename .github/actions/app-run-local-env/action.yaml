name: "Run app in local environment"
description: "Starts the frontend server, app processes, and optional LocalTest services"
inputs:
  run-localtest:
    description: "Whether to start localtest with studioctl"
    required: true
  app-run-targets-json:
    description: "JSON array of app run targets. Each target requires path."
    required: false
  skip-app-build:
    description: "Whether to pass --skip-build when starting app processes"
    required: false
    default: "false"
  localtest-image-cache-key:
    description: "LocalTest image cache key to require from a prerequisite job"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Validate inputs
      run: |
        if [[ "${{ inputs.run-localtest }}" != "true" && "${{ inputs.run-localtest }}" != "false" ]]; then
          echo "Error: run-localtest must be 'true' or 'false', got: ${{ inputs.run-localtest }}"
          exit 1
        fi
        if [[ "${{ inputs.skip-app-build }}" != "true" && "${{ inputs.skip-app-build }}" != "false" ]]; then
          echo "Error: skip-app-build must be 'true' or 'false', got: ${{ inputs.skip-app-build }}"
          exit 1
        fi
      shell: bash

    - name: Set up studioctl
      if: ${{ inputs.run-localtest == 'true' }}
      uses: ./.github/actions/setup-studioctl

    - name: Set up LocalTest images
      if: ${{ inputs.run-localtest == 'true' }}
      uses: ./.github/actions/setup-localtest-images
      with:
        cache-key: ${{ inputs.localtest-image-cache-key }}
        require-cache-hit: ${{ inputs.localtest-image-cache-key != '' }}

    - name: Start localtest
      if: ${{ inputs.run-localtest == 'true' }}
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        studioctl env up --detach

    - name: Download the built frontend
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: app-frontend-dist
        path: src/App/frontend/dist

    - name: Start frontend server
      run: |
        echo "Starting frontend server on port 8080..."
        python3 "${{ github.action_path }}/serve-frontend.py" \
          "${GITHUB_WORKSPACE}/src/App/frontend/dist" \
          > "${GITHUB_WORKSPACE}/src/App/frontend/frontend-server.log" 2>&1 &
        echo $! > "${GITHUB_WORKSPACE}/src/App/frontend/frontend-server.pid"
        echo "Frontend server started with PID $!"
      shell: bash

    - name: Wait for frontend server to be ready
      run: |
        echo "Waiting for frontend server to be ready..."
        timeout 60 bash -c 'until curl -f http://localhost:8080 > /dev/null 2>&1; do sleep 2; done'
        echo "Frontend server is ready on http://localhost:8080"
      shell: bash

    # The app libraries require the platform to say where provisioned secrets live and what the files are
    # called (RUNTIME_APP_SECRETS_DIR and the RUNTIME_APP_*_SECRETS_FILENAME variables), and a v9 app does not
    # start without a complete Maskinporten client in that directory. The studioctl on this branch does not
    # set the variables yet, so this step plays the platform: one directory with a throwaway client, shared by
    # every test app, handed on through the environment `studioctl run` passes to the app. Replaced by
    # `studioctl app maskinporten set` once studioctl provisions the directory itself.
    - name: Provision secrets for the test apps
      if: ${{ inputs.run-localtest == 'true' && inputs.app-run-targets-json != '' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const secretsDir = path.join(process.env.RUNNER_TEMP, 'app-secrets');
          fs.mkdirSync(secretsDir, { recursive: true, mode: 0o700 });

          const { privateKey } = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 });
          const jwk = { ...privateKey.export({ format: 'jwk' }), use: 'sig', alg: 'RS256', kid: 'ci-test-apps' };
          const client = {
            MaskinportenSettings: {
              Authority: 'https://test.maskinporten.no/',
              ClientId: 'ci-test-apps',
              Jwk: jwk,
            },
          };
          fs.writeFileSync(path.join(secretsDir, 'maskinporten-settings.json'), JSON.stringify(client), { mode: 0o600 });

          core.exportVariable('RUNTIME_APP_SECRETS_DIR', secretsDir);
          core.exportVariable('RUNTIME_APP_MASKINPORTEN_SECRETS_FILENAME', 'maskinporten-settings.json');
          core.exportVariable('RUNTIME_APP_APPCODES_SECRETS_FILENAME', 'app-codes.json');

    - name: Start app processes
      if: ${{ inputs.run-localtest == 'true' && inputs.app-run-targets-json != '' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        APP_RUN_TARGETS_JSON: ${{ inputs.app-run-targets-json }}
        SKIP_APP_BUILD: ${{ inputs.skip-app-build }}
      with:
        script: |
          const workspace = process.env.GITHUB_WORKSPACE;
          const maxParallelStarts = 4;
          const skipAppBuild = process.env.SKIP_APP_BUILD === 'true';

          const targetsJson = process.env.APP_RUN_TARGETS_JSON;
          let targets;
          try {
            targets = JSON.parse(targetsJson);
          } catch (error) {
            throw new Error(`app-run-targets-json is not valid JSON: ${error.message}`);
          }
          if (!Array.isArray(targets)) {
            throw new Error('app-run-targets-json must be a JSON array.');
          }

          function targetRunArgs(path) {
            const args = ['run', '--mode', 'process', '--detach', '--random-host-port', '--dev-frontend', '--startup-timeout', '60s', '--path', path];
            if (skipAppBuild) {
              args.push('--skip-build');
            }
            return args;
          }

          function validateTarget(target) {
            if (!target || typeof target !== 'object' || Array.isArray(target)) {
              throw new Error('Each app run target must be an object.');
            }
            if (typeof target.path !== 'string' || target.path === '') {
              throw new Error('Each app run target requires a non-empty path.');
            }
            return target;
          }

          const validTargets = targets.map(validateTarget);
          if (validTargets.length === 0) {
            throw new Error('No app processes were started.');
          }

          let nextTarget = 0;
          async function startNext(workerId) {
            while (nextTarget < validTargets.length) {
              const target = validTargets[nextTarget++];
              core.info(`Worker ${workerId}: starting ${target.path}`);
              await exec.exec('studioctl', targetRunArgs(target.path), { cwd: workspace });
            }
          }

          const workerCount = Math.min(maxParallelStarts, validTargets.length);
          await Promise.all(Array.from({ length: workerCount }, (_, index) => startNext(index + 1)));
