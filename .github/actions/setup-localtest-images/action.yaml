name: "Setup LocalTest images"
description: "Restores cached LocalTest dev images or builds an archive to populate the cache"
inputs:
  populate-cache:
    description: "Build and archive the images when the cache is empty instead of requiring a hit"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Cache LocalTest dev images
      id: cache-localtest-images
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/localtest-images/images.tar
        key: localtest-dev-images-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Runtime/localtest/**', 'src/Runtime/pdf3/**', 'src/Runtime/workflow-engine/**', 'src/Runtime/workflow-engine-app/**', 'src/common/**', 'src/Shared/**', 'src/cli/internal/cmd/env/localtest/**', 'src/cli/internal/config/config.yaml', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
        lookup-only: ${{ inputs.populate-cache }}

    - name: Load cached LocalTest dev images
      if: ${{ steps.cache-localtest-images.outputs.cache-hit == 'true' && inputs.populate-cache != 'true' }}
      shell: bash
      run: docker image load --input .cache/localtest-images/images.tar

    - name: Require cached LocalTest dev images
      if: ${{ steps.cache-localtest-images.outputs.cache-hit != 'true' && inputs.populate-cache != 'true' }}
      shell: bash
      run: |
        echo "The LocalTest dev image cache was not populated by the prerequisite job."
        exit 1

    - name: Build LocalTest dev images
      if: ${{ steps.cache-localtest-images.outputs.cache-hit != 'true' && inputs.populate-cache == 'true' }}
      shell: bash
      run: studioctl env up --detach

    - name: Archive LocalTest dev images
      if: ${{ steps.cache-localtest-images.outputs.cache-hit != 'true' && inputs.populate-cache == 'true' }}
      shell: bash
      run: |
        mkdir -p .cache/localtest-images
        docker image save --output .cache/localtest-images/images.tar \
          localtest:dev \
          localtest-pdf3:dev \
          localtest-workflow-engine:dev

    - name: Stop cache-building environment
      if: ${{ always() && steps.cache-localtest-images.outputs.cache-hit != 'true' && inputs.populate-cache == 'true' }}
      shell: bash
      run: studioctl env down || true

    - name: Use prebuilt LocalTest dev images
      if: ${{ steps.cache-localtest-images.outputs.cache-hit == 'true' && inputs.populate-cache != 'true' }}
      shell: bash
      run: echo "STUDIOCTL_PREBUILT_DEV_IMAGES=true" >> "$GITHUB_ENV"
