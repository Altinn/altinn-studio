name: "Publish experimental packages"
description: "Publish a pull request build's experimental packages to nuget.org, and comment their versions"
inputs:
  run-id:
    description: "The build run, from find-experimental-build"
    required: true
  component:
    description: "The component: app, codelists or fileanalyzers"
    required: true
  package-id:
    description: "Bash pattern that every package ID must match, such as Altinn.App.*.Experimental"
    required: true
  nuget-user:
    description: "The nuget.org user that NuGet/login signs in as"
    required: true
runs:
  using: "composite"
  steps:
    - name: Download packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.component }}-experimental-packages
        path: packages
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}

    # The pull request code built these, so it chose the package IDs and versions
    - name: Check packages
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.issue.number }}
        PACKAGE_ID: ${{ inputs.package-id }}
      run: |
        shopt -s nullglob
        packages=(packages/*.nupkg)
        if (( ${#packages[@]} == 0 )); then
          echo "::error::The build has no packages"
          exit 1
        fi

        for package in "${packages[@]}"; do
          nuspec="$(unzip -p "$package" '*.nuspec')"
          id="$(grep -oP '(?<=<id>)[^<]+' <<<"$nuspec")"
          version="$(grep -oP '(?<=<version>)[^<]+' <<<"$nuspec")"
          # shellcheck disable=SC2053 # PACKAGE_ID is a pattern
          if [[ "$id" != $PACKAGE_ID ]]; then
            echo "::error::${package} has the package ID ${id}, which does not match ${PACKAGE_ID}"
            exit 1
          fi
          if [[ "$version" != *".pr.${PR_NUMBER}."* ]]; then
            echo "::error::${package} has the version ${version}, which was not built for this pull request"
            exit 1
          fi
          echo "- [${id} ${version}](https://www.nuget.org/packages/${id}/${version})" >> packages.md
        done

    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.nuget-user }}

    - name: Publish packages to NuGet
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        for package in packages/*.nupkg packages/*.snupkg; do
          [[ -e "$package" ]] || continue
          dotnet nuget push "$package" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done

    - name: Comment on the pull request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
      run: |
        {
          echo "Published to nuget.org:"
          echo
          cat packages.md
        } | gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file -
