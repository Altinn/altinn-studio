name: "Setup studioctl"
description: "Sets up a dev studioctl install for CI workflows"
runs:
  using: "composite"
  steps:
    - name: Cache studioctl dev install
      id: cache-studioctl
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: src/cli/build/dev-home
        key: studioctl-dev-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/cli/**', 'src/Runtime/devenv/**', 'src/Shared/**', 'Directory.Packages.props') }}

    - name: Setup Go
      if: ${{ steps.cache-studioctl.outputs.cache-hit != 'true' }}
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: src/cli/go.mod

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: "10.0.x"

    - name: Build studioctl dev install
      if: ${{ steps.cache-studioctl.outputs.cache-hit != 'true' }}
      working-directory: src/cli
      run: make dev-install
      shell: bash

    - name: Set studioctl paths
      run: |
        studioctl_home="${GITHUB_WORKSPACE}/src/cli/build/dev-home"
        echo "STUDIOCTL_HOME=$studioctl_home" >> "$GITHUB_ENV"
        echo "STUDIOCTL_INTERNAL_DEV=true" >> "$GITHUB_ENV"
        echo "$studioctl_home/bin" >> "$GITHUB_PATH"
      shell: bash
