name: "Setup studioctl"
description: "Builds or restores a dev studioctl install for CI workflows"
inputs:
  artifact-name:
    description: "Optional artifact containing studioctl-dev.tar.gz"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup Go
      if: ${{ inputs.artifact-name == '' }}
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: src/cli/go.mod

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: "10.0.x"

    - name: Build studioctl dev install
      if: ${{ inputs.artifact-name == '' }}
      working-directory: src/cli
      run: make dev-install
      shell: bash

    - name: Download studioctl dev install
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: /tmp/studioctl-dev

    - name: Extract studioctl dev install
      if: ${{ inputs.artifact-name != '' }}
      working-directory: src/cli
      run: |
        mkdir -p build
        tar -xzf /tmp/studioctl-dev/studioctl-dev.tar.gz -C build
      shell: bash

    - name: Set studioctl paths
      run: |
        studioctl_home="${GITHUB_WORKSPACE}/src/cli/build/dev-home"
        echo "STUDIOCTL_HOME=$studioctl_home" >> "$GITHUB_ENV"
        echo "STUDIOCTL_INTERNAL_DEV=true" >> "$GITHUB_ENV"
        echo "$studioctl_home/bin" >> "$GITHUB_PATH"
      shell: bash
