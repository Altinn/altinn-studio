name: runtime-health - Lint

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/tools/health/**'
      - '.github/workflows/runtime-health-build.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Check formatting and lint
    runs-on: self-hosted-single
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/tools/health
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/tools/health/go.mod
          cache-dependency-path: src/tools/health/go.sum

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Lint
        run: make lint
