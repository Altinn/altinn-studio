name: Construct rings array

on:
  workflow_call:
    inputs:
      # Resolve the rings to the DIS Core environments they cover ({ring, environment, tag}),
      # rather than to runtime_<ring>. A ring may cover none, so the result can be empty.
      dis-core:
        required: false
        default: false
        type: boolean
      inputs:
        required: false
        default: "null"
        type: string
      override-default-runtime-environments:
        required: false
        default: ""
        type: string
      allow-empty:
        required: false
        default: false
        type: boolean
    outputs:
      result:
        description: "Result json"
        value: ${{ jobs.construct-rings-array.outputs.result }}

jobs:
  construct-rings-array:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.construct-rings.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/scripts

      - name: Construct rings
        id: construct-rings
        env:
          INPUTS: ${{ inputs.inputs }}
          ALLOW_EMPTY: ${{ inputs['allow-empty'] }}
          DIS_CORE: ${{ inputs['dis-core'] }}
          OVERRIDE_DEFAULT_RUNTIME_ENVIRONMENTS: ${{ inputs['override-default-runtime-environments'] }}
        run: |
          mode="runtime"
          if [[ "$DIS_CORE" == "true" ]]; then
            mode="dis-core"
          fi

          result="$(node .github/scripts/construct-environments.mjs \
            --mode "${mode}" \
            --inputs "$INPUTS" \
            --allow-empty "$ALLOW_EMPTY")"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
