name: altinn-fleet - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/tools/altinn-fleet/**'
      # The tool compiles the app domain model from the shared project.
      - 'src/common/dotnet/Altinn.Studio.Common/**'
      # The tests check the release lookup client against Designer's contract files.
      - 'src/Designer/backend/tests/Designer.Tests/_TestData/ReleaseLookup/**'
      - '.github/workflows/altinn-fleet-build-test.yaml'
      - '!**/AGENTS.md'
      - '!**/README.md'
      - '!**/docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: self-hosted-ubuntu
          # File systems there ignore case, and Windows forbids some names.
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/tools/altinn-fleet
    steps:
      - name: Enable long paths for git on Windows
        if: matrix.os == 'windows-latest'
        # Before the checkout, the job's default folder does not exist yet.
        working-directory: .
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/tools/altinn-fleet/global.json

      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test
