name: Runtime - deploy pdf3

on:
  push:
    branches:
      - main
    paths:
      - src/Runtime/pdf3/**
      - .github/workflows/deploy-runtime-pdf3.yaml
      - "!**/AGENTS.md"
  workflow_dispatch:
    inputs:
      environments:
        description: "Runtime environments to tag. Comma-separated (e.g. at_ring1,at_ring2)."
        required: false
        default: "at_ring1"
      dis-core-environments:
        description: "DIS Core environments to tag (at22, at23, yt01, tt02, prod). Comma-separated, or empty for none."
        required: false
        default: "at22"

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  construct-rings-array:
    uses: ./.github/workflows/template-runtime-construct-environments.yaml
    with:
      inputs: ${{ toJSON(github.event.inputs) }}
      allow-empty: true

  construct-dis-core-environments:
    uses: ./.github/workflows/template-dis-core-construct-environments.yaml
    with:
      inputs: ${{ toJSON(github.event.inputs) }}
      inputs-key: dis-core-environments
      allow-empty: true

  push-pdf3-artifact:
    name: Push pdf3 as OCI artifact
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write # Require write permission to Fetch an OIDC token.
      packages: write # Require write permission to push to GHCR.
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}
      config-repo: ${{ steps.vars.outputs.config-repo }}
      ghcr-image-worker-repo: ${{ steps.vars.outputs.ghcr-image-worker-repo }}
      image-proxy-repo: ${{ steps.vars.outputs.image-proxy-repo }}
      image-worker-repo: ${{ steps.vars.outputs.image-worker-repo }}
    defaults:
      run:
        working-directory: src/Runtime/pdf3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: set vars
        id: vars
        run: |
          SHA="${GITHUB_SHA::10}"
          GHCR_BASE="ghcr.io/altinn/altinn-studio"
          ACR_PREFIX="altinncr.azurecr.io"

          echo "short-sha=$SHA" >> $GITHUB_OUTPUT
          echo "registry-name=altinncr" >> $GITHUB_OUTPUT
          echo "ghcr-image-proxy-repo=${GHCR_BASE}/runtime-pdf3-proxy:${SHA}" >> $GITHUB_OUTPUT
          echo "ghcr-image-worker-repo=${GHCR_BASE}/runtime-pdf3-worker:${SHA}" >> $GITHUB_OUTPUT
          echo "image-proxy-repo=${ACR_PREFIX}/${GHCR_BASE}/runtime-pdf3-proxy:${SHA}" >> $GITHUB_OUTPUT
          echo "image-worker-repo=${ACR_PREFIX}/${GHCR_BASE}/runtime-pdf3-worker:${SHA}" >> $GITHUB_OUTPUT
          echo "config-repo=${ACR_PREFIX}/studio-apps/runtime-pdf3-repo:${SHA}" >> $GITHUB_OUTPUT

      - name: login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_FC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FC }}

      - name: az acr login
        run: az acr login --name ${{ steps.vars.outputs.registry-name }}

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: docker build
        run: |
          set -e
          docker build --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=ghcr.io/altinn/altinn-studio/runtime-pdf3-proxy:buildcache \
            --cache-to type=registry,ref=ghcr.io/altinn/altinn-studio/runtime-pdf3-proxy:buildcache,mode=max \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --build-arg SERVICE_VERSION=${{ steps.vars.outputs.short-sha }} \
            -t ${{ steps.vars.outputs.ghcr-image-proxy-repo }} -f Dockerfile.proxy . &
          PROXY_PID=$!
          docker build --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=ghcr.io/altinn/altinn-studio/runtime-pdf3-worker:buildcache \
            --cache-to type=registry,ref=ghcr.io/altinn/altinn-studio/runtime-pdf3-worker:buildcache,mode=max \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --build-arg SERVICE_VERSION=${{ steps.vars.outputs.short-sha }} \
            -t ${{ steps.vars.outputs.ghcr-image-worker-repo }} -f Dockerfile.worker . &
          WORKER_PID=$!
          wait $PROXY_PID
          wait $WORKER_PID

      - name: push images
        run: |
          set -e
          docker push ${{ steps.vars.outputs.ghcr-image-proxy-repo }} &
          PROXY_PID=$!
          docker push ${{ steps.vars.outputs.ghcr-image-worker-repo }} &
          WORKER_PID=$!
          wait $PROXY_PID
          wait $WORKER_PID

      - name: patch base with image tag
        working-directory: src/Runtime/pdf3/infra/kustomize/base
        run: |
          export PROXY_IMAGE="${{ steps.vars.outputs.image-proxy-repo }}"
          export WORKER_IMAGE="${{ steps.vars.outputs.image-worker-repo }}"
          export IMAGE_TAG="${{ steps.vars.outputs.short-sha }}"
          yq -i '.metadata.annotations["altinn.studio/image"] = env(PROXY_IMAGE)' proxy.yaml
          yq -i '.metadata.annotations["altinn.studio/image"] = env(WORKER_IMAGE)' worker.yaml
          yq -i '.metadata.annotations["altinn.studio/image-tag"] = env(IMAGE_TAG)' proxy.yaml
          yq -i '.metadata.annotations["altinn.studio/image-tag"] = env(IMAGE_TAG)' worker.yaml
          # The relay runs the proxy image
          yq -i '.metadata.annotations["altinn.studio/image"] = env(PROXY_IMAGE)' ../relay/relay.yaml
          yq -i '.metadata.annotations["altinn.studio/image-tag"] = env(IMAGE_TAG)' ../relay/relay.yaml

      - name: push artifact
        working-directory: src/Runtime/pdf3/infra/kustomize
        run: |
          flux push artifact oci://${{ steps.vars.outputs.config-repo }} \
            --provider=generic \
            --reproducible \
            --path="." \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)/$(git rev-parse HEAD)"

  tag-pdf3:
    name: Tag pdf3
    needs: [push-pdf3-artifact, construct-rings-array]
    if: ${{ fromJSON(needs.construct-rings-array.outputs.result)[0] != null }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write # Require write permission to Fetch an OIDC token.
      packages: write # Require write permission to move the tt02 tag on GHCR.
    strategy:
      matrix:
        include: ${{ fromJson(needs.construct-rings-array.outputs.result) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_FC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FC }}

      - name: az acr login
        run: az acr login --name altinncr

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: tag artifact
        run: |
          flux tag artifact oci://${{ needs.push-pdf3-artifact.outputs.config-repo }} \
            --tag ${{ matrix.ring }}

      # studioctl runs the worker from the "tt02" tag, so local environments render PDFs with
      # the same build as tt02. Moved here rather than in the build job, so it only ever points
      # at a build handed to the ring. Only the worker is tagged: it is the one image studioctl
      # runs, and what the ring deploys stays described by the artifact flux tagged above.
      - name: Point the tt02 tag at this build
        if: matrix.ring == 'tt_ring1' && github.ref == 'refs/heads/main'
        env:
          WORKER_IMAGE: ${{ needs.push-pdf3-artifact.outputs.ghcr-image-worker-repo }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker buildx imagetools create \
            -t ghcr.io/altinn/altinn-studio/runtime-pdf3-worker:tt02 \
            "$WORKER_IMAGE"

  # DIS Core's syncroot (infra/syncroot), with the images of this run's build. Its own job, outside
  # a GitHub environment: the DIS publishing identity trusts main and the dis_core_* environments
  # only, and may only push under studio-pdf3/.
  push-dis-core-syncroot:
    name: Push DIS Core syncroot as OCI artifact
    needs: [push-pdf3-artifact, construct-dis-core-environments]
    if: ${{ fromJSON(needs.construct-dis-core-environments.outputs.result)[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Require write permission to Fetch an OIDC token.
    outputs:
      short-sha: ${{ needs.push-pdf3-artifact.outputs.short-sha }}
    defaults:
      run:
        working-directory: src/Runtime/pdf3/infra/syncroot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: patch base with image tag
        working-directory: src/Runtime/pdf3/infra/syncroot/base
        run: |
          export PROXY_IMAGE="${{ needs.push-pdf3-artifact.outputs.image-proxy-repo }}"
          export WORKER_IMAGE="${{ needs.push-pdf3-artifact.outputs.image-worker-repo }}"
          export IMAGE_TAG="${{ needs.push-pdf3-artifact.outputs.short-sha }}"
          yq -i '.metadata.annotations["altinn.studio/image"] = env(PROXY_IMAGE)' proxy.yaml
          yq -i '.metadata.annotations["altinn.studio/image"] = env(WORKER_IMAGE)' worker.yaml
          yq -i '.metadata.annotations["altinn.studio/image-tag"] = env(IMAGE_TAG)' proxy.yaml
          yq -i '.metadata.annotations["altinn.studio/image-tag"] = env(IMAGE_TAG)' worker.yaml

      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}

      - name: az acr login
        run: az acr login --name altinncr

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: push artifact
        run: |
          flux push artifact oci://altinncr.azurecr.io/studio-pdf3/syncroot:${{ needs.push-pdf3-artifact.outputs.short-sha }} \
            --provider=generic \
            --reproducible \
            --path="." \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)/$(git rev-parse HEAD)"

  # Each DIS Core cluster's Flux reads the tag named after its environment. The job name carries
  # the tag, which the deployer dashboard (src/tools/deployer) matches on.
  tag-dis-core-syncroot:
    name: Tag syncroot (${{ matrix.tag }})
    needs: [push-dis-core-syncroot, construct-dis-core-environments]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write # Require write permission to Fetch an OIDC token.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.construct-dis-core-environments.outputs.result) }}
    steps:
      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}

      - name: az acr login
        run: az acr login --name altinncr

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: tag artifact
        run: |
          flux tag artifact oci://altinncr.azurecr.io/studio-pdf3/syncroot:${{ needs.push-dis-core-syncroot.outputs.short-sha }} \
            --tag ${{ matrix.tag }}
