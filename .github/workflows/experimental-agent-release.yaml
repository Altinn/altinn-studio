name: experimental - Agent release

on:
  push:
    tags:
      - 'experimental-agent/v*'

permissions:
  contents: read

jobs:
  images:
    name: Publish Agent images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/agents-images.yaml

  build:
    name: Build ${{ matrix.archive }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: agent-linux-x86_64
          - runner: ubuntu-24.04-arm
            archive: agent-linux-aarch64
          - runner: macos-15
            archive: agent-macos-aarch64
          - runner: windows-2025
            archive: agent-windows-x86_64
          - runner: windows-11-arm
            archive: agent-windows-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for git on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/experimental
            src/ci/github-runner/coordinator

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-ng-dev

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Build release binaries
        run: |
          AGENT_VERSION="${GITHUB_REF_NAME#experimental-agent/}" cargo build --release --locked -p agent --bins

      - name: Package release binaries
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          src/experimental/agent/package.sh "dist/${ARCHIVE}.tar.gz" target/release

      - name: Smoke-test managed installation
        env:
          ARCHIVE: ${{ matrix.archive }}
          AGENT_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${AGENT_RELEASE_TAG#experimental-agent/}"
          export VERSION AGENT_VERSION="${VERSION}"
          SMOKE_ROOT="${RUNNER_TEMP}/agent-install-smoke"
          ARCHIVE_PATH="${GITHUB_WORKSPACE}/dist/${ARCHIVE}.tar.gz"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            export AGENT_INSTALL_ROOT="$(cygpath -w "${SMOKE_ROOT}/install")"
            export AGENT_INSTALL_DIR="$(cygpath -w "${SMOKE_ROOT}/bin")"
            export AGENT_HOME="$(cygpath -w "${SMOKE_ROOT}/home")"
            export AGENT_LOCAL_ARCHIVE="$(cygpath -w "${ARCHIVE_PATH}")"
            pwsh -NoProfile -File "$(cygpath -w src/experimental/agent/install.ps1)"
            export AGENT_SMOKE_BIN="${AGENT_INSTALL_DIR}"
            unset AGENT_INSTALL_ROOT AGENT_INSTALL_DIR
            pwsh -NoProfile -Command '& (Join-Path $env:AGENT_SMOKE_BIN "agentctl.cmd") --home $env:AGENT_HOME self update --version $env:VERSION'
          else
            export AGENT_INSTALL_ROOT="${SMOKE_ROOT}/install"
            export AGENT_INSTALL_DIR="${SMOKE_ROOT}/bin"
            export AGENT_HOME="${SMOKE_ROOT}/home"
            export AGENT_LOCAL_ARCHIVE="${ARCHIVE_PATH}"
            sh src/experimental/agent/install.sh
            AGENT_SMOKE_BIN="${AGENT_INSTALL_DIR}"
            unset AGENT_INSTALL_ROOT AGENT_INSTALL_DIR
            "${AGENT_SMOKE_BIN}/agentctl" --home "${AGENT_HOME}" self update --version "${VERSION}"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.archive }}
          path: dist/agent-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout installer scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Add installers
        run: |
          cp src/experimental/agent/install.sh src/experimental/agent/install.ps1 dist/

      - name: Add version-pinned manifests and release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#experimental-agent/}"
          for VARIANT in full minimal worktree; do
            sed "s/:latest/:${VERSION}/" "agents/${VARIANT}/agent.yaml" > "dist/agent-${VARIANT}.yaml"
          done
          jq -n \
            --arg version "${VERSION}" \
            --arg full "ghcr.io/altinn/altinn-studio/agent-full:${VERSION}" \
            --arg minimal "ghcr.io/altinn/altinn-studio/agent-minimal:${VERSION}" \
            '{version: $version, images: {full: $full, minimal: $minimal}}' \
            > dist/agent-release.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${TAG}" dist/*
          --generate-notes
          --latest=false
          --prerelease
          --title "Experimental Agent ${TAG#experimental-agent/}"
          --verify-tag
