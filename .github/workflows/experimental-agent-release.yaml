name: experimental - Agent release

on:
  push:
    tags:
      - 'experimental-agent/v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.archive }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: agent-linux-x86_64
          - runner: ubuntu-24.04-arm
            archive: agent-linux-aarch64
          - runner: macos-15
            archive: agent-macos-aarch64
          - runner: windows-2025
            archive: agent-windows-x86_64
          - runner: windows-11-arm
            archive: agent-windows-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for git on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/experimental
            src/ci/github-runner/coordinator

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-ng-dev

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Build release binaries
        run: |
          AGENT_VERSION="${GITHUB_REF_NAME#experimental-agent/}" cargo build --release --locked -p agent --bins

      - name: Package release binaries
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          src/experimental/agent/package.sh "dist/${ARCHIVE}.tar.gz" target/release

      - name: Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.archive }}
          path: dist/agent-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout installer scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Add installers
        run: |
          cp src/experimental/agent/install.sh src/experimental/agent/install.ps1 dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${TAG}" dist/*
          --generate-notes
          --latest=false
          --prerelease
          --title "Experimental Agent ${TAG#experimental-agent/}"
          --verify-tag
