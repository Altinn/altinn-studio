name: App Codelists - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/App/codelists/**'
      - '.github/workflows/app-codelists-tests.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    strategy:
      matrix:
        os:
          - id: ubuntu-latest
            workingDir: src/App/codelists/
          - id: macos-latest
            workingDir: src/App/codelists/
          - id: windows-latest
            workingDir: src\App\codelists\
    name: Run dotnet build and test
    runs-on: ${{ matrix.os.id }}
    timeout-minutes: 30
    env:
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: false
    steps:
      - name: Enable long paths for git on Windows
        if: matrix.os.id == 'windows-latest'
        run: git config --system core.longpaths true
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # MinVer needs full history/tags to compute the package version
          persist-credentials: false
      - name: Build
        working-directory: ${{ matrix.os.workingDir }}
        run: |
           dotnet build Altinn.Codelists.slnx -v m
      - name: Test
        working-directory: ${{ matrix.os.workingDir }}
        run: |
           dotnet test Altinn.Codelists.slnx -v m
