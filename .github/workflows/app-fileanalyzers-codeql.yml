name: App Fileanalyzers - CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'src/App/fileanalyzers/**'
      - '.github/actions/codeql-config/**'
      - '.github/codeql/**'
      - '.github/workflows/app-fileanalyzers-codeql.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/App/fileanalyzers/**'
      - '.github/actions/codeql-config/**'
      - '.github/codeql/**'
      - '.github/workflows/app-fileanalyzers-codeql.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:
  schedule:
    - cron: '25 1 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/App/fileanalyzers/
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Generate CodeQL config
      id: codeql-config
      uses: ./.github/actions/codeql-config
      with:
        language: ${{ matrix.language }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3.37.5
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
        queries: ${{ steps.codeql-config.outputs.queries }}
        config-file: ${{ steps.codeql-config.outputs.config-file }}

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: src/App/fileanalyzers/global.json

    - name: Build solution
      run: dotnet build solutions/Src.slnx -v m

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3.37.5
      with:
        category: "/codeql/app/fileanalyzers/${{ matrix.language }}"
