name: Construct DIS Core or DIS Edge environments array

on:
  workflow_call:
    inputs:
      # dis-core or dis-edge, which name the GitHub environments dis_core_<tag> and dis_edge_<tag>.
      mode:
        required: true
        type: string
      inputs:
        required: false
        default: "null"
        type: string
      # The key in inputs that holds the environments, for a workflow that also takes other
      # environments in its own "environments" input.
      inputs-key:
        required: false
        default: "environments"
        type: string
      allow-empty:
        required: false
        default: false
        type: boolean
    outputs:
      result:
        description: "Result json"
        value: ${{ jobs.construct-environments-array.outputs.result }}

jobs:
  construct-environments-array:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.construct-environments.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/scripts

      - name: Construct environments
        id: construct-environments
        env:
          MODE: ${{ inputs.mode }}
          INPUTS: ${{ inputs.inputs }}
          INPUTS_KEY: ${{ inputs['inputs-key'] }}
          ALLOW_EMPTY: ${{ inputs['allow-empty'] }}
        run: |
          result="$(node .github/scripts/construct-environments.mjs \
            --mode "$MODE" \
            --inputs "$INPUTS" \
            --inputs-key "$INPUTS_KEY" \
            --allow-empty "$ALLOW_EMPTY")"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
