name: Release - app

# Releases the latest version in the app changelog when it has no GitHub release yet.
#
# Runs on push because the `libraries` environment, which nuget.org's trusted publishing requires, rejects pull
# request runs. GitHub checks those against refs/pull/<n>/merge.

on:
  push:
    branches:
      - main
      - 'release/app/v*'
    paths:
      - 'src/App/CHANGELOG.md'
  workflow_dispatch: {}

permissions:
  contents: read

# A later push on the same branch waits, then finds the draft that the earlier run created.
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    # workflow_dispatch can also run on a tag
    if: github.ref_type == 'branch'
    permissions:
      # Draft releases are only visible with write access
      contents: write
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release
        id: resolve
        uses: ./.github/actions/resolve-library-release
        with:
          component: app

  release:
    name: Build, release and publish
    runs-on: ubuntu-latest
    needs: resolve-release-context
    permissions:
      contents: write
      id-token: write
      packages: write
    concurrency: app-dist-${{ needs.resolve-release-context.outputs.version }}
    if: needs.resolve-release-context.outputs.release == 'true'
    environment: libraries

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout base branch
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          if [[ "${BASE_BRANCH}" != "main" && ! "${BASE_BRANCH}" =~ ^release/app/v[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base branch: ${BASE_BRANCH}"
            exit 1
          fi

          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "$MERGE_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/App/backend/global.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/tools/releaser

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          go run . workflow --component app --base-branch "$BASE_BRANCH"
        working-directory: src/tools/releaser

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(build/release/*.nupkg build/release/*.snupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No NuGet packages found in build/release" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Resolve app-dist context
        id: app-dist-context
        env:
          RELEASE_VERSION: ${{ needs.resolve-release-context.outputs.version }}
        run: |
          echo "version=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish app-dist OCI artifact
        uses: ./.github/actions/publish-app-dist
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          actor: ${{ github.actor }}
          version: ${{ steps.app-dist-context.outputs.version }}
          revision: ${{ steps.app-dist-context.outputs.revision }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- **Base branch**: ${BASE_BRANCH}"
            echo "- **Version**: ${RELEASE_VERSION}"
            echo "- **Version source**: latest released section in src/App/CHANGELOG.md"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -d "build/release" ]]; then
            {
              echo "### NuGet packages"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ls -la build/release/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No packages found" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.resolve-release-context.outputs.version }}
