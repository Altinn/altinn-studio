name: Gitea Proxy - Test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/gitea-proxy/**'
      - '.github/workflows/gitea-proxy-test.yml'
      - '!**/AGENTS.md'
      - '!**/README.md'
      - '!**/readme.md'
      - '!**/_readme.md' # C# layout model documentation in Altinn.App.Core.
      - '!**/CONTRIBUTING.md'
      - '!**/CHANGELOG.md'
      - '!**/docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run proxy integration tests
        env:
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:8.0.1@sha256:49a02dc39d7084e5a6e8c57e2d4754ef102e4ee3761a02ef6dc0e305ab1a832d
        # Host networking lets Hurl reach the proxy ports published by Compose.
        run: |
          make test HURL="docker run --rm --network host --volume \"$PWD:/tests:ro\" --workdir /tests $HURL_IMAGE"
        working-directory: src/gitea-proxy/test
