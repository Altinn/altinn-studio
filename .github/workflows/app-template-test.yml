name: App Template - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/App/template/**'
      - '.github/workflows/app-template-test.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    strategy:
      fail-fast: false  # one template failing must not mask the state of the other
      matrix:
        os: [macos-latest,windows-latest,ubuntu-latest]
        template: [v8, v9]
    name: Run dotnet build and test (${{ matrix.template }})
    runs-on: ${{ matrix.os}}
    timeout-minutes: 30
    env:
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: false
    steps:
      - name: Enable long paths for git on Windows
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
           dotnet build src/App.sln -v m
        working-directory: src/App/template/${{ matrix.template }}

      - name: Test
        run: |
           dotnet test src/App.sln -v m --no-restore --no-build
        working-directory: src/App/template/${{ matrix.template }}
