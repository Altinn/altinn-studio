name: Release - app experimental packages

# Publishes the `*.Experimental` app packages that app-backend-experimental-build.yaml built for a pull request, when
# a maintainer or admin comments `/publish` on it. It publishes the build of the commit that was the pull request's
# head when they commented, and never runs pull request code.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  find-build:
    name: Find build
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/publish')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Find the build of the commented commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
          COMMENTED_AT: ${{ github.event.comment.created_at }}
        run: |
          # role_name, because the legacy permission field reports maintain as write
          role="$(gh api "repos/${REPOSITORY}/collaborators/${SENDER}/permission" --jq '.role_name')"
          if [[ "$role" != "admin" && "$role" != "maintain" ]]; then
            echo "::error::Only maintainers and admins can publish experimental packages. ${SENDER} has ${role}."
            exit 1
          fi

          head_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          run="$(gh api "repos/${REPOSITORY}/actions/workflows/app-backend-experimental-build.yaml/runs?event=pull_request&head_sha=${head_sha}&status=success&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.id) \(.created_at)"')"
          if [[ -z "$run" ]]; then
            echo "::error::No finished build of ${head_sha}. Comment /publish again when it has passed."
            exit 1
          fi

          read -r run_id run_created_at <<<"$run"
          # A later build means the pull request changed after the comment
          if [[ "$run_created_at" > "$COMMENTED_AT" ]]; then
            echo "::error::The pull request changed after the /publish comment. Comment again to publish ${head_sha}."
            exit 1
          fi

          echo "Publishing the build of ${head_sha} from run ${run_id}"
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: find-build
    environment: libraries
    permissions:
      actions: read
      id-token: write
      pull-requests: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-experimental-packages
          path: packages
          run-id: ${{ needs.find-build.outputs.run-id }}
          github-token: ${{ github.token }}

      # The pull request code built these, so it chose the package IDs and versions
      - name: Check packages
        id: check
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          shopt -s nullglob
          packages=(packages/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::The build has no packages" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            nuspec="$(unzip -p "$package" '*.nuspec')"
            id="$(grep -oP '(?<=<id>)[^<]+' <<<"$nuspec")"
            version="$(grep -oP '(?<=<version>)[^<]+' <<<"$nuspec")"
            if [[ "$id" != Altinn.App.*.Experimental ]]; then
              echo "::error::${package} has the package ID ${id}, which is not an experimental app package"
              exit 1
            fi
            if [[ "$version" != *".pr.${PR_NUMBER}."* ]]; then
              echo "::error::${package} has the version ${version}, which was not built for this pull request"
              exit 1
            fi
            echo "- ${id} ${version}" >> packages.md
          done

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in packages/*.nupkg packages/*.snupkg; do
            [[ -e "$package" ]] || continue
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "Published to nuget.org:"
            echo
            cat packages.md
          } | gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file -
