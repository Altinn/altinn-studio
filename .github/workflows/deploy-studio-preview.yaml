name: Deploy preview service

on:
  push:
    branches:
      - main
    paths:
      - src/common/dotnet/**
      - src/core/preview/src/**
      - src/core/preview/Directory.Packages.props
      - src/core/preview/Dockerfile
      - src/core/preview/Dockerfile.dockerignore
      - src/core/preview/infra/**
      - .github/workflows/deploy-studio-preview.yaml
  workflow_dispatch:
    inputs:
      environments:
        description: 'Environments to deploy to. Multiple environments can be specified by separating them with a comma.'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read

jobs:
  construct-environments-array:
    uses: ./.github/workflows/template-studio-construct-environments.yaml
    with:
      use-preapproved: true
      inputs: ${{ toJSON(github.event.inputs) }}

  push-artifact:
    name: Push preview as OCI artifact
    runs-on: ubuntu-latest
    environment: dev
    env:
      REGISTRY_NAME: altinntjenestercontainerregistry
    outputs:
      CONFIG_REPO: ${{ steps.vars.outputs.config-repo }}
    defaults:
      run:
        working-directory: src/core/preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set vars
        id: vars
        run: |
          SHA="${GITHUB_SHA::10}"
          {
            echo "short-sha=$SHA"
            echo "image-repo=altinntjenestercontainerregistry.azurecr.io/altinn-studio/preview:${SHA}"
            echo "config-repo=altinntjenestercontainerregistry.azurecr.io/altinn-studio/configs/preview-repo:${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_FC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FC }}

      - name: az acr login
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: docker build
        working-directory: src
        run: |
          docker build --build-arg BUILD_VERSION=${{ steps.vars.outputs.short-sha }} \
            -t ${{ steps.vars.outputs.image-repo }} -f core/preview/Dockerfile .

      - name: push image
        run: docker push ${{ steps.vars.outputs.image-repo }}

      # deployment.yaml also holds the PodDisruptionBudget, so only the Deployment gets the image.
      - name: patch base with image tag
        working-directory: src/core/preview/infra/kustomize/base
        run: |
          export IMAGE="${{ steps.vars.outputs.image-repo }}"
          export IMAGE_TAG="${{ steps.vars.outputs.short-sha }}"
          yq -i 'with(select(.kind == "Deployment");
            .metadata.annotations["altinn.studio/image"] = strenv(IMAGE) |
            .metadata.annotations["altinn.studio/image-tag"] = strenv(IMAGE_TAG))' deployment.yaml

      - name: push artifact
        working-directory: src/core/preview/infra/kustomize
        run: |
          flux push artifact oci://${{ steps.vars.outputs.config-repo }} \
            --provider=azure \
            --reproducible \
            --path="." \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)/$(git rev-parse HEAD)"

  tag:
    name: Tag artifact
    needs: [push-artifact, construct-environments-array]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    env:
      REGISTRY_NAME: altinntjenestercontainerregistry
    strategy:
      matrix:
        include: ${{ fromJSON(needs.construct-environments-array.outputs.result) }}
    steps:
      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_FC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FC }}

      - name: az acr login
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: tag artifact
        run: |
          flux tag artifact oci://${{ needs.push-artifact.outputs.CONFIG_REPO }} \
            --tag ${{ matrix.environment == 'preapproved-prod' && 'prod' ||  matrix.environment }}
