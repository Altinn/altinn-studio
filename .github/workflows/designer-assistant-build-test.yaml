name: Studio assistant build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/Designer/assistant/**'
      - '.github/workflows/designer-assistant-build-test.yaml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: self-hosted-ubuntu
    timeout-minutes: 30

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      working-directory: src/Designer/assistant
      run: pip install -r requirements.txt -r requirements-dev.txt

    - name: Run assistant unit tests
      working-directory: src/Designer/assistant
      run: python -m pytest

    - name: Start assistant server
      working-directory: src/Designer/assistant
      run: |
        uvicorn api.main:app --host 0.0.0.0 --port 8071 > server.log 2>&1 &
        sleep 5
        curl --fail --retry 6 --retry-delay 5 --retry-connrefused http://localhost:8071/health

    - name: Output server logs on failure
      if: failure()
      working-directory: src/Designer/assistant
      run: cat server.log
