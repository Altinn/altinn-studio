name: App Backend - Build experimental packages

# Packs the app libraries as `*.Experimental` packages for each pull request change, without publishing them.
# release-app-experimental.yaml publishes them when a maintainer comments `/publish`. The pull request code runs here,
# with no secrets, so it never runs in a job that can log in to nuget.org.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/App/backend/src/**'
      - 'src/App/backend/Directory.*'
      - 'src/App/backend/global.json'
      - 'src/App/backend/solutions/**'
      - 'src/App/frontend/**'
      - 'src/App/PackageVersioning.props'
      - 'src/common/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/actions/app-build-frontend/**'
      - '.github/workflows/app-backend-experimental-build.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pack:
    name: Pack experimental packages
    runs-on: self-hosted-ubuntu
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Altinn.App.Api bundles the app frontend
      - name: Build app frontend
        uses: ./.github/actions/app-build-frontend

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/App/backend/global.json

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/tools/releaser

      - name: Resolve version
        id: version
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # The version the pull request builds on: the latest prerelease on main, or the latest stable release
          # of a release branch. Stacked pull requests target other branches, and build on main's.
          base_branch="$BASE_REF"
          if [[ "$base_branch" != "main" && ! "$base_branch" =~ ^release/app/v[0-9]+\.[0-9]+$ ]]; then
            base_branch=main
          fi
          base="$(go run . resolve-version --component app --base-branch "$base_branch")"
          base="${base#v}"

          # release-app-experimental.yaml checks that the version names this pull request
          echo "version=${base}.pr.${PR_NUMBER}.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "assembly-version=${base%%-*}.0" >> "$GITHUB_OUTPUT"
        working-directory: src/tools/releaser

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSEMBLY_VERSION: ${{ steps.version.outputs.assembly-version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dotnet pack solutions/Src.slnx \
            -c Release \
            --output "${GITHUB_WORKSPACE}/build/experimental" \
            -p:UseExperimentalPackageId=true \
            "-p:ReleasePackageVersion=${VERSION}" \
            "-p:ReleaseAssemblyVersion=${ASSEMBLY_VERSION}" \
            "-p:ReleaseInformationalVersion=${VERSION}+${HEAD_SHA:0:12}"
        working-directory: src/App/backend

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-experimental-packages
          path: |
            build/experimental/*.nupkg
            build/experimental/*.snupkg
          if-no-files-found: error
          retention-days: 7
