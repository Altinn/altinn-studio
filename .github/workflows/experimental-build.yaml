name: experimental - Build

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'src/experimental/**'
      - '.github/workflows/experimental-build.yaml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build and test
    runs-on: self-hosted-ubuntu
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/experimental
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          if ! pkg-config --exists libcap-ng; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libcap-ng-dev
          fi

      # The runner image bakes the toolchain pinned by Cargo.toml; only
      # install through rustup when the two have drifted (e.g. a PR bumping
      # rust-version before the image has been rebuilt).
      - name: Verify Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' "${GITHUB_WORKSPACE}/Cargo.toml")"
          test -n "${RUST_VERSION}"
          if [ "$(rustc --version | awk '{ print $2 }')" != "${RUST_VERSION}" ] \
            || ! rustfmt --version >/dev/null 2>&1 \
            || ! cargo clippy --version >/dev/null 2>&1; then
            rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt,clippy
            rustup default "${RUST_VERSION}"
          fi

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One shared cache for the whole root Cargo workspace, seeded by
          # cache-warm.yml. Restore only: this workflow never runs on main,
          # and saves from PR merge refs cannot be shared with other PRs and
          # evict main-scoped caches.
          shared-key: rust
          save-if: false

      - name: Install cargo-machete
        run: |
          if [ "$(cargo machete --version 2>/dev/null || true)" != "0.9.2" ]; then
            cargo install cargo-machete --version 0.9.2 --locked
          fi

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Check dependencies
        run: make deps-check

  portable-hosts:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Portable host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS ARM64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
          - name: Windows ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: src/experimental
    steps:
      - name: Enable long paths for git on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/experimental
            src/ci/github-runner/coordinator

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-ng-dev

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' "${GITHUB_WORKSPACE}/Cargo.toml")"
          test -n "${RUST_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy
          rustup default "${RUST_VERSION}"

      - name: Check native host
        run: >-
          cargo clippy
          -p sandbox
          -p sandbox-authorization
          -p agent
          -p sandbox-microsandbox
          --all-targets --all-features --locked

      - name: Test native host
        run: >-
          cargo test
          -p sandbox
          -p sandbox-authorization
          -p agent
          -p sandbox-microsandbox
          --all-targets --all-features --locked
