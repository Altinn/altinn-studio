name: App Backend - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/common/dotnet/**'
      - 'src/App/backend/**'
      - 'src/Runtime/common/dotnet/**'
      - 'src/Runtime/localtest/**'
      - 'src/Runtime/workflow-engine-app/tests/WorkflowEngine.App.Tests/Contract/**'
      - '.github/workflows/app-backend-tests.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-frontend:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    timeout-minutes: 10
    runs-on: self-hosted-ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/app-build-frontend
  analyze:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    needs: build-frontend
    strategy:
      matrix:
        os:
          - id: ubuntu-latest
            runner: self-hosted-ubuntu
            workingDir: src/App/backend/
          - id: macos-latest
            runner: macos-latest
            workingDir: src/App/backend/
          - id: windows-latest
            runner: windows-latest
            workingDir: src\App\backend\
    name: Build and test
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 25
    env:
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: false
    steps:
      - name: Enable long paths for git on Windows
        if: matrix.os.id == 'windows-latest'
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/App/backend/global.json
      - name: Tool restore
        working-directory: ${{ matrix.os.workingDir }}
        run: |
          dotnet tool restore
      - name: Build backend
        working-directory: ${{ matrix.os.workingDir }}
        run: |
          dotnet build solutions/All.slnx -v m

      - name: Download built frontend
        if: matrix.os.id == 'ubuntu-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-frontend-dist
          path: src/App/frontend/dist

      - name: Test
        if: matrix.os.id != 'ubuntu-latest'
        working-directory: ${{ matrix.os.workingDir }}
        run: |
          dotnet test solutions/All.slnx -v m --no-restore --no-build --filter "Category!=Integration"
      - name: Test (main tests)
        if: matrix.os.id == 'ubuntu-latest'
        working-directory: ${{ matrix.os.workingDir }}
        run: |
          dotnet test solutions/All.slnx -v m --no-restore --no-build --filter "Category!=Integration"
      - name: Setup studioctl
        if: matrix.os.id == 'ubuntu-latest'
        uses: ./.github/actions/setup-studioctl
      - name: Test (integration tests)
        if: matrix.os.id == 'ubuntu-latest'
        working-directory: ${{ matrix.os.workingDir }}
        run: |
          dotnet test solutions/All.slnx --no-restore --no-build --logger "console;verbosity=detailed" --filter "Category=Integration"
        env:
          SKIP_FRONTEND_BUILD: true
