name: App Frontend - Cypress

on:
  schedule:
    - cron: '0 3 * * 1-5'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/App/backend/**'
      - 'src/App/codelists/**'
      - 'src/App/fileanalyzers/**'
      - 'src/Runtime/common/dotnet/**'
      - 'src/Runtime/localtest/**'
      - 'src/Runtime/pdf3/**'
      - 'src/App/frontend/src/**'
      - 'src/App/frontend/test/**'
      - 'src/App/frontend/package.json'
      - 'src/test/apps/**'
      - 'src/common/ts/form-component/src/**'
      - 'src/common/ts/form-component/package.json'
      - 'src/common/ts/form-engine/src/**'
      - 'src/common/ts/form-engine/package.json'
      - 'src/common/ts/language/src/**'
      - 'src/common/ts/language/package.json'
      - '.github/actions/**'
      - '.github/workflows/app-frontend-cypress.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-frontend:
    if: |
      (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      github.repository_owner == 'Altinn' &&
      (
        (github.event_name != 'pull_request' && github.event.repository.fork == false) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
      )
    name: Build Frontend
    runs-on: self-hosted-ubuntu
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build frontend
        uses: ./.github/actions/app-build-frontend

  build-frontend-external:
    if: |
      (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      github.repository_owner == 'Altinn' &&
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build frontend
        uses: ./.github/actions/app-build-frontend

  build-app-run-targets:
    name: Prepare app process outputs
    if: |
      (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      github.repository_owner == 'Altinn'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && 'ubuntu-latest' || 'self-hosted-ubuntu' }}
    timeout-minutes: 45
    outputs:
      app-run-targets-json: ${{ steps.app-run-targets.outputs.app-run-targets-json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve app run targets
        id: app-run-targets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs/promises');
            const nodePath = require('path');

            const appRoot = 'src/test/apps';
            const entries = await fs.readdir(appRoot, { withFileTypes: true });
            const targets = entries
              .filter(entry => entry.isDirectory())
              .sort((a, b) => a.name.localeCompare(b.name))
              .map(entry => ({ path: nodePath.posix.join(appRoot, entry.name) }));

            if (targets.length === 0) {
              throw new Error('No app run targets were found.');
            }
            core.setOutput('app-run-targets-json', JSON.stringify(targets));

      - name: Resolve app process cache key
        id: app-process-cache-key
        shell: bash
        run: echo "key=app-process-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/test/apps/**', 'src/App/backend/**', 'src/App/codelists/**', 'src/App/fileanalyzers/**', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}" >> "$GITHUB_OUTPUT"

      - name: Cache app process outputs
        id: cache-app-process-outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app-process-build.tar.gz
          key: ${{ steps.app-process-cache-key.outputs.key }}

      - name: Build app process outputs
        if: ${{ steps.cache-app-process-outputs.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          mapfile -t app_projects < <(find src/test/apps -path '*/App/*.csproj' -type f | sort)
          if [ "${#app_projects[@]}" -eq 0 ]; then
            echo "No app projects were found."
            exit 1
          fi

          for project in "${app_projects[@]}"; do
            echo "Building ${project}"
            dotnet build "${project}"
          done

      - name: Package app process outputs
        if: ${{ steps.cache-app-process-outputs.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          mapfile -t build_dirs < <(find \
            src/test/apps \
            src/App/backend/src \
            src/App/codelists/src \
            src/App/fileanalyzers/src \
            -type d \( -name bin -o -name obj \) -prune -print | sort)

          if [ "${#build_dirs[@]}" -eq 0 ]; then
            echo "No app build output directories were found."
            exit 1
          fi

          tar -czf app-process-build.tar.gz "${build_dirs[@]}"

      - name: Upload app process outputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-process-build
          path: app-process-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-studioctl:
    name: Prepare studioctl and LocalTest image caches
    if: |
      (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      github.repository_owner == 'Altinn'
    permissions: {}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && 'ubuntu-latest' || 'self-hosted-ubuntu' }}
    timeout-minutes: 15
    outputs:
      localtest-image-cache-key: ${{ steps.localtest-images.outputs.cache-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up studioctl dev install
        uses: ./.github/actions/setup-studioctl

      - name: Populate LocalTest image cache
        id: localtest-images
        uses: ./.github/actions/setup-localtest-images
        with:
          populate-cache: true

  prepare-app-frontend-dependencies:
    name: Prepare App Frontend test dependency cache
    if: |
      (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      github.repository_owner == 'Altinn'
    permissions: {}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && 'ubuntu-latest' || 'self-hosted-ubuntu' }}
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.dependencies.outputs.cache-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Populate App Frontend test dependency cache
        id: dependencies
        uses: ./.github/actions/app-frontend-test-dependencies
        with:
          populate-cache: true

  cypress-run-internal:
    name: Cypress Run Internal
    if: |
      (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      github.repository_owner == 'Altinn' &&
      (
        (github.event_name != 'pull_request' && github.event.repository.fork == false) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
      )
    runs-on: self-hosted-ubuntu
    timeout-minutes: 120
    needs: [build-frontend, build-app-run-targets, build-studioctl, prepare-app-frontend-dependencies]
    defaults:
      run:
        working-directory: src/App/frontend/
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download app process outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-process-build
          path: /tmp/app-process-build

      - name: Extract app process outputs
        shell: bash
        run: tar -xzf /tmp/app-process-build/app-process-build.tar.gz -C "${GITHUB_WORKSPACE}"

      - name: Restore App Frontend test dependencies
        uses: ./.github/actions/app-frontend-test-dependencies
        with:
          cache-key: ${{ needs.prepare-app-frontend-dependencies.outputs.cache-key }}
          require-cache-hit: true

      - name: Run Local Environment
        uses: ./.github/actions/app-run-local-env
        with:
          run-localtest: true
          app-run-targets-json: ${{ needs.build-app-run-targets.outputs.app-run-targets-json }}
          skip-app-build: true
          localtest-image-cache-key: ${{ needs.build-studioctl.outputs.localtest-image-cache-key }}

      - name: Set Percy command based on PR draft status or main branch
        shell: bash
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.event.pull_request.draft }}" == "false" ]; then
            echo "ENABLE_PERCY=true" >> "$GITHUB_ENV"
          fi

      # The runner image bakes the Cypress binary at CYPRESS_CACHE_FOLDER;
      # this is a no-op on version match and a fallback download on drift.
      - name: Install Cypress binary
        shell: bash
        run: npx cypress install

      - name: Cypress run
        id: cypress
        shell: bash
        env:
          CYPRESS_PROJECT_ID: o7mikf
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }} # CYPRESS_RECORD_KEY comes from "org secrets"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_PARALLEL_TOTAL: 6
          PERCY_PARALLEL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_TARGET_BRANCH: ${{ github.base_ref || 'main' }}
          IS_PR_DRAFT: ${{ github.event.pull_request.draft }}
          E2E_SHARD_TOTAL: 6
          E2E_SHARD_NUMBER: ${{ matrix.containers }}
        run: |
          cypress_args=(
            run
            --record
            --group "altinn-app-frontend-shard-${{ matrix.containers }}"
            --tag altinn-app-frontend
            --browser "${CHROME_PATH:-chrome}"
            --ci-build-id "${{ github.run_id }}-${{ github.run_attempt }}"
            --spec test/e2e/integration
            --env environment=localtest
          )

          if [ "${ENABLE_PERCY:-false}" = "true" ]; then
            npx percy exec --parallel -- npx cypress "${cypress_args[@]}"
          else
            npx cypress "${cypress_args[@]}"
          fi

      - name: Stop localtest
        if: always()
        uses: ./.github/actions/app-stop-local-env
        with:
          collect-diagnostics: ${{ steps.cypress.outcome == 'failure' }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() && steps.cypress.outcome == 'failure' }}
        with:
          name: app-frontend-logs-${{ matrix.containers }}
          path: |
            src/App/frontend/frontend-server.log
            src/App/frontend/local-env-diagnostics.log
            src/App/frontend/localtest-container.log
            src/App/frontend/test/logs/*
            src/App/frontend/test/screenshots/**
            ${{ env.STUDIOCTL_HOME }}/logs/**

  cypress-run-external:
    name: Cypress Run External
    if: |
      (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      github.repository_owner == 'Altinn' &&
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)

    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [build-frontend-external, build-app-run-targets, build-studioctl, prepare-app-frontend-dependencies]
    defaults:
      run:
        working-directory: src/App/frontend/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download app process outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-process-build
          path: /tmp/app-process-build

      - name: Extract app process outputs
        shell: bash
        run: tar -xzf /tmp/app-process-build/app-process-build.tar.gz -C "${GITHUB_WORKSPACE}"

      - name: Restore App Frontend test dependencies
        uses: ./.github/actions/app-frontend-test-dependencies
        with:
          cache-key: ${{ needs.prepare-app-frontend-dependencies.outputs.cache-key }}
          require-cache-hit: true

      - name: Run Local Environment
        uses: ./.github/actions/app-run-local-env
        with:
          run-localtest: true
          app-run-targets-json: ${{ needs.build-app-run-targets.outputs.app-run-targets-json }}
          skip-app-build: true
          localtest-image-cache-key: ${{ needs.build-studioctl.outputs.localtest-image-cache-key }}

      - name: Install Cypress binary
        shell: bash
        run: npx cypress install

      - name: Cypress run
        id: cypress
        shell: bash
        run: npx cypress run --browser "${CHROME_PATH:-chrome}" --spec test/e2e/integration --env environment=localtest

      - name: Stop localtest
        if: always()
        uses: ./.github/actions/app-stop-local-env
        with:
          collect-diagnostics: ${{ steps.cypress.outcome == 'failure' }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() && steps.cypress.outcome == 'failure' }}
        with:
          name: app-frontend-external-logs
          path: |
            src/App/frontend/frontend-server.log
            src/App/frontend/local-env-diagnostics.log
            src/App/frontend/localtest-container.log
            src/App/frontend/test/logs/*
            src/App/frontend/test/screenshots/*
            src/App/frontend/test/videos/*
            ${{ env.STUDIOCTL_HOME }}/logs/**
