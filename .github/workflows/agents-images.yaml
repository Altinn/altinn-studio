name: Agents - build images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agents/**
      - .github/workflows/agents-images.yaml
      - '!**/AGENTS.md'
      - '!**/README.md'
      - '!**/readme.md'
      - '!**/_readme.md' # C# layout model documentation in Altinn.App.Core.
      - '!**/CONTRIBUTING.md'
      - '!**/CHANGELOG.md'
      - '!**/docs/**'
  push:
    branches:
      - main
    paths:
      - agents/**
      - .github/workflows/agents-images.yaml
      - '!**/AGENTS.md'
      - '!**/README.md'
      - '!**/readme.md'
      - '!**/_readme.md' # C# layout model documentation in Altinn.App.Core.
      - '!**/CONTRIBUTING.md'
      - '!**/CHANGELOG.md'
      - '!**/docs/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: agents-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Each architecture builds on a native runner, as digdir/digdir-agents builds the base: under QEMU,
  # the base's containers feature fails its own nft check, which opens a netlink socket QEMU cannot
  # emulate. The publish job joins the architectures' images into the tags.
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build ${{ matrix.variant }} Agent (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, desktop]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - variant: minimal
            repository: ghcr.io/altinn/altinn-studio/agent-minimal
          # The desktop image is one stage on top of minimal, so it warms its build from that image's
          # cache as well as its own.
          - variant: desktop
            repository: ghcr.io/altinn/altinn-studio/agent-desktop
            extra_cache: ghcr.io/altinn/altinn-studio/agent-minimal
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            agents

      # The containerd image store keeps the image the build step pushes, so the smoke test runs it
      # without a second copy on the runner's disk.
      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The docker driver cannot push by digest, so each architecture's image is pushed under its own
      # tag, and the publish job joins them by digest.
      - name: Build and push image
        env:
          ARCH: ${{ matrix.arch }}
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          EXTRA_CACHE: ${{ matrix.extra_cache }}
          TARGET: ${{ matrix.variant }}
        run: |
          set -eu
          set --

          if [ -n "${EXTRA_CACHE}" ]; then
            set -- --cache-from "type=registry,ref=${EXTRA_CACHE}:buildcache-${ARCH}"
          fi

          if [ "${CAN_PUSH}" = "true" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              pr_number="$(jq -r '.number' "${GITHUB_EVENT_PATH}")"
              source_sha="$(jq -r '.pull_request.head.sha' "${GITHUB_EVENT_PATH}")"
              image="${IMAGE_REPOSITORY}:pr-${pr_number}-${source_sha::10}-${ARCH}"
            else
              image="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA::10}-${ARCH}"
            fi
            set -- "$@" \
              --output "type=image,name=${image},push=true" \
              --cache-to "type=registry,ref=${IMAGE_REPOSITORY}:buildcache-${ARCH},mode=max,image-manifest=true"
          else
            image="agent-${TARGET}:smoke"
            set -- "$@" --load --tag "${image}"
          fi

          docker buildx build \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=${IMAGE_REPOSITORY}:buildcache-${ARCH}" \
            "$@" \
            --file agents/Dockerfile \
            --platform "linux/${ARCH}" \
            --target "${TARGET}" \
            agents
          echo "SMOKE_IMAGE=${image}" >> "${GITHUB_ENV}"

          if [ "${CAN_PUSH}" = "true" ]; then
            digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
            case "${digest}" in
              sha256:*) ;;
              *) echo "::error::no digest for ${image}: ${digest}"; exit 1 ;;
            esac
            mkdir -p "${RUNNER_TEMP}/digests"
            touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
          fi

      # Smoke-test what the Altinn image adds to the base, in the image the step above built.
      - name: Smoke test image
        env:
          TARGET: ${{ matrix.variant }}
        run: |
          docker run --rm --entrypoint bash \
            --volume "${PWD}/agents/smoke.sh:/smoke.sh:ro" \
            "${SMOKE_IMAGE}" /smoke.sh "${TARGET}"

      - name: Upload image digest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  # Tags the multi-platform image only once both architectures have built and passed the smoke test.
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Publish ${{ matrix.variant }} Agent
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: minimal
            repository: ghcr.io/altinn/altinn-studio/agent-minimal
          - variant: desktop
            repository: ghcr.io/altinn/altinn-studio/agent-desktop
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag multi-platform image
        env:
          IMAGE_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -eu

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            pr_number="$(jq -r '.number' "${GITHUB_EVENT_PATH}")"
            source_sha="$(jq -r '.pull_request.head.sha' "${GITHUB_EVENT_PATH}")"
            set -- \
              --tag "${IMAGE_REPOSITORY}:pr-${pr_number}" \
              --tag "${IMAGE_REPOSITORY}:pr-${pr_number}-${source_sha::10}"
          else
            set -- \
              --tag "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA::10}" \
              --tag "${IMAGE_REPOSITORY}:latest"
          fi

          for digest in "${RUNNER_TEMP}"/digests/*; do
            set -- "$@" "${IMAGE_REPOSITORY}@sha256:${digest##*/}"
          done
          docker buildx imagetools create "$@"
          docker buildx imagetools inspect "$2"
