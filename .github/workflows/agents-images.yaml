name: Agents - build images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - agents/**
      - .github/workflows/agents-images.yaml
  push:
    branches:
      - main
    paths:
      - agents/**
      - .github/workflows/agents-images.yaml
  workflow_call:
    inputs:
      agent_version:
        description: Experimental Agent release tag or version to install
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: agents-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build ${{ matrix.variant }} Agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: minimal
            repository: ghcr.io/altinn/altinn-studio/agent-minimal
          - variant: full
            repository: ghcr.io/altinn/altinn-studio/agent-full
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            agents

      - name: Resolve Agent release
        id: agent-version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.agent_version }}
        run: |
          set -eu
          version="${REQUESTED_VERSION#experimental-agent/}"
          if [ -z "${version}" ]; then
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.draft == false) | .tag_name | select(startswith("experimental-agent/v"))][0]')"
            version="${tag#experimental-agent/}"
          fi
          test -n "${version}"
          case "${version}" in v*) ;; *) version="v${version}" ;; esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish image
        env:
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          TARGET: ${{ matrix.variant }}
          AGENT_VERSION: ${{ steps.agent-version.outputs.version }}
        run: |
          set -eu

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            pr_number="$(jq -r '.number' "${GITHUB_EVENT_PATH}")"
            source_sha="$(jq -r '.pull_request.head.sha' "${GITHUB_EVENT_PATH}")"
            short_sha="${source_sha::10}"
            set -- \
              --tag "${IMAGE_REPOSITORY}:pr-${pr_number}" \
              --tag "${IMAGE_REPOSITORY}:pr-${pr_number}-${short_sha}"
          else
            short_sha="${GITHUB_SHA::10}"
            set -- \
              --tag "${IMAGE_REPOSITORY}:sha-${short_sha}" \
              --tag "${IMAGE_REPOSITORY}:latest"
          fi

          if [ "${CAN_PUSH}" = "true" ]; then
            set -- "$@" \
              --push \
              --cache-to "type=registry,ref=${IMAGE_REPOSITORY}:buildcache,mode=max,image-manifest=true"
          fi

          docker buildx build \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=${IMAGE_REPOSITORY}:buildcache" \
            --build-arg "AGENT_VERSION=${AGENT_VERSION}" \
            --file agents/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --target "${TARGET}" \
            "$@" \
            agents

      # The multi-platform build above only pushes. Load the native image separately (fully
      # cached by the step above) and exercise the pull request evidence tooling in it.
      - name: Smoke test amd64 image
        env:
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          TARGET: ${{ matrix.variant }}
          AGENT_VERSION: ${{ steps.agent-version.outputs.version }}
        run: |
          set -eu
          docker buildx build \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=${IMAGE_REPOSITORY}:buildcache" \
            --build-arg "AGENT_VERSION=${AGENT_VERSION}" \
            --file agents/Dockerfile \
            --platform linux/amd64 \
            --target "${TARGET}" \
            --load \
            --tag "agent-${TARGET}:smoke" \
            agents
          docker run --rm --init --ipc=host --security-opt seccomp=unconfined --entrypoint bash \
            --env "EXPECTED_AGENT_VERSION=${AGENT_VERSION}" \
            --volume "${PWD}/agents/smoke.sh:/smoke.sh:ro" \
            "agent-${TARGET}:smoke" /smoke.sh "${TARGET}"
