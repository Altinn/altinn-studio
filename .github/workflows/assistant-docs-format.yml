name: Assistant - Markdown code formatting

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/AI/assistant/**/*.md'
      - 'src/AI/assistant/pyproject.toml'
      - 'src/AI/assistant/requirements-dev.txt'
      - '.github/workflows/assistant-docs-format.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Check Python examples in Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Ruff
        working-directory: src/AI/assistant
        run: python -m pip install "$(grep -E '^ruff([<>=!~]|$)' requirements-dev.txt)"

      - name: Check Markdown code formatting
        working-directory: src/AI/assistant
        run: ruff format --check --config 'include = ["*.md"]' .
