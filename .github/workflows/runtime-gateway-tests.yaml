name: Runtime Gateway - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/common/dotnet/**'
      - 'src/Runtime/gateway/**'
      - 'src/Runtime/devenv/**'
      - '.github/workflows/runtime-gateway-tests.yaml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/Runtime/gateway/
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            10.0.x

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/Runtime/gateway/go.mod
          cache-dependency-path: src/Runtime/gateway/go.sum

      - name: Restore
        run: make restore

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run fixture
        id: fixture
        run: make start-minimal

      - name: Collect fixture diagnostics
        if: ${{ failure() && steps.fixture.outcome == 'failure' }}
        continue-on-error: true
        run: make -C ../devenv diagnostics

      - name: Run e2e tests
        run: make test-e2e
