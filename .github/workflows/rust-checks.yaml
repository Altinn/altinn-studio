name: Rust checks

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'src/experimental/**'
      - 'src/github-runner/Dockerfile.coordinator'
      - 'src/github-runner/coordinator/**'
      - '.github/workflows/rust-checks.yaml'

permissions:
  contents: read

jobs:
  check:
    name: Check Rust workspace
    runs-on: self-hosted-ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "${RUST_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}" --component rustfmt,clippy
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Check Microsandbox version pins
        run: |
          runtime_version="$(sed -n 's/^ARG MICROSANDBOX_RUNTIME_VERSION=//p' src/github-runner/Dockerfile.coordinator)"
          lock_version="$(awk '
            $0 == "name = \"microsandbox\"" { found = 1; next }
            found && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.lock)"
          if [ -z "${runtime_version}" ] || [ -z "${lock_version}" ] || [ "${runtime_version}" != "${lock_version}" ]; then
            echo "::error title=Microsandbox pin skew::Dockerfile MICROSANDBOX_RUNTIME_VERSION (${runtime_version:-<missing>}) does not match Cargo.lock microsandbox version (${lock_version:-<missing>})."
            exit 1
          fi

      - name: Check experimental Rust crates
        run: make -C src/experimental check-ci

      - name: Check GitHub runner coordinator
        run: make -C src/github-runner/coordinator check
