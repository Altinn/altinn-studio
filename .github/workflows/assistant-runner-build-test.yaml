name: Assistant runner - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'src/AI/assistant-runner/**'
      - 'src/ci/sandbox-host/**'
      - '.github/workflows/assistant-runner-build-test.yaml'
      - '!**/AGENTS.md'
      - '!**/README.md'
      - '!**/readme.md'
      - '!**/_readme.md' # C# layout model documentation in Altinn.App.Core.
      - '!**/CONTRIBUTING.md'
      - '!**/CHANGELOG.md'
      - '!**/docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build and test
    runs-on: self-hosted-ubuntu
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/AI/assistant-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One shared cache for the whole root Cargo workspace, seeded by
          # cache-warm.yml. Restore only: this workflow never runs on main,
          # and saves from PR merge refs cannot be shared with other PRs and
          # evict main-scoped caches.
          shared-key: rust
          save-if: false

      - name: Install cargo-machete
        run: |
          if [ "$(cargo machete --version 2>/dev/null || true)" != "0.9.2" ]; then
            cargo install cargo-machete --version 0.9.2 --locked
          fi

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Check dependencies
        run: make deps-check

  job-host:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Test the guest image and the job host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGISTRY: localhost:5443
      JOB_HOST_IMAGE: assistant-runner:ci
      JOB_HOST_URL: http://127.0.0.1:8080
      # In a cluster, the PodTemplate sets these. This job runs the container without it.
      SANDBOX_CPUS: "2"
      SANDBOX_MEMORY: 4Gi
      SANDBOX_ROOT_FILESYSTEM: 20Gi
      REQUEST_TIMEOUT_SECONDS: "120"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The prepared image is exported from a registry. A registry on this runner with a CA made here needs no
      # credentials and publishes nothing. Rustls refuses a self-signed CA certificate as the server certificate, so
      # the CA signs a separate server certificate.
      - name: Start a registry on this runner
        working-directory: ${{ runner.temp }}
        run: |
          mkdir registry
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=CI registry CA' \
            -keyout registry/ca.key -out registry/ca.crt
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' -keyout registry/tls.key -out registry/tls.csr
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'subjectAltName=DNS:localhost' \
            'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > registry/tls.ext
          openssl x509 -req -in registry/tls.csr -CA registry/ca.crt -CAkey registry/ca.key -days 1 \
            -extfile registry/tls.ext -out registry/tls.crt
          sudo mkdir -p "/etc/docker/certs.d/${REGISTRY}"
          sudo cp registry/ca.crt "/etc/docker/certs.d/${REGISTRY}/ca.crt"
          docker run --detach --name registry --publish 127.0.0.1:5443:5443 \
            --env REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
            --env REGISTRY_HTTP_TLS_CERTIFICATE=/certs/tls.crt --env REGISTRY_HTTP_TLS_KEY=/certs/tls.key \
            --volume "${PWD}/registry:/certs:ro" \
            registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8

      - name: Build the guest image and push it to the registry
        working-directory: src/AI/assistant-runner
        run: |
          docker build -t "${REGISTRY}/assistant-runner-guest:ci" -f Dockerfile.guest .
          docker push "${REGISTRY}/assistant-runner-guest:ci"
          image="$(docker inspect --format '{{index .RepoDigests 0}}' "${REGISTRY}/assistant-runner-guest:ci")"
          echo "SANDBOX_IMAGE=${image}" >> "${GITHUB_ENV}"

      # The same commands in a container show quickly that the image can upgrade and build apps. The steps after them
      # run an upgrade in a microVM.
      - name: Upgrade the v8 template, and build the result
        run: |
          docker run --rm -v "${PWD}/src/App/template/v8/src:/template:ro" "${REGISTRY}/assistant-runner-guest:ci" sh -c '
            set -eu
            cp -R /template app
            cd app
            git init --quiet
            git add -A
            git commit --quiet --message base
            studioctl app upgrade v9 -p . --json
            dotnet build App/App.csproj -nologo -v:q --disable-build-servers >&2
          ' > "${RUNNER_TEMP}/upgrade.json"
          jq -e '.exitCode == 0' "${RUNNER_TEMP}/upgrade.json" || { jq . "${RUNNER_TEMP}/upgrade.json"; exit 1; }

      - name: Build the v9 template
        run: |
          docker run --rm -v "${PWD}/src/App/template/v9/src:/template:ro" "${REGISTRY}/assistant-runner-guest:ci" sh -c '
            set -eu
            cp -R /template app
            cd app
            dotnet build App/App.csproj -nologo -v:q --disable-build-servers
          '

      - name: Build the job host image
        run: docker build -t "${JOB_HOST_IMAGE}" -f src/AI/assistant-runner/Dockerfile .

      # On a sandbox node, root owns the hostPath folders, and the root of the pod has no capabilities. The export
      # trusts the CA of the registry through the Microsandbox configuration in its Provider home.
      - name: Export and import the prepared guest image, as the deploy and the init container do
        run: |
          mkdir -p "${RUNNER_TEMP}"/{prepared,export-cache,export-home/runtime,cache,home}
          sudo chown 0:0 "${RUNNER_TEMP}"/{cache,home}
          echo '{"registries":{"ca_certs":"/certs/ca.crt"}}' > "${RUNNER_TEMP}/export-home/runtime/config.json"
          docker run --rm --network host --entrypoint /usr/local/bin/sandbox-image \
            --env SANDBOX_PROVIDER_HOME=/provider --env SANDBOX_CACHE_HOME=/cache \
            --env PREPARED_IMAGE_DIRECTORY=/output --env SANDBOX_IMAGE \
            --volume "${RUNNER_TEMP}/export-home:/provider" --volume "${RUNNER_TEMP}/registry/ca.crt:/certs/ca.crt:ro" \
            --volume "${RUNNER_TEMP}/export-cache:/cache" --volume "${RUNNER_TEMP}/prepared:/output" \
            "${JOB_HOST_IMAGE}" export
          docker run --rm --entrypoint /usr/local/bin/sandbox-image \
            --env SANDBOX_PROVIDER_HOME=/tmp/sandbox-provider --env SANDBOX_CACHE_HOME=/cache \
            --env PREPARED_IMAGE_DIRECTORY=/prepared --env SANDBOX_IMAGE \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --volume "${RUNNER_TEMP}/cache:/cache" --volume "${RUNNER_TEMP}/prepared:/prepared:ro" \
            "${JOB_HOST_IMAGE}" import

      # Starts the job host with the restrictions of the pod: root without capabilities, a read-only root file system
      # and /dev/kvm. The settings of the job host come from the environment of the step.
      - name: Write the start script
        run: |
          cat > "${RUNNER_TEMP}/start-job-host.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          docker run --detach --name job-host --publish 127.0.0.1:8080:8080 \
            --device /dev/kvm --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp \
            --volume "${RUNNER_TEMP}/home:/var/lib/altinn/sandbox-provider" \
            --volume "${RUNNER_TEMP}/cache:/var/cache/altinn/sandbox" \
            --env SANDBOX_IMAGE --env SANDBOX_CPUS --env SANDBOX_MEMORY --env SANDBOX_ROOT_FILESYSTEM \
            --env REQUEST_TIMEOUT_SECONDS "${JOB_HOST_IMAGE}"
          for _ in $(seq 1 60); do
            curl -fsS "${JOB_HOST_URL}/health" && exit 0
            sleep 1
          done
          exit 1
          SCRIPT
          chmod +x "${RUNNER_TEMP}/start-job-host.sh"

      - name: Upgrade the v8 template, and check the patch and the exit
        run: |
          "${RUNNER_TEMP}/start-job-host.sh"
          tar -czf "${RUNNER_TEMP}/app.tar.gz" -C src/App/template/v8/src .
          curl -sS --fail-with-body --max-time 720 -H 'Content-Type: application/gzip' \
            --data-binary "@${RUNNER_TEMP}/app.tar.gz" "${JOB_HOST_URL}/api/v1/upgrades/v9" > "${RUNNER_TEMP}/answer.json"
          jq -e '.exitCode == 0 and .patch != null' "${RUNNER_TEMP}/answer.json" > /dev/null \
            || { jq 'del(.patch)' "${RUNNER_TEMP}/answer.json"; exit 1; }
          jq -r .patch "${RUNNER_TEMP}/answer.json" | base64 -d > "${RUNNER_TEMP}/changes.patch"
          cp -R src/App/template/v8/src "${RUNNER_TEMP}/app"
          git -C "${RUNNER_TEMP}/app" apply --check "${RUNNER_TEMP}/changes.patch"
          test "$(timeout 120 docker wait job-host)" = 0
          docker rm job-host

      - name: Exit when no job request comes
        env:
          REQUEST_TIMEOUT_SECONDS: "5"
        run: |
          "${RUNNER_TEMP}/start-job-host.sh"
          test "$(timeout 60 docker wait job-host)" = 0
          docker rm job-host

      - name: Exit with 143 on SIGTERM
        run: |
          "${RUNNER_TEMP}/start-job-host.sh"
          docker stop --time 60 job-host
          test "$(docker inspect --format '{{.State.ExitCode}}' job-host)" = 143
          docker rm job-host

      - name: Show the job host log
        if: ${{ failure() }}
        run: docker logs job-host || true
