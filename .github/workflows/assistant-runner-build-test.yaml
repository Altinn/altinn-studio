name: Assistant runner - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/AI/assistant-runner/**'
      - '.github/workflows/assistant-runner-build-test.yaml'
      - '!**/AGENTS.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    defaults:
      run:
        working-directory: src/AI/assistant-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/AI/assistant-runner/global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build

      - name: Build the image
        run: docker build -t assistant-runner:ci -f Dockerfile .

      # The tests use a fake job, because a real job needs root and the user app-build. The image
      # has both. The container gets the restrictions of the pod: a read-only root file system,
      # only the capabilities CHOWN, SETUID and SETGID, no privilege escalation, and tmpfs for
      # /work and /tmp. The jobs get NuGet packages from nuget.org.
      - name: Start the image
        run: |
          docker run -d --name assistant-runner -p 8080:8080 \
            --read-only \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges \
            --tmpfs /work:exec --tmpfs /tmp \
            assistant-runner:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = 200

      - name: Upgrade the v8 template, and check that the patch applies
        working-directory: ${{ github.workspace }}
        run: |
          tar -czf "$RUNNER_TEMP/v8.tar.gz" -C src/App/template/v8/src .
          curl -fsS -X POST -H 'Content-Type: application/gzip' --data-binary "@$RUNNER_TEMP/v8.tar.gz" \
            http://127.0.0.1:8080/api/v1/upgrades/v9 -o "$RUNNER_TEMP/upgrade.json"
          jq -e '.exitCode == 0 and .timedOut == false' "$RUNNER_TEMP/upgrade.json" \
            || { jq -r '.stdout, .stderr' "$RUNNER_TEMP/upgrade.json"; exit 1; }
          jq -r '.patch' "$RUNNER_TEMP/upgrade.json" | base64 -d > "$RUNNER_TEMP/upgrade.patch"
          test -s "$RUNNER_TEMP/upgrade.patch"
          git apply --check --directory=src/App/template/v8/src "$RUNNER_TEMP/upgrade.patch"

      - name: Build the v9 template, and send a second request while the build runs
        working-directory: ${{ github.workspace }}
        run: |
          tar -czf "$RUNNER_TEMP/v9.tar.gz" -C src/App/template/v9/src .
          curl -fsS -X POST -H 'Content-Type: application/gzip' --data-binary "@$RUNNER_TEMP/v9.tar.gz" \
            http://127.0.0.1:8080/api/v1/builds -o "$RUNNER_TEMP/build.json" &
          build=$!
          sleep 2
          second=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/gzip' \
            --data-binary "@$RUNNER_TEMP/v9.tar.gz" http://127.0.0.1:8080/api/v1/builds)
          wait "$build"
          test "$second" = 503
          jq -e '.exitCode == 0 and .timedOut == false and .patch == null' "$RUNNER_TEMP/build.json" \
            || { jq -r '.stdout, .stderr' "$RUNNER_TEMP/build.json"; exit 1; }

      - name: Check that the jobs left no processes and no files
        run: |
          test -z "$(docker exec assistant-runner ps -u app-build -o pid=)"
          test -z "$(docker exec assistant-runner find /work /tmp /dev/shm -mindepth 1 -user app-build)"

      - name: Image logs
        if: ${{ always() }}
        run: docker logs assistant-runner || true
