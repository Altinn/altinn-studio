name: GitHub Runner - Parity Diagnostics
run-name: Runner comparison (${{ inputs.scenario }})

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Node-cache state prepared for this run
        required: true
        type: choice
        options:
          - cold
          - hot

jobs:
  compare:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Self-hosted single-container runner
            runner: self-hosted-single
          - name: Self-hosted Ubuntu runner
            runner: self-hosted-ubuntu
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Get Yarn cache directory path
        id: yarn-cache-dir-path
        working-directory: src/App/frontend
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        working-directory: src/App/frontend
        run: yarn --immutable

      - name: Type-check
        working-directory: src/App/frontend
        run: yarn tsc

      - name: Strict type-check
        working-directory: src/App/frontend
        run: |
          strict_error_count="$(yarn tsc-strict:error-count)"
          echo "Strict TypeScript error count: ${strict_error_count}"

          if (( strict_error_count >= 301 )); then
            echo "Strict TypeScript error count is ${strict_error_count}, expected less than 301."
            exit 1
          fi

      - name: Lint
        working-directory: src/App/frontend
        run: yarn lint

      - name: Test
        working-directory: src/App/frontend
        run: yarn test --coverage --maxWorkers=4
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Record comparison metadata
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.yarn-cache.outputs.cache-hit }}
          COMPARISON_NAME: ${{ matrix.name }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          {
            echo "### ${COMPARISON_NAME}"
            echo
            echo "- Scenario: \`${SCENARIO}\`"
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- OS/architecture: \`${RUNNER_OS}/${RUNNER_ARCH}\`"
            echo "- Yarn cache hit: \`${CACHE_HIT:-false}\`"
          } >> "$GITHUB_STEP_SUMMARY"
