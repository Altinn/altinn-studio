name: Release - studioctl

# Automatically triggers release when a changelog promotion PR is merged.
# PRs must have the 'release/studioctl' label.

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - 'release/studioctl/v*'
    paths:
      - 'src/cli/CHANGELOG.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    # Automatically release same-repo release PRs. Fork PRs can be retried manually
    # from their merged base branch because their pull_request token cannot publish releases.
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_type == 'branch'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'release/studioctl')
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Checkout base branch
        env:
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          MERGE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          if [[ "${BASE_BRANCH}" != "main" && ! "${BASE_BRANCH}" =~ ^release/studioctl/v[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base branch: ${BASE_BRANCH}"
            exit 1
          fi

          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "$MERGE_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/cli/global.json

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/tools/releaser

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
        run: |
          go run . workflow --component studioctl --base-branch "$BASE_BRANCH"
        working-directory: src/tools/releaser

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo ""
            if [[ -n "${PR_NUMBER}" ]]; then
              echo "- **PR**: #${PR_NUMBER}"
            fi
            echo "- **Base branch**: ${BASE_BRANCH}"
            echo "- **Version source**: latest released section in src/cli/CHANGELOG.md"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -d "build/release" ]]; then
            {
              echo "### Assets"
              echo '```'
              ls -la build/release/ 2>/dev/null || echo "No assets found"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
