name: Release - components

# Release from trusted canonical branch updates after a release preparation PR merges.
# Manual dispatch is retained for recovery and must target the component's canonical branch.

on:
  push:
    branches:
      - main
      - 'release/app/v*'
      - 'release/studioctl/v*'
    paths:
      - 'src/App/backend/CHANGELOG.md'
      - 'src/cli/CHANGELOG.md'
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        required: true
        type: choice
        options:
          - app
          - studioctl

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve-trigger:
    name: Resolve release trigger
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.resolve.outputs.component }}
      base-branch: ${{ steps.resolve.outputs.base-branch }}
      merge-sha: ${{ steps.resolve.outputs.merge-sha }}
      pull-request-number: ${{ steps.resolve.outputs.pull-request-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'src/tools/releaser/go.mod'
          cache-dependency-path: src/tools/releaser/go.sum

      - name: Resolve release trigger
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          MERGE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          SELECTED_COMPONENT: ${{ inputs.component || '' }}
        run: |
          result_file="$RUNNER_TEMP/release-trigger.json"
          go run . resolve-trigger \
            -event-name "$EVENT_NAME" \
            -ref-name "$REF_NAME" \
            -ref-type "$REF_TYPE" \
            -sha "$MERGE_SHA" \
            -before-sha "$BEFORE_SHA" \
            -selected-component "$SELECTED_COMPONENT" > "$result_file"

          component="$(jq -r '.component' "$result_file")"
          base_branch="$(jq -r '.baseBranch' "$result_file")"
          merge_sha="$(jq -r '.mergeSha' "$result_file")"
          pull_request_number="$(jq -r '.pullRequestNumber' "$result_file")"

          {
            echo "component=$component"
            echo "base-branch=$base_branch"
            echo "merge-sha=$merge_sha"
            echo "pull-request-number=$pull_request_number"
          } >> "$GITHUB_OUTPUT"

          if [[ -z "$component" ]]; then
            echo "No release-labelled pull request is associated with this push."
          else
            echo "Resolved $component release from $base_branch."
          fi
        working-directory: src/tools/releaser

  resolve-release-context:
    name: Resolve release context
    if: needs.resolve-trigger.outputs.component != ''
    needs: resolve-trigger
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-trigger.outputs.merge-sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'src/tools/releaser/go.mod'
          cache-dependency-path: src/tools/releaser/go.sum

      - name: Resolve environment
        id: context
        env:
          COMPONENT: ${{ needs.resolve-trigger.outputs.component }}
          BASE_BRANCH: ${{ needs.resolve-trigger.outputs.base-branch }}
        run: |
          version="$(go run . resolve-version --component "$COMPONENT" --base-branch "$BASE_BRANCH")"

          environment="prod"
          if [[ "$version" == *"-preview."* ]]; then
            environment="dev"
          elif [[ "$version" == *"-rc."* ]]; then
            environment="staging"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
        working-directory: src/tools/releaser

  release-app:
    name: Build, release and publish app
    if: needs.resolve-trigger.outputs.component == 'app'
    needs:
      - resolve-trigger
      - resolve-release-context
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: ${{ needs.resolve-release-context.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.resolve-trigger.outputs.merge-sha }}
          persist-credentials: false

      - name: Checkout base branch
        env:
          BASE_BRANCH: ${{ needs.resolve-trigger.outputs.base-branch }}
          MERGE_SHA: ${{ needs.resolve-trigger.outputs.merge-sha }}
        run: |
          git fetch origin "$BASE_BRANCH"
          if ! git merge-base --is-ancestor "$MERGE_SHA" FETCH_HEAD; then
            echo "Release commit $MERGE_SHA is not on origin/$BASE_BRANCH" >&2
            exit 1
          fi
          git checkout -B "$BASE_BRANCH" "$MERGE_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/App/backend/global.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'src/tools/releaser/go.mod'
          cache-dependency-path: src/tools/releaser/go.sum

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ needs.resolve-trigger.outputs.base-branch }}
        run: go run . workflow --component app --base-branch "$BASE_BRANCH"
        working-directory: src/tools/releaser

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(build/release/*.nupkg build/release/*.snupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No NuGet packages found in build/release" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Summary
        if: always()
        env:
          BASE_BRANCH: ${{ needs.resolve-trigger.outputs.base-branch }}
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pull-request-number }}
          RELEASE_VERSION: ${{ needs.resolve-release-context.outputs.version }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            if [[ -n "${PR_NUMBER}" ]]; then
              echo "- **PR**: #${PR_NUMBER}"
            fi
            echo "- **Base branch**: ${BASE_BRANCH}"
            echo "- **Version**: ${RELEASE_VERSION}"
            echo "- **Environment**: ${{ needs.resolve-release-context.outputs.environment }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -d "build/release" ]]; then
            {
              echo "### NuGet packages"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ls -la build/release/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No packages found" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  release-studioctl:
    name: Build and release studioctl
    if: needs.resolve-trigger.outputs.component == 'studioctl'
    needs:
      - resolve-trigger
      - resolve-release-context
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.resolve-trigger.outputs.merge-sha }}

      - name: Checkout base branch
        env:
          BASE_BRANCH: ${{ needs.resolve-trigger.outputs.base-branch }}
          MERGE_SHA: ${{ needs.resolve-trigger.outputs.merge-sha }}
        run: |
          git fetch origin "$BASE_BRANCH"
          if ! git merge-base --is-ancestor "$MERGE_SHA" FETCH_HEAD; then
            echo "Release commit $MERGE_SHA is not on origin/$BASE_BRANCH" >&2
            exit 1
          fi
          git checkout -B "$BASE_BRANCH" "$MERGE_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/cli/global.json

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'src/tools/releaser/go.mod'
          cache-dependency-path: src/tools/releaser/go.sum

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ needs.resolve-trigger.outputs.base-branch }}
        run: go run . workflow --component studioctl --base-branch "$BASE_BRANCH"
        working-directory: src/tools/releaser

      - name: Summary
        if: always()
        env:
          BASE_BRANCH: ${{ needs.resolve-trigger.outputs.base-branch }}
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pull-request-number }}
          RELEASE_VERSION: ${{ needs.resolve-release-context.outputs.version }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            if [[ -n "${PR_NUMBER}" ]]; then
              echo "- **PR**: #${PR_NUMBER}"
            fi
            echo "- **Base branch**: ${BASE_BRANCH}"
            echo "- **Version**: ${RELEASE_VERSION}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -d "build/release" ]]; then
            {
              echo "### Assets"
              echo '```'
              ls -la build/release/ 2>/dev/null || echo "No assets found"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify-release-routed:
    name: Verify release is routed to a publisher
    if: >-
      always() &&
      needs.resolve-trigger.result == 'success' &&
      needs.resolve-release-context.result == 'success' &&
      needs.resolve-trigger.outputs.component != ''
    needs:
      - resolve-trigger
      - resolve-release-context
      - release-app
      - release-studioctl
    runs-on: ubuntu-latest
    steps:
      - name: Verify publisher selected
        env:
          APP_RESULT: ${{ needs.release-app.result }}
          COMPONENT: ${{ needs.resolve-trigger.outputs.component }}
          STUDIOCTL_RESULT: ${{ needs.release-studioctl.result }}
        run: |
          if [[ "$APP_RESULT" == "skipped" && "$STUDIOCTL_RESULT" == "skipped" ]]; then
            echo "No publisher job is configured for resolved component: $COMPONENT" >&2
            exit 1
          fi
