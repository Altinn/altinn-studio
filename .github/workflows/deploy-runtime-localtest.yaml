name: Runtime - deploy localtest

on:
  push:
    branches:
      - main
    paths:
      - src/Runtime/common/dotnet/**
      - src/Runtime/localtest/**
      - .github/workflows/deploy-runtime-localtest.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-localtest:
    name: Push localtest image to GHCR
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set vars
        id: vars
        run: |
          SHA="${GITHUB_SHA::10}"
          GHCR_BASE="ghcr.io/altinn/altinn-studio"
          echo "image=${GHCR_BASE}/runtime-localtest:${SHA}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=ghcr.io/altinn/altinn-studio/runtime-localtest:buildcache \
            --cache-to type=registry,ref=ghcr.io/altinn/altinn-studio/runtime-localtest:buildcache,mode=max \
            -t ${{ steps.vars.outputs.image }} -f Runtime/localtest/Dockerfile .

      - name: Push image
        run: docker push ${{ steps.vars.outputs.image }}
