name: Releaser - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - "src/tools/releaser/**"
      - ".github/workflows/releaser-build-test.yml"
      - "!**/AGENTS.md"
      - "!**/CLAUDE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/tools/releaser
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/tools/releaser

      - name: Build
        run: make build

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Lint
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Run e2e tests
        run: make test-e2e

      - name: Upload e2e test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: releaser-e2e-test-logs
          path: src/tools/releaser/test/e2e/_logs/
          if-no-files-found: ignore
