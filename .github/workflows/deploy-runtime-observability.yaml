name: Runtime - deploy observability

on:
  push:
    branches:
      - main
    paths:
      - infra/observability/base/**
      - infra/observability/runtime/**
      - infra/observability/dis-core/**
      - infra/observability/build.sh
      - .github/workflows/deploy-runtime-observability.yaml
  workflow_dispatch:
    inputs:
      environments:
        description: "Runtime environments to tag. Comma-separated (e.g. at_ring1,at_ring2), or empty for none."
        required: false
        default: "at_ring1"
      dis-core-environments:
        description: "DIS Core environments to tag (at22, at23, yt01, tt02, prod). Comma-separated, or empty for none."
        required: false
        default: "at22"

permissions:
  id-token: write
  contents: read

jobs:
  construct-rings-array:
    uses: ./.github/workflows/template-runtime-construct-environments.yaml
    with:
      inputs: ${{ toJSON(github.event.inputs) }}
      allow-empty: true

  construct-dis-core-environments:
    uses: ./.github/workflows/template-dis-construct-environments.yaml
    with:
      mode: dis-core
      inputs: ${{ toJSON(github.event.inputs) }}
      inputs-key: dis-core-environments
      allow-empty: true

  push-observability-artifact:
    name: Push observability as OCI artifact
    runs-on: ubuntu-latest
    environment: dev
    env:
      REGISTRY_NAME: altinncr
    outputs:
      config-repo: ${{ steps.vars.outputs.config-repo }}
    defaults:
      run:
        working-directory: infra/observability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set vars
        id: vars
        run: echo "config-repo=altinncr.azurecr.io/studio-apps/runtime-observability:${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_FC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FC }}

      - name: az acr login
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: build manifests
        run: ./build.sh runtime

      - name: push artifact
        run: |
          flux push artifact oci://${{ steps.vars.outputs.config-repo }} \
            --provider=azure \
            --reproducible \
            --path="./dist/runtime" \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)/$(git rev-parse HEAD)"

  tag-observability:
    name: Tag observability
    needs: [push-observability-artifact, construct-rings-array]
    if: ${{ fromJSON(needs.construct-rings-array.outputs.result)[0] != null }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.construct-rings-array.outputs.result) }}
    steps:
      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_FC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FC }}

      - name: az acr login
        run: az acr login --name altinncr

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: tag artifact
        run: |
          flux tag artifact oci://${{ needs.push-observability-artifact.outputs.config-repo }} \
            --tag ${{ matrix.ring }}

  # The collectors for Studio's services in DIS Core (infra/observability/dis-core), in the
  # namespace product-studio-obs. Its own job, outside a GitHub environment: the DIS publishing
  # identity trusts main and the dis_core_* environments only, and may only push under this
  # repository's products, here studio-obs/.
  push-dis-core-syncroot:
    name: Push DIS Core syncroot as OCI artifact
    needs: [construct-dis-core-environments]
    if: ${{ fromJSON(needs.construct-dis-core-environments.outputs.result)[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Require write permission to Fetch an OIDC token.
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}
    defaults:
      run:
        working-directory: infra/observability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set vars
        id: vars
        run: echo "short-sha=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - name: build manifests
        run: ./build.sh dis-core --validate

      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}

      - name: az acr login
        run: az acr login --name altinncr

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: push artifact
        run: |
          flux push artifact oci://altinncr.azurecr.io/studio-obs/syncroot:${{ steps.vars.outputs.short-sha }} \
            --provider=generic \
            --reproducible \
            --path="./dist/dis-core" \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)/$(git rev-parse HEAD)"

  # Each DIS Core cluster's Flux reads the tag named after its environment. The job name carries
  # the tag, which the deployer dashboard (src/tools/deployer) matches on.
  tag-dis-core-syncroot:
    name: Tag syncroot (${{ matrix.tag }})
    needs: [push-dis-core-syncroot, construct-dis-core-environments]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write # Require write permission to Fetch an OIDC token.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.construct-dis-core-environments.outputs.result) }}
    steps:
      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}

      - name: az acr login
        run: az acr login --name altinncr

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: tag artifact
        run: |
          flux tag artifact oci://altinncr.azurecr.io/studio-obs/syncroot:${{ needs.push-dis-core-syncroot.outputs.short-sha }} \
            --tag ${{ matrix.tag }}
