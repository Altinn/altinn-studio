name: Close Apps Storybook preview

# A preview may exist even when the PR's remaining changes are documentation only.
on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  # Cancel preview builds before deleting the environment they would deploy to.
  group: apps-storybook-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close-preview:
    # Fork PRs cannot upload previews using the repository's deployment secret.
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Close preview
    steps:
      - name: Close preview environment in Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 #v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.APPS_DEV_STORYBOOK }}
          action: "close"
