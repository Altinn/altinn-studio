name: App Frontend - Unit tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/App/frontend/src/**'
      - 'src/App/frontend/package.json'
      - 'src/common/ts/layout-contract/**'
      - 'src/common/ts/form-component/src/**'
      - 'src/common/ts/form-component/package.json'
      - 'src/common/ts/form-engine/src/**'
      - 'src/common/ts/form-engine/package.json'
      - 'src/common/ts/language/src/**'
      - 'src/common/ts/language/package.json'
      - '.github/workflows/app-frontend-unit-tests.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    runs-on: self-hosted-ubuntu
    timeout-minutes: 30
    name: Type-checks, eslint and unit tests
    defaults:
      run:
        working-directory: src/App/frontend/
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: install dependencies
        run: yarn --immutable

      - name: verify generated contract
        run: yarn gen:check

      - name: type-check
        run: yarn tsc

      - name: type-check-strict
        run: |
          strict_error_count="$(yarn tsc-strict:error-count)"
          echo "Strict TypeScript error count: ${strict_error_count}"

          if (( strict_error_count >= 301 )); then
            echo "Strict TypeScript error count is ${strict_error_count}, expected less than 301."
            exit 1
          fi

      - name: run eslint
        run: yarn lint

      - name: run tests
        run: yarn test --coverage --maxWorkers=4
        env:
          NODE_OPTIONS: --max-old-space-size=4096
