name: Assistant-prompts

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/AI/assistant/agents/prompts/**'
      - 'src/AI/assistant/scripts/sync_prompts.py'
      - '.github/workflows/assistant-prompts.yaml'
      - '!**/AGENTS.md'
      - '!**/README.md'
      - '!**/readme.md'
      - '!**/_readme.md' # C# layout model documentation in Altinn.App.Core.
      - '!**/CONTRIBUTING.md'
      - '!**/CHANGELOG.md'
      - '!**/docs/**'
  push:
    branches: [main]
    paths:
      - 'src/AI/assistant/agents/prompts/**'
      - 'src/AI/assistant/scripts/sync_prompts.py'
      - '.github/workflows/assistant-prompts.yaml'
      - '!**/AGENTS.md'
      - '!**/README.md'
      - '!**/readme.md'
      - '!**/_readme.md' # C# layout model documentation in Altinn.App.Core.
      - '!**/CONTRIBUTING.md'
      - '!**/CHANGELOG.md'
      - '!**/docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    name: Prompt drift
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
    runs-on: self-hosted-ubuntu
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs the Python version in .python-version and puts the venv on PATH.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          working-directory: src/AI/assistant
          activate-environment: true

      - name: Install dependencies
        working-directory: src/AI/assistant
        run: uv sync --locked --no-dev

      - name: What this change means for the served prompts
        working-directory: src/AI/assistant
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LANGFUSE_HOST:-}" ] || [ -z "${LANGFUSE_SECRET_KEY:-}" ]; then
            echo "::notice::Langfuse is not configured for this repository, so prompt"\
                 "drift was not checked. Set LANGFUSE_HOST, LANGFUSE_PUBLIC_KEY and"\
                 "LANGFUSE_SECRET_KEY to turn this on."
            exit 0
          fi
          python -m scripts.sync_prompts --diff

  publish:
    name: Publish prompts
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    runs-on: self-hosted-ubuntu
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs the Python version in .python-version and puts the venv on PATH.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          working-directory: src/AI/assistant
          activate-environment: true

      - name: Install dependencies
        working-directory: src/AI/assistant
        run: uv sync --locked --no-dev

      - name: Publish drifted prompts as production
        working-directory: src/AI/assistant
        env:
          ALLOW_PROMPT_PUSH: '1'
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LANGFUSE_HOST:-}" ] || [ -z "${LANGFUSE_SECRET_KEY:-}" ]; then
            echo "::error::Langfuse is not configured, so the prompts on main were not"\
                 "published. Set LANGFUSE_HOST, LANGFUSE_PUBLIC_KEY and"\
                 "LANGFUSE_SECRET_KEY, then re-run this job."
            exit 1
          fi
          python -m scripts.sync_prompts --push -m "$COMMIT_URL"
