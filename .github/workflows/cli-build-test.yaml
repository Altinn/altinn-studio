name: CLI - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - "src/cli/**"
      - "src/Runtime/common/dotnet/**"
      - "src/libs/dotnet/**"
      - "src/tools/releaser/**"
      - .github/workflows/cli-build-test.yaml
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-release-artifacts:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Verify studioctl release artifacts
    runs-on: self-hosted-ubuntu
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/cli/global.json

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/tools/releaser

      - name: Build release artifacts via releaser dry-run
        working-directory: src/tools/releaser
        run: |
          go run . workflow --component studioctl --base-branch main --dry-run --skip-branch-check

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: studioctl-release-artifacts
          path: build/release/
          if-no-files-found: ignore
          retention-days: 1

  analyze:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest
          - os: ubuntu-latest
            runner: self-hosted-ubuntu
    name: Build and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: false
    steps:
      - name: Enable long paths for git on Windows
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/cli/global.json

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/cli

      - name: Build
        working-directory: src/cli
        run: |
          make build

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: src/cli
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Lint
        working-directory: src/cli
        run: |
          make lint

      - name: Test
        working-directory: src/cli
        run: |
          make test

      - name: Run e2e tests
        working-directory: src/cli
        run: |
          make test-e2e
