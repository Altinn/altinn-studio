name: Designer Backend - Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/common/dotnet/**'
      - 'src/Designer/backend/**'
      - 'src/Designer/testdata/**'
      - 'src/App/template/**'
      - '.github/workflows/designer-backend-dotnet-test.yaml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    strategy:
      matrix:
        os: [ubuntu-latest,windows-latest,macos-latest]
    name: Run dotnet build and test
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'self-hosted-single' || matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: false
    steps:
      - name: Enable long paths for git on Windows
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/Designer/backend/global.json
      - name: Build
        run: |
          dotnet build Designer.sln -v m
        working-directory: src/Designer/backend
      - name: Test
        run: |
          dotnet test Designer.sln --filter FullyQualifiedName~AppDevelopmentController --no-build || exit 1;
          dotnet test Designer.sln --filter FullyQualifiedName~PolicyControllerTests --no-build || exit 1;
          dotnet test Designer.sln --filter FullyQualifiedName~PreviewController --no-build || exit 1;
          dotnet test Designer.sln --filter FullyQualifiedName~DataModelsController --no-build || exit 1;
          dotnet test Designer.sln --filter FullyQualifiedName~ResourceAdminController --no-build || exit 1;
          dotnet test Designer.sln --filter FullyQualifiedName~TextController --no-build || exit 1;
          dotnet test Designer.sln --filter "(Category!=StudioOidcGiteaIntegrationTest)&(FullyQualifiedName~RepositoryController)" --no-build || exit 1;
          dotnet test Designer.sln --filter "(Category!=StudioOidcGiteaIntegrationTest)&(Category!=DbIntegrationTest)&(FullyQualifiedName!~AppDevelopmentController)&(FullyQualifiedName!~PreviewController)&(FullyQualifiedName!~PolicyControllerTests)&(FullyQualifiedName!~DataModelsController)&(FullyQualifiedName!~ResourceAdminController)&(FullyQualifiedName!~TextController)&(FullyQualifiedName!~RepositoryController)" -v m --no-build
        working-directory: src/Designer/backend
