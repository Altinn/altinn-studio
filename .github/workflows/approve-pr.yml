name: Approve PR

# Adding the 'approve' label to a pull request makes github-actions approve it, so a single
# developer can merge. Only users with write access or higher can trigger the approval.
# This workflow runs with a write token (pull_request_target), so it must never check out or run PR code.

on:
  pull_request_target:
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: github.event.action == 'opened' || github.event.label.name == 'approve'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    steps:
      - name: Check if auto-approval is needed
        id: check-labels
        env:
          ACTOR: ${{ github.event.sender.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          has_approve_label=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq 'any(.labels[]?; .name == "approve")')

          if [[ "$has_approve_label" != "true" ]]; then
            echo "should_approve=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! permission=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null); then
            echo "should_approve=false" >> "$GITHUB_OUTPUT"
            echo "Could not determine permission for $ACTOR"
            exit 0
          fi

          case "$permission" in
            admin|maintain|write)
              ;;
            *)
              echo "should_approve=false" >> "$GITHUB_OUTPUT"
              echo "User $ACTOR cannot use the approve label: $permission"
              exit 0
              ;;
          esac

          # Check if already approved by github-actions bot
          reviews=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json reviews --jq '.reviews[] | select((.author.login == "github-actions" or .author.login == "github-actions[bot]") and .state == "APPROVED")')

          if [ -n "$reviews" ]; then
            echo "should_approve=false" >> "$GITHUB_OUTPUT"
            echo "PR already approved by github-actions bot"
          else
            echo "should_approve=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto approve PR
        if: steps.check-labels.outputs.should_approve == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "$PR_NUMBER" --repo "$REPO" --approve
