name: Runtime - deploy platform proxy

on:
  push:
    branches:
      - main
    paths:
      - src/common/go/**
      - src/Runtime/platform-proxy/**
      - infra/runtime/syncroot/base/platform-proxy.yaml
      - .github/workflows/deploy-runtime-platform-proxy.yaml
      - "!**/AGENTS.md"
      - "!**/README.md"
  workflow_dispatch:
    inputs:
      environments:
        description: "Runtime environments to tag. Comma-separated (e.g. at_ring1,at_ring2)."
        required: false
        default: "at_ring1"

permissions:
  id-token: write
  contents: read

jobs:
  construct-rings-array:
    uses: ./.github/workflows/template-runtime-construct-environments.yaml
    with:
      inputs: ${{ toJSON(github.event.inputs) }}

  push-platform-proxy-artifact:
    name: Push platform proxy as OCI artifact
    runs-on: ubuntu-latest
    environment: dev
    env:
      REGISTRY_NAME: altinncr
    outputs:
      config-repo: ${{ steps.vars.outputs.config-repo }}
    defaults:
      run:
        working-directory: src/Runtime/platform-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set vars
        id: vars
        run: |
          SHA="${GITHUB_SHA::10}"
          echo "short-sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image-repo=altinncr.azurecr.io/studio-apps/runtime-platform-proxy:${SHA}" >> "$GITHUB_OUTPUT"
          echo "config-repo=altinncr.azurecr.io/studio-apps/runtime-platform-proxy-repo:${SHA}" >> "$GITHUB_OUTPUT"

      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_FC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FC }}

      - name: az acr login
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: docker build
        # src/ is the build context, for the shared Go module in src/common/go.
        working-directory: src
        run: |
          docker build \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --build-arg SERVICE_VERSION=${{ steps.vars.outputs.short-sha }} \
            -t ${{ steps.vars.outputs.image-repo }} -f Runtime/platform-proxy/Dockerfile .

      - name: push image
        run: docker push ${{ steps.vars.outputs.image-repo }}

      - name: patch base with image tag
        working-directory: src/Runtime/platform-proxy/infra/kustomize/base
        run: |
          export IMAGE="${{ steps.vars.outputs.image-repo }}"
          export IMAGE_TAG="${{ steps.vars.outputs.short-sha }}"
          yq -i '.metadata.annotations["altinn.studio/image"] = env(IMAGE)' deployment.yaml
          yq -i '.metadata.annotations["altinn.studio/image-tag"] = env(IMAGE_TAG)' deployment.yaml

      - name: push artifact
        working-directory: src/Runtime/platform-proxy/infra/kustomize
        run: |
          flux push artifact oci://${{ steps.vars.outputs.config-repo }} \
            --provider=azure \
            --reproducible \
            --path="." \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)/$(git rev-parse HEAD)"

  tag-platform-proxy:
    name: Tag platform proxy
    needs: [push-platform-proxy-artifact, construct-rings-array]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.construct-rings-array.outputs.result) }}
    steps:
      - name: az login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_FC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FC }}

      - name: az acr login
        run: az acr login --name altinncr

      - name: flux install
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: tag artifact
        run: |
          flux tag artifact oci://${{ needs.push-platform-proxy-artifact.outputs.config-repo }} \
            --tag ${{ matrix.ring }}
