name: Assistant-evals

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/AI/assistant/**'
      - 'agents/_skills/**'
      - '.github/workflows/assistant-evals.yaml'
      - '!**/AGENTS.md'
      - '!**/README.md'
      - '!**/readme.md'
      - '!**/_readme.md' # C# layout model documentation in Altinn.App.Core.
      - '!**/CONTRIBUTING.md'
      - '!**/CHANGELOG.md'
      - '!**/docs/**'
      # Workbench usage guide; eval behavior is defined in code and datasets.
      - '!src/AI/assistant/benchmarks/EVALS.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  impact:
    name: Baseline impact
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: self-hosted-ubuntu
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The impact is a diff against the base ref.
          fetch-depth: 0
          persist-credentials: false

      # uv installs the Python version in .python-version and puts the venv on PATH.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          working-directory: src/AI/assistant
          activate-environment: true

      # The actor_prompt and tools digests import the agent code.
      # If a digest fails, the gate fails. It does not pass.
      - name: Install dependencies
        working-directory: src/AI/assistant
        run: uv sync --locked --no-dev

      - name: What this change means for the baseline
        working-directory: src/AI/assistant
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_REF"...HEAD | tee /tmp/changed.txt
          python -m benchmarks.impact --strict --against "$BASE_REF" < /tmp/changed.txt
