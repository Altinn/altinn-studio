name: Designer Frontend - Markdown formatting

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/Designer/frontend/**/*.md'
      - 'src/Designer/frontend/.prettierignore'
      - 'src/Designer/frontend/package.json'
      - 'prettier.config.js'
      - '.editorconfig'
      - '.github/workflows/designer-frontend-docs-format.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Check Markdown formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check Markdown formatting
        working-directory: src/Designer/frontend
        run: |
          prettier_version=$(node --print "require('./package.json').devDependencies.prettier")
          npm exec --yes --package="prettier@${prettier_version}" -- prettier '**/*.md' --check
