name: sandbox-node - Build

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/ci/sandbox-node/**'
      - '.github/workflows/deploy-sandbox-node.yaml'
      - '.github/workflows/sandbox-node-build.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/ci/sandbox-node

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/ci/sandbox-node

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code -- .

      - name: Run static analysis
        run: make lint

      - name: Run tests
        run: make test

      - name: Build binary
        run: make build

      - name: Build container
        run: docker build --file Dockerfile .

      - name: Build storage-init container
        run: docker build --file Dockerfile.init .
