name: Designer Frontend - Unit tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/Designer/frontend/**'
      - 'src/Designer/frontend/testing/cypress/**'
      - '!src/Designer/frontend/stats/**'
      - 'src/Designer/testdata/**'
      - '.github/workflows/designer-frontend-unit-tests.yml'
      - 'package.json'
      - 'yarn.lock'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CYPRESS_INSTALL_BINARY: 0

jobs:
  typecheck:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: 'Typechecking and linting'
    runs-on: self-hosted-ubuntu
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 'Checking Out Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Installing Dependencies'
        uses: ./.github/actions/yarn-install

      - name: 'Doing the typecheck'
        run: |
          cd src/Designer/frontend
          yarn typecheck

      - name: 'Strict null checks'
        run: |
          cd src/Designer/frontend
          yarn strict-null-checks

      - name: 'Running Eslint'
        run: yarn lint --cache

      - name: 'Checking code style'
        run: yarn run codestyle:check

  test:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: 'Testing'
    runs-on: self-hosted-ubuntu
    timeout-minutes: 45
    steps:
      - name: 'Checking Out Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Installing Dependencies'
        uses: ./.github/actions/yarn-install

      - name: 'Running Unit Tests'
        run:  |
          cd src/Designer/frontend
          yarn test:ci

      - name: 'Upload coverage reports to Codecov'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: src/Designer/frontend/coverage
          fail_ci_if_error: true
