name: Libraries .NET - Build and test

on:
  push:
    branches:
      - main
    paths:
      - 'src/libs/dotnet/**'
      - '.github/workflows/libs-dotnet-tests.yaml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/libs/dotnet/**'
      - '.github/workflows/libs-dotnet-tests.yaml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI: 'true'
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: src/libs/dotnet
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          global-json-file: src/libs/dotnet/global.json

      - name: Restore
        run: dotnet restore libs.slnx

      - name: Build
        run: dotnet build libs.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test libs.slnx --configuration Release --no-restore --no-build
