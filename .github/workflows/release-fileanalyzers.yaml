name: Release - fileanalyzers

# Releases the latest version in the fileanalyzers changelog when it has no GitHub release yet, which is when a release
# pull request from the releaser's `prepare` command has merged.
#
# Runs on push rather than on the merged pull request, because nuget.org's trusted publishing requires the
# `libraries` environment, which only accepts branches, and GitHub checks environment branch rules for pull
# request events against refs/pull/<n>/merge.

on:
  push:
    branches:
      - main
      - 'release/fileanalyzers/v*'
    paths:
      - 'src/App/fileanalyzers/CHANGELOG.md'
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time per branch, so that a later push sees the draft release that an earlier run created,
# rather than releasing the same version again from a newer commit. Branches release different versions, so
# they don't wait for each other, and a waiting run on one is never replaced by a push to another.
concurrency:
  group: release-fileanalyzers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    # workflow_dispatch can also run on a tag
    if: github.ref_type == 'branch'
    permissions:
      # Draft releases are only visible with write access
      contents: write
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      version: ${{ steps.resolve.outputs.package-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release
        id: resolve
        uses: ./.github/actions/resolve-library-release
        with:
          component: fileanalyzers

  release:
    name: Build, release and publish
    runs-on: ubuntu-latest
    needs: resolve-release-context
    permissions:
      contents: write
      id-token: write
    if: needs.resolve-release-context.outputs.release == 'true'
    environment: libraries

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout base branch
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          if [[ "${BASE_BRANCH}" != "main" && ! "${BASE_BRANCH}" =~ ^release/fileanalyzers/v[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base branch: ${BASE_BRANCH}"
            exit 1
          fi

          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "$MERGE_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/App/fileanalyzers/global.json

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/tools/releaser

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          go run . workflow --component fileanalyzers --base-branch "$BASE_BRANCH"
        working-directory: src/tools/releaser

      - name: Pack package
        env:
          RELEASE_VERSION: ${{ needs.resolve-release-context.outputs.version }}
        run: |
          # Matched explicitly rather than with a sed substitution: a sed that does not match
          # passes the version through unchanged, which produced an invalid AssemblyVersion
          # instead of failing.
          if [[ ! "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "RELEASE_VERSION is not major.minor.patch[-prerelease]: $RELEASE_VERSION" >&2
            exit 1
          fi

          assembly_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
          informational_version="$RELEASE_VERSION+$(git rev-parse --short=12 HEAD)"

          # -p:UseAppLibsFromSource=false swaps the Altinn.App.Core ProjectReference for the
          # pinned package, so the release compiles against exactly what the nuspec will declare.
          # See src/App/AppCoreDependency.props.
          dotnet pack solutions/Src.slnx \
            -c Release \
            --output "${GITHUB_WORKSPACE}/build/release" \
            -p:UseAppLibsFromSource=false \
            "-p:ReleasePackageVersion=${RELEASE_VERSION}" \
            "-p:ReleaseAssemblyVersion=${assembly_version}" \
            "-p:ReleaseInformationalVersion=${informational_version}"
        working-directory: src/App/fileanalyzers

      # The pack step above builds against the pinned Altinn.App.Core package, so the version the
      # nuspec declares is the version the shipped assembly was compiled against. Assert exactly
      # that. Merely rejecting a `.dev.N` version is not enough: `ReleasePackageVersion` is a global
      # property, so a pack that forgot `-p:UseAppLibsFromSource=false` re-versions the referenced
      # Core project too and emits *this component's* release version for Altinn.App.Core — a
      # published version, and silently the wrong one.
      - name: Verify packed dependencies
        id: verify
        run: |
          pinned_version="$(grep -oE '<PackageVersion Include="Altinn\.App\.Core" Version="[^"]*"' \
            src/App/fileanalyzers/Directory.Packages.props | sed -E 's/.*Version="([^"]*)"/\1/')"

          if [[ -z "$pinned_version" ]]; then
            echo "::error::src/App/fileanalyzers/Directory.Packages.props does not pin Altinn.App.Core"
            exit 1
          fi

          echo "Altinn.App.Core is pinned to $pinned_version"

          shopt -s nullglob
          packages=(build/release/*.nupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No NuGet packages found in build/release" >&2
            exit 1
          fi

          failed=0
          app_core_version=""
          for package in "${packages[@]}"; do
            nuspec="$(unzip -p "$package" '*.nuspec')"

            if ! grep -q 'id="Altinn.App.Core"' <<<"$nuspec"; then
              echo "::error::$package does not declare a dependency on Altinn.App.Core"
              failed=1
              continue
            fi

            app_core_version="$(grep -oE 'id="Altinn\.App\.Core" version="[^"]*"' <<<"$nuspec" \
              | head -1 | sed -E 's/.*version="([^"]*)"/\1/')"
            echo "$package depends on Altinn.App.Core $app_core_version"

            if [[ "$app_core_version" != "$pinned_version" ]]; then
              echo "::error::$package depends on Altinn.App.Core $app_core_version, not the pinned $pinned_version"
              failed=1
            fi
          done

          echo "app-core-version=$app_core_version" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(build/release/*.nupkg build/release/*.snupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No NuGet packages found in build/release" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- **Base branch**: ${BASE_BRANCH}"
            echo "- **Version**: ${RELEASE_VERSION}"
            echo "- **Depends on Altinn.App.Core**: ${APP_CORE_VERSION:-unresolved}"
            echo "- **Version source**: latest released section in src/App/fileanalyzers/CHANGELOG.md"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -d "build/release" ]]; then
            {
              echo "### NuGet packages"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ls -la build/release/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No packages found" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.resolve-release-context.outputs.version }}
          APP_CORE_VERSION: ${{ steps.verify.outputs.app-core-version }}
