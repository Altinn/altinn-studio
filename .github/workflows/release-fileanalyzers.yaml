name: Release - fileanalyzers

# Automatically triggers release when a fileanalyzers changelog promotion PR is merged.
# PRs must have the 'release/fileanalyzers' label.

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - 'release/fileanalyzers/v*'
    paths:
      - 'src/App/fileanalyzers/CHANGELOG.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resolve-release-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    # Automatically release same-repo release PRs. Fork PRs can be retried manually
    # from their merged base branch because their pull_request token cannot publish releases.
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_type == 'branch'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'release/fileanalyzers')
      )
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/tools/releaser

      - name: Resolve environment
        id: context
        env:
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
        run: |
          version="$(go run . resolve-version --component fileanalyzers --base-branch "$BASE_BRANCH")"

          # resolve-version prints the tag-style version (v9.0.0-preview.1). Everything downstream
          # feeds MSBuild, which rejects the prefix, so normalize it here at the single source.
          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Resolved version is not major.minor.patch[-prerelease]: $version" >&2
            exit 1
          fi

          environment="prod"
          if [[ "$version" == *"-preview."* ]]; then
            environment="dev"
          elif [[ "$version" == *"-rc."* ]]; then
            environment="staging"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
        working-directory: src/tools/releaser

  release:
    name: Build, release and publish
    runs-on: ubuntu-latest
    needs: resolve-release-context
    permissions:
      contents: write
      id-token: write
    environment: ${{ needs.resolve-release-context.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Checkout base branch
        env:
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          MERGE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          if [[ "${BASE_BRANCH}" != "main" && ! "${BASE_BRANCH}" =~ ^release/fileanalyzers/v[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base branch: ${BASE_BRANCH}"
            exit 1
          fi

          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "$MERGE_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: src/App/fileanalyzers/global.json

      - name: Setup Go
        uses: ./.github/actions/setup-go-cached
        with:
          module: src/tools/releaser

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
        run: |
          go run . workflow --component fileanalyzers --base-branch "$BASE_BRANCH"
        working-directory: src/tools/releaser

      - name: Pack package
        env:
          RELEASE_VERSION: ${{ needs.resolve-release-context.outputs.version }}
        run: |
          # Matched explicitly rather than with a sed substitution: a sed that does not match
          # passes the version through unchanged, which produced an invalid AssemblyVersion
          # instead of failing.
          if [[ ! "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "RELEASE_VERSION is not major.minor.patch[-prerelease]: $RELEASE_VERSION" >&2
            exit 1
          fi

          assembly_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
          informational_version="$RELEASE_VERSION+$(git rev-parse --short=12 HEAD)"

          dotnet pack solutions/Src.slnx \
            -c Release \
            --output "${GITHUB_WORKSPACE}/build/release" \
            "-p:ReleasePackageVersion=${RELEASE_VERSION}" \
            "-p:ReleaseAssemblyVersion=${assembly_version}" \
            "-p:ReleaseInformationalVersion=${informational_version}"
        working-directory: src/App/fileanalyzers

      # The Altinn.App.Core dependency version comes from Directory.Packages.props. Guard against
      # it going missing, and against a source-derived `.dev.N` version — which is what a
      # ProjectReference to the app backend would produce, and was never published to NuGet.
      - name: Verify packed dependencies
        id: verify
        run: |
          shopt -s nullglob
          packages=(build/release/*.nupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No NuGet packages found in build/release" >&2
            exit 1
          fi

          failed=0
          app_core_version=""
          for package in "${packages[@]}"; do
            nuspec="$(unzip -p "$package" '*.nuspec')"

            if ! grep -q 'id="Altinn.App.Core"' <<<"$nuspec"; then
              echo "::error::$package does not declare a dependency on Altinn.App.Core"
              failed=1
              continue
            fi

            app_core_version="$(grep -oE 'id="Altinn\.App\.Core" version="[^"]*"' <<<"$nuspec" \
              | head -1 | sed -E 's/.*version="([^"]*)"/\1/')"
            echo "$package depends on Altinn.App.Core $app_core_version"

            if [[ "$app_core_version" == *".dev."* ]]; then
              echo "::error::$package depends on an unpublished Altinn.App.Core version"
              failed=1
            fi
          done

          echo "app-core-version=$app_core_version" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(build/release/*.nupkg build/release/*.snupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No NuGet packages found in build/release" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo ""
            if [[ -n "${PR_NUMBER}" ]]; then
              echo "- **PR**: #${PR_NUMBER}"
            fi
            echo "- **Base branch**: ${BASE_BRANCH}"
            echo "- **Version**: ${RELEASE_VERSION}"
            echo "- **Environment**: ${{ needs.resolve-release-context.outputs.environment }}"
            echo "- **Depends on Altinn.App.Core**: ${APP_CORE_VERSION:-unresolved}"
            echo "- **Version source**: latest released section in src/App/fileanalyzers/CHANGELOG.md"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -d "build/release" ]]; then
            {
              echo "### NuGet packages"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ls -la build/release/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No packages found" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          RELEASE_VERSION: ${{ needs.resolve-release-context.outputs.version }}
          APP_CORE_VERSION: ${{ steps.verify.outputs.app-core-version }}
