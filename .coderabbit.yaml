language: "en-GB"
reviews:
  pre_merge_checks:
    docstrings:
      mode: off
  # Keep generated artefacts out of review. These are regenerated by the tooling that owns them, so
  # a line-by-line opinion on them is noise — and a PR that legitimately rewrites a batch of
  # snapshots can otherwise push the whole review past CodeRabbit's file limit.
  #
  # Two generated files are deliberately NOT excluded, because they exist to be read by a reviewer:
  #   - wire-contract.verified.json           the app⇄engine HTTP contract
  #   - PublicApiTests.*.verified.txt         the Altinn.App.Core public-API/breaking-change ledger
  path_filters:
    # Verify/approval snapshots.
    - "!**/.snapshots/**"
    - "!**/*.received.*"
    # EF Core scaffolding. The migration's own Up/Down stays in scope; these two carry no decisions.
    - "!**/Migrations/*.Designer.cs"
    - "!**/Migrations/*ModelSnapshot.cs"
    # Query-plan baselines (raw EXPLAIN output).
    - "!**/QueryPlanTests.*.verified.txt"
    # Lockfiles.
    - "!**/yarn.lock"
