[package]
name = "github-runner-coordinator"
description = "Runs one ephemeral GitHub Actions runner inside a Sandbox"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.4", features = ["json"] }
sandbox = { path = "../../experimental/sandbox" }
sandbox-microsandbox = { path = "../../experimental/sandbox-microsandbox" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "signal", "time"] }

[lints.rust]
unsafe_code = "deny"
warnings = "deny"
unreachable_pub = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"
expect_used = "deny"
future_not_send = "allow"
iter_with_drain = "allow"
multiple_crate_versions = "allow"
panic = "deny"
redundant_pub_crate = "allow"
unwrap_used = "deny"
