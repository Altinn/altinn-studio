apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - scaledjob.yaml
  - scaledjob-single.yaml
  - scaledjob-sandbox.yaml
  - triggerauthentication.yaml
replacements:
  - source:
      kind: ScaledJob
      name: github-runners
      fieldPath: metadata.annotations.[altinn.studio/image]
    targets:
      - select:
          kind: ScaledJob
          name: github-runners
        fieldPaths:
          - spec.jobTargetRef.template.spec.containers.[name=github-runner].image
      - select:
          kind: ScaledJob
          name: github-runners-single
        fieldPaths:
          - spec.jobTargetRef.template.spec.containers.[name=github-runner].image
  - source:
      kind: ScaledJob
      name: github-runners-sandbox
      fieldPath: metadata.annotations.[altinn.studio/image]
    targets:
      - select:
          kind: ScaledJob
          name: github-runners-sandbox
        fieldPaths:
          - spec.jobTargetRef.template.spec.containers.[name=coordinator].image
  - source:
      kind: ScaledJob
      name: github-runners-sandbox
      fieldPath: metadata.annotations.[altinn.studio/guest-image]
    targets:
      - select:
          kind: ScaledJob
          name: github-runners-sandbox
        fieldPaths:
          - spec.jobTargetRef.template.spec.containers.[name=coordinator].env.[name=SANDBOX_IMAGE].value
          - spec.jobTargetRef.template.spec.initContainers.[name=prepare-image].env.[name=SANDBOX_IMAGE].value
  - source:
      kind: ScaledJob
      name: github-runners-sandbox
      fieldPath: metadata.annotations.[altinn.studio/prepared-image]
    targets:
      - select:
          kind: ScaledJob
          name: github-runners-sandbox
        fieldPaths:
          - spec.jobTargetRef.template.spec.initContainers.[name=prepare-image].image
