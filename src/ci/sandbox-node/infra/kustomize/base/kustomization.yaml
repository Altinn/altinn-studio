apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - daemonset.yaml
replacements:
  - source:
      kind: DaemonSet
      name: sandbox-node
      fieldPath: metadata.annotations.[altinn.studio/init-image]
    targets:
      - select:
          kind: DaemonSet
          name: sandbox-node
        fieldPaths:
          - spec.template.spec.initContainers.[name=prepare-storage].image
  - source:
      kind: DaemonSet
      name: sandbox-node
      fieldPath: metadata.annotations.[altinn.studio/image]
    targets:
      - select:
          kind: DaemonSet
          name: sandbox-node
        fieldPaths:
          - spec.template.spec.containers.[name=plugin].image
