apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: agent-dev-nested
spec:
  sandbox:
    image:
      type: build
      context: ..
      dockerfile: Dockerfile
    platform:
      os: linux
    resources:
      cpu: "2"
      memory: "3Gi"
      rootFilesystem:
        capacity: "16Gi"
        mode: direct
    initSystem: image
  home:
    source: home
  instructions:
    source: ../instructions.md
  skills:
    - source: ../../../../../../agents/skills/pr-evidence
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
    - type: codex
      auth: mediated
  secrets:
    - environment: GITHUB_TOKEN
      # gh only attaches files with a token it classifies by prefix; the inert placeholder
      # therefore carries the fine-grained PAT prefix and is far shorter than a real token.
      placeholder: github_pat_AGENT_MEDIATED_GITHUB_TOKEN
      allowedHosts:
        - github.com
        - api.github.com
        - uploads.github.com
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
