apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: agent-dev-nested
spec:
  sandbox:
    image:
      type: build
      context: ..
      dockerfile: Dockerfile
    platform:
      os: linux
    resources:
      cpu: "2"
      memory: "3Gi"
      rootFilesystem:
        capacity: "16Gi"
        mode: direct
    initSystem: image
  home:
    source: home
  instructions:
    source: ../instructions.md
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
    - type: codex
      auth: mediated
  secrets:
    - environment: GITHUB_TOKEN
      allowedHosts:
        - github.com
        - api.github.com
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
