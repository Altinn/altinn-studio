apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

metadata:
  name: agent-dev-worktree

spec:
  sandbox:
    mounts:
      - type: bind
        source: ../../../../..
        target: /home/agent/code/altinn-studio
        readOnly: false
      - type: tmpfs
        target: /tmp
        capacity: "2Gi"
