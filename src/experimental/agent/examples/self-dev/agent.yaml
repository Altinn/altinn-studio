apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: agent-dev
spec:
  sandbox:
    image:
      type: build
      context: .
      dockerfile: Dockerfile
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: direct
    initSystem: image
    mounts:
      - type: tmpfs
        target: /tmp
        capacity: "2Gi"
  home:
    source: home
  instructions:
    - source: instructions.md
  skills:
    - source: skills/pr-evidence
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
      # The mediated token cannot list Fable in the /model picker, so new Sessions select it at launch.
      defaults:
        model: fable
    - type: codex
      auth: mediated
  environment:
    - name: GIT_USER_NAME
    - name: GIT_USER_EMAIL
  secrets:
    - environment: GITHUB_TOKEN
      # gh only attaches files with a token it classifies by prefix; the inert placeholder
      # therefore carries the fine-grained PAT prefix and is far shorter than a real token.
      placeholder: github_pat_AGENT_MEDIATED_GITHUB_TOKEN
      allowedHosts:
        - github.com
        - api.github.com
        - uploads.github.com
  access:
    - type: ssh
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
