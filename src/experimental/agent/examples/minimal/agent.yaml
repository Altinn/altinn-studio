apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: altinn-studio
spec:
  sandbox:
    image:
      type: build
      context: .
      dockerfile: Dockerfile
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: layered
  home:
    source: home
  instructions:
    source: instructions.md
  harnesses:
    - type: claudeCode
      version: "2.1.239"
      auth: mediated
  secrets: []
  network:
    mode: mediated
    allow: all
