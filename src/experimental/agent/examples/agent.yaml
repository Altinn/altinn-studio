apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: altinn-studio
spec:
  sandbox:
    image:
      type: build
      context: .
      dockerfile: Dockerfile
    platform:
      os: linux
      architecture: amd64
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: layered
