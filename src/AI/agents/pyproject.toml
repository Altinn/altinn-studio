[project]
name = "altinity-agents"
version = "0.1.0"
description = "Agent service that enables users to develop Altinn apps with natural language"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "websockets>=16.0",
    "pydantic>=2.12.5",

    # HTTP client
    "httpx>=0.28.1",

    # Configuration
    "python-dotenv>=1.2.2",

    # LLM & Agent framework
    "langgraph>=1.1.3",
    "langchain-core>=1.2.23",
    "langchain-openai>=1.1.12",
    "openai>=2.30.0",
    "anthropic>=0.86.0",

    # Observability
    "langfuse>=3.0.0",

    # JSON repair for malformed LLM outputs
    "json-repair>=0.58.7",

    # YAML parsing for prompt frontmatter
    "PyYAML>=6.0",

    # Altinn domain library (agents/altinn)
    "jsonschema>=4.18",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.8",
]
preview = [
    "playwright>=1.49.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "benchmarks*", "services*", "shared*"]

[tool.setuptools.package-data]
agents = ["prompts/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors: whitespace, comparisons to None, bare except, ambiguous names
    "W",     # pycodestyle warnings: trailing whitespace and invalid escape sequences
    "F",     # Pyflakes: unused imports and variables, undefined names
    "I",     # isort: import order and import groups
    "B",     # flake8-bugbear: likely bugs, for example mutable default arguments
    "UP",    # pyupgrade: old syntax that Python 3.12 can replace
    "SIM",   # flake8-simplify: code that you can make simpler
    "C4",    # flake8-comprehensions: unnecessary calls and comprehensions
    "PIE",   # flake8-pie: unnecessary statements and duplicate class fields
    "RUF",   # Ruff-specific: mutable class defaults, ambiguous Unicode, lost asyncio tasks
    "ASYNC", # flake8-async: blocking calls in async functions
]
ignore = [
    "E501",     # Line too long: the formatter controls line length
    "W191",     # Tab indentation: the formatter controls indentation
    "ASYNC240", # Blocking pathlib calls in async code: short checks do not block the event loop in a meaningful way
    "ASYNC109", # Async function with a timeout parameter: existing async APIs take a timeout argument on purpose
    "UP042",    # Use StrEnum: StrEnum changes str() and format() output of existing enums
]

# Norwegian text and prompts use these characters on purpose
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",   # assert False: tests use `assert False` on purpose
    "RUF012", # Mutable class attribute without ClassVar: test fakes use plain class attributes
]
