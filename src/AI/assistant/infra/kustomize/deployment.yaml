apiVersion: apps/v1
kind: Deployment
metadata:
  name: altinn-altinity-agents
  annotations:
    altinn.studio/image: altinn-altinity-agents:latest
    altinn.studio/image-tag: latest
  labels:
    release: altinn-altinity-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: altinn-altinity-agents
  template:
    metadata:
      labels:
        app: altinn-altinity-agents
    spec:
      serviceAccountName: altinn-altinity-agents-sa
      # The assistant does not call the Kubernetes API. It asks the core operator, with the projected token below.
      automountServiceAccountToken: false
      containers:
        - name: altinn-altinity-agents
          image: altinn-altinity-agents:latest
          ports:
            - containerPort: 8071
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 100m # Tested usage: 70m spike for 5 concurrent workflows
              memory: 250Mi # Tested usage: 220Mi
            limits:
              memory: 1Gi
          env:
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: AZURE_API_KEY
            - name: AZURE_OPENAI_ENDPOINT
              value: "https://team-altinnstudio-ai.openai.azure.com/"
            - name: AZURE_ANTHROPIC_ENDPOINT
              value: "https://team-altinnstudio-ai.services.ai.azure.com/anthropic/"
            - name: GITEA_BASE_URL
              value: "http://altinn-repositories-public"
            # The core operator runs the v9 upgrade in a sandbox Job. In an environment without sandboxes, such as
            # staging, it offers no kinds, and the upgrade tool says that it cannot run.
            - name: CORE_OPERATOR_URL
              value: "http://core-operator.core-operator.svc.cluster.local:8080"
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: LANGFUSE_BASE_URL
            - name: LANGFUSE_ENABLED
              value: "true"
            - name: LANGFUSE_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: LANGFUSE_ENVIRONMENT
            - name: LANGFUSE_RELEASE
              value: "altinity-agents-v1"
          volumeMounts:
            - name: core-operator-token
              mountPath: /var/run/secrets/core-operator
              readOnly: true
      volumes:
        # The token that the core operator accepts. It is not valid for the Kubernetes API. The kubelet renews it
        # before it expires, so the service reads the file for each request.
        - name: core-operator-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: core-operator
                  expirationSeconds: 3600
                  path: token
