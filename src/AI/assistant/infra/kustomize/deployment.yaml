apiVersion: apps/v1
kind: Deployment
metadata:
  name: altinn-altinity-agents
  annotations:
    altinn.studio/image: altinn-altinity-agents:latest
    altinn.studio/image-tag: latest
  labels:
    release: altinn-altinity-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: altinn-altinity-agents
  template:
    metadata:
      labels:
        app: altinn-altinity-agents
    spec:
      serviceAccountName: altinn-altinity-agents-sa
      containers:
        - name: altinn-altinity-agents
          image: altinn-altinity-agents:latest
          ports:
            - containerPort: 8071
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 100m # Tested usage: 70m spike for 5 concurrent workflows
              memory: 250Mi # Tested usage: 220Mi
            limits:
              memory: 1Gi
          env:
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: AZURE_API_KEY
            - name: AZURE_OPENAI_ENDPOINT
              value: "https://team-altinnstudio-ai.openai.azure.com/"
            - name: AZURE_ANTHROPIC_ENDPOINT
              value: "https://team-altinnstudio-ai.services.ai.azure.com/anthropic/"
            - name: GITEA_BASE_URL
              value: "http://altinn-repositories-public"
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: LANGFUSE_BASE_URL
            - name: LANGFUSE_ENABLED
              value: "true"
            - name: LANGFUSE_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: altinn-altinity-agents-eso-secret
                  key: LANGFUSE_ENVIRONMENT
            - name: LANGFUSE_RELEASE
              value: "altinity-agents-v1"
            - name: POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.uid=$(POD_UID)"
            - name: OTEL_SERVICE_NAME
              value: "assistant"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-router.observability.svc.cluster.local:4318"
