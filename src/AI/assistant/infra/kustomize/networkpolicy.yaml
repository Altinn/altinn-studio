apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: altinn-altinity-agents-ingress
spec:
  podSelector:
    matchLabels:
      app: altinn-altinity-agents
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              run: altinn-designer
      ports:
        - protocol: TCP
          port: 8071
