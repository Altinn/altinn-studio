services:
  altinity-agents:
    # Build from the repo root so the image can bundle the v9 layout schemas
    # (see dockerfile). dockerfile.dockerignore scopes the context.
    build:
      context: ../../..
      dockerfile: src/AI/assistant/dockerfile
    image: altinity-agents
    container_name: altinity-agents
    ports:
      - "8071:8071"
    env_file:
      - .env.docker
    environment:
      # Chromium pins *.localhost to 127.0.0.1, so map it past that.
      - PREVIEW_HOST_RESOLVER_RULES=MAP studio.localhost studio-loadbalancer, MAP localhost fake-ansattporten
      - ASSISTANT_RUNNER_URL=http://assistant-runner:8080
    networks:
      - default
      - designer

  # Runs the v9 upgrade, with the restrictions of the runner pod. See src/AI/assistant-runner.
  assistant-runner:
    build:
      context: ../assistant-runner
      dockerfile: Dockerfile
    image: assistant-runner
    container_name: assistant-runner
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /work:exec
      - /tmp
    networks:
      - default

# Joins Designer's network so this container can reach gitea-proxy by DNS on :80,
# the X-Api-Key entry. The host-exposed :81 is X-WEBAUTH-USER and rejects api keys.
networks:
  designer:
    external: true
    name: designer_default