apiVersion: apps/v1
kind: Deployment
metadata:
  name: altinn-assistant-runner
  annotations:
    altinn.studio/image: altinn-assistant-runner:latest
    altinn.studio/image-tag: latest
  labels:
    release: altinn-assistant-runner
spec:
  replicas: 1
  # A deploy starts the new pod before it stops the old one, so the assistant always has a runner.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: altinn-assistant-runner
  template:
    metadata:
      labels:
        app: altinn-assistant-runner
    spec:
      serviceAccountName: altinn-assistant-runner-sa
      # The runner does not call the Kubernetes API, and it runs app code.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Each pod is a separate VM. App code that gets out of the container is still in the VM.
      runtimeClassName: kata-vm-isolation
      nodeSelector:
        purpose: runner
      tolerations:
        - key: purpose
          operator: Equal
          value: runner
          effect: NoSchedule
      # A running job can end before the pod stops. The service waits 12 minutes for it.
      terminationGracePeriodSeconds: 780
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: altinn-assistant-runner
          image: altinn-assistant-runner:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          # The service runs as root only to start each job as the user app-build.
          # CHOWN gives the job folder to app-build. SETUID and SETGID let setpriv change the user.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          # Kata sizes the VM from the limits. Measure an upgrade and a build in dev, and change these.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 11Gi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 11Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
