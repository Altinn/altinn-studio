# For each run, the assistant starts one Job and monitors its pod until the pod is Ready. After the run, the assistant
# deletes the Job.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-runner-launcher
  namespace: assistant-runners
rules:
  # Read the pod spec of the runner Jobs.
  - apiGroups: [""]
    resources: [podtemplates]
    resourceNames: [assistant-runner]
    verbs: [get]
  # Start, monitor and remove a run. The policy in admission-policy.yaml limits what these Jobs can contain.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  # Find the pod of a Job, its phase and its IP address.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
