# The assistant creates one Job here for each run of app code. The Job pods start a microVM on a sandbox node, so they
# mount hostPath folders and request /dev/kvm. The Pod Security level baseline forbids hostPath, so the namespace
# allows privileged pods, and the policy in admission-policy.yaml limits what the assistant can create.
apiVersion: v1
kind: Namespace
metadata:
  name: assistant-runners
  labels:
    pod-security.kubernetes.io/enforce: privileged
