# This quota limits the number of runs at the same time, so that the assistant cannot take the sandbox nodes from CI.
# One run requests one KVM slot, 3 CPU and 5632Mi memory. The quota counts a Job that stopped until the assistant or its
# TTL removes the Job.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: assistant-runners
  namespace: assistant-runners
spec:
  hard:
    requests.devices.altinn.studio/kvm: "2"
    requests.cpu: "6"
    requests.memory: 11Gi
    count/jobs.batch: "10"
