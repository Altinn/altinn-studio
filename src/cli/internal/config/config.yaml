# Container images for studioctl
# This file is embedded in the binary as defaults
# Tags are updated by hand. Renovate does not manage this file: no custom manager in
# renovate.json matches this path, and the Altinn images are tagged with the first 10
# characters of the commit that built them, which no datasource can order. See
# src/Runtime/workflow-engine-app/README.md for how to find the tag for a build.

images:
  core:
    localtest:
      image: ghcr.io/altinn/altinn-studio/runtime-localtest
      tag: "541608accf"
    pdf3:
      image: ghcr.io/altinn/altinn-studio/runtime-pdf3-worker
      tag: "694406e93c"
    workflow-engine:
      image: ghcr.io/altinn/altinn-studio/runtime-workflow-engine-app
      tag: "a45a743b78"
    workflow-engine-db:
      image: postgres
      tag: "18.3"
    pgadmin:
      image: dpage/pgadmin4
      tag: "9.14"

  monitoring:
    tempo:
      image: grafana/tempo
      tag: "2.4.1"
    mimir:
      image: grafana/mimir
      tag: "2.12.0"
    loki:
      image: grafana/loki
      tag: "3.0.0"
    otel-collector:
      image: otel/opentelemetry-collector-contrib
      tag: "0.98.0"
    grafana:
      image: grafana/grafana
      tag: "10.4.2"
