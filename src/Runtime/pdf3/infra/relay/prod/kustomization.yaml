apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pdf3-relay
        namespace: runtime-pdf3
      spec:
        template:
          spec:
            containers:
              - name: pdf3-relay
                env:
                  # DIS Edge, which forwards to the environment's DIS Core
                  - name: PDF3_UPSTREAM_URL
                    value: https://studio.platform.prod.altinn.cloud/pdf/v3/generate
  # The inactivity scaler is disabled in prod; keep its existing disruption budget.
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: pdf3-relay-pdb
        namespace: runtime-pdf3
      spec:
        minAvailable: null
        maxUnavailable: 1
