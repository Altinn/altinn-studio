# pdf3's own OpenTelemetry Collector, which the proxy and workers send their telemetry to
# (collector-config.yaml). One replica: tail sampling needs all of a trace's spans in one
# Collector, and more replicas would need the runtime's routing tier in front.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdf3-collector
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf3-collector
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: pdf3-collector
  template:
    metadata:
      labels:
        app: pdf3-collector
        component: pdf3
      annotations:
        # Not meshed: the workers send plaintext anyway, so network-policies.yaml decides who
        # reaches it.
        linkerd.io/inject: disabled
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      serviceAccountName: pdf3-collector
      automountServiceAccountToken: false
      # On deletion the pod first leaves the Service and keeps working while its queue drains;
      # then the Collector shuts down and flushes. Native sleep: the image has no shell.
      terminationGracePeriodSeconds: 120 # 60s below, 30s to shut down, margin
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          # The runtime collectors' version (infra/observability/base/router.yaml and
          # gateway.yaml). Bump them together.
          image: altinncr.azurecr.io/ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0
          args:
            - --config=/conf/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 13133
          env:
            # 80% of the memory limit below, as the Collector's memory_limiter docs recommend.
            - name: GOMEMLIMIT
              value: 819MiB
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: pdf3-environment
                  key: environment
            - name: K8S_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: pdf3-environment
                  key: cluster
            # The pod's own attributes, which the Collector's own metrics carry
            # (collector-config.yaml).
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          lifecycle:
            preStop:
              sleep:
                seconds: 60 # beyond the 40s tail sampling wait and 5s batch timeout
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
            # A failed liveness probe restarts without the 60s drain.
            terminationGracePeriodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: observability-ingest-token
              mountPath: /var/run/observability-ingest-token
              readOnly: true
            - name: victoria-queue
              mountPath: /var/lib/otelcol/victoria-queue
      volumes:
        - name: config
          configMap:
            name: pdf3-collector-config
        # Optional, so the Collector runs before the token exists. Mounted as a directory: a
        # subPath mount is never updated by the kubelet, and a rotated token would not reach the
        # Collector.
        - name: observability-ingest-token
          secret:
            secretName: observability-ingest-token
            optional: true
        # The exporter's persistent queue. The limit is well above the queue's size in
        # collector-config.yaml, because exceeding it evicts the pod.
        - name: victoria-queue
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pdf3-collector
  labels:
    app: pdf3-collector
    component: pdf3
spec:
  type: ClusterIP
  selector:
    app: pdf3-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      # Linkerd treats an appProtocol it doesn't know, such as grpc, as opaque. This one it
      # treats as HTTP/2, which OTLP over gRPC is.
      appProtocol: kubernetes.io/h2c
