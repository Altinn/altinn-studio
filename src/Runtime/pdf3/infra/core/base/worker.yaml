# The pdf3 workers, which only the proxy calls. Not meshed, as in the tenant clusters: Chrome
# loads arbitrary pages from here, and a Linkerd proxy would give those requests the workers'
# mesh identity towards every meshed service in the cluster. Their traffic is limited by
# network-policies.yaml instead.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdf3-worker
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  # At most one zone (hopefully, depending on skew) is disrupted at a time, e.g. while nodes
  # are drained.
  maxUnavailable: '30%'
  selector:
    matchLabels:
      app: pdf3-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pdf3-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pdf3-worker
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 40
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        # At most 5 pods per 10s.
        value: 5
        periodSeconds: 10
    scaleDown:
      # Keeps capacity for an hour after a spike, and then scales down one pod a minute.
      stabilizationWindowSeconds: 3600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: pdf3-worker
  labels:
    app: pdf3-worker
    component: pdf3
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5031
    protocol: TCP
    appProtocol: http
    name: http
  selector:
    app: pdf3-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdf3-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf3-worker
  annotations:
    altinn.studio/image: runtime-pdf3-worker:latest
    altinn.studio/image-tag: latest
spec:
  minReadySeconds: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  # No replicas, so Flux doesn't override the HPA.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never below the desired replicas during a rollout, at the cost of surge capacity.
      maxUnavailable: 0
      maxSurge: '20%'
  selector:
    matchLabels:
      app: pdf3-worker
  template:
    metadata:
      labels:
        app: pdf3-worker
        component: pdf3
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pdf3-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pdf3-worker
      serviceAccountName: pdf3-worker
      automountServiceAccountToken: false
      # 60s to finish the renders in progress. Keep in line with runtime.Host.
      terminationGracePeriodSeconds: 60
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 512Mi
        name: tmpdisk
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pdf3-worker
          image: ""
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5031
              protocol: TCP
          # Up to 60s (30 * 2s) to start before the liveness probe takes over.
          startupProbe:
            httpGet:
              path: /health/startup
              port: 5031
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5031
            periodSeconds: 3
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5031
            initialDelaySeconds: 10
            periodSeconds: 3
            # 15s of consecutive failures before a restart.
            failureThreshold: 5
            timeoutSeconds: 2
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          # The collector has no k8sattributes processor, which needs a ClusterRole, so the pod
          # describes itself.
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "k8s.pod.uid=$(POD_UID),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=pdf3-worker"
          - name: OTEL_SERVICE_NAME
            value: "pdf3-worker"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://pdf3-collector.product-studio-pdf3.svc.cluster.local:4317"
          - name: OTEL_METRIC_EXPORT_INTERVAL
            value: "15000"
          - name: TZ
            value: Europe/Oslo
          - name: PDF3_ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: pdf3-environment
                key: environment
          # PDF3_SERVICEOWNER is deliberately unset, so a request's service owner is the
          # X-Altinn-Service-Owner header the proxy passes on.
          - name: PDF3_QUEUE_SIZE
            value: "0"
          resources:
            requests:
              # The browser can saturate a core, but not all the time.
              cpu: 500m
              memory: 1Gi
          volumeMounts:
          - mountPath: /tmp
            name: tmpdisk
