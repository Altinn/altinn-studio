# The proxy's key file, from the Key Vault secret pdf3-api-keys, which holds every valid key, one per
# line. One secret rather than one per key: a deleted Key Vault secret stays soft-deleted for 90
# days, and writing a new secret under its name fails with 409 Conflict until then.
# src/Runtime/pdf3/docs/api-keys.md describes how to write, rotate and revoke the keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdf3-api-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: pdf3-secret-store
  target:
    name: pdf3-api-keys
    creationPolicy: Owner
  data:
    - secretKey: keys
      remoteRef:
        key: pdf3-api-keys
