# The public endpoint is POST /pdf/v3/generate on DIS Edge's platform host (in at22
# https://platform.at22.altinn.cloud/pdf/v3/generate), which forwards to this host. Whether Edge
# keeps the /pdf/v3 prefix is not confirmed yet, so /pdf/v3/generate and /generate are both
# routed, and rewritten to the proxy's /pdf; remove the one Edge doesn't send once it is.
# Nothing else is routed, not the proxy's /pdf nor its health endpoints. The hostname is set per
# environment.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pdf3-proxy
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - set-per-environment
  rules:
    - matches:
        # Edge keeps the prefix.
        - method: POST
          path:
            type: Exact
            value: /pdf/v3/generate
        # Edge removes the prefix.
        - method: POST
          path:
            type: Exact
            value: /generate
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /pdf
        # Traefik's Linkerd proxy routes to the Service rather than the pod IP Traefik picked,
        # so the proxy's policy and topology-aware routing apply.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: l5d-dst-override
                value: pdf3-proxy.product-studio-pdf3.svc.cluster.local:80
      backendRefs:
        - group: ""
          kind: Service
          name: pdf3-proxy
          port: 80
