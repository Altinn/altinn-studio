# pdf3's Key Vault, with the API keys the relays in the tenant clusters present and the
# observability ingest token. dis-vault-operator grants Key Vault Secrets Officer to the pdf3
# identity and to the group in groupObjectId (set per environment), so its members can write the
# secrets. With externalSecrets it creates the SecretStore pdf3-secret-store.
apiVersion: vault.dis.altinn.cloud/v1alpha1
kind: Vault
metadata:
  name: pdf3
  annotations:
    # Flux never deletes it, not even when it is removed from the manifests or the Kustomization
    # pdf3 is deleted. Deleting it deletes the Azure Key Vault and its secrets. The Key Vault's
    # name is derived from the namespace, the name and the environment, and purge protection
    # keeps the deleted vault for the 90 days of soft delete, so the Vault could not be
    # recreated under the same name until then. Removing it is a manual step.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  identityRef:
    name: pdf3
  externalSecrets: true
