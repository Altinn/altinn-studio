apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pdf3
  namespace: product-studio-pdf3
  annotations:
    # The root Kustomization points the sourceRef of an annotated Kustomization at its own
    # source, the artifact this file is in.
    clusterconfig.azure.com/use-managed-source: "true"
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  # Waiting for every resource would also wait for ExternalSecrets whose Vault secret doesn't
  # exist yet, such as observability-ingest-token, and keep the Kustomization from being ready
  # until it does. It is ready once these are, and pdf3-proxy only becomes ready with its API
  # keys.
  wait: false
  healthChecks:
    - apiVersion: vault.dis.altinn.cloud/v1alpha1
      kind: Vault
      name: pdf3
      namespace: product-studio-pdf3
    - apiVersion: apps/v1
      kind: Deployment
      name: pdf3-proxy
      namespace: product-studio-pdf3
    - apiVersion: apps/v1
      kind: Deployment
      name: pdf3-worker
      namespace: product-studio-pdf3
    - apiVersion: apps/v1
      kind: Deployment
      name: pdf3-collector
      namespace: product-studio-pdf3
  path: set-per-environment
  targetNamespace: product-studio-pdf3
  serviceAccountName: flux-applier
  sourceRef:
    kind: OCIRepository
    name: product-studio-pdf3
    namespace: product-studio-pdf3
