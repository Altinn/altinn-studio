apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The product's root Kustomization applies this folder without pruning. The Flux Kustomization
# pdf3 applies ./prod/app from the same artifact, with pruning.
resources:
  - ../flux-kustomization

patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: pdf3
    patch: |-
      - op: replace
        path: /spec/path
        value: ./prod/app
