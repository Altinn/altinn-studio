apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
components:
  - ../relay
# A change to the route pdf/pdf3's weights is a patch here: literal integers, never both 0 (see
# ../relay/httproute.yaml).
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pdf3-relay
        namespace: runtime-pdf3
      spec:
        template:
          spec:
            containers:
              - name: pdf3-relay
                env:
                  # DIS Edge, which forwards to the environment's DIS Core
                  - name: PDF3_UPSTREAM_URL
                    value: https://studio.platform.tt02.altinn.cloud/pdf/v3/generate
  # 10% of tt02's PDF requests through the relay to DIS Core.
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: pdf3
      namespace: pdf
    patch: |-
      - op: replace
        path: /spec/rules/0/backendRefs/0/weight
        value: 90
      - op: replace
        path: /spec/rules/0/backendRefs/1/weight
        value: 10
