apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
components:
  - ../relay
# A change to the route pdf/pdf3's weights is a patch here: literal integers, never both 0 (see
# ../relay/httproute.yaml).
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pdf3-relay
        namespace: runtime-pdf3
      spec:
        template:
          spec:
            containers:
              - name: pdf3-relay
                env:
                  # DIS Edge, which forwards to the environment's DIS Core
                  - name: PDF3_UPSTREAM_URL
                    value: https://studio.platform.tt02.altinn.no/pdf/v3/generate
