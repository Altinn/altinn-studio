apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
components:
  - ../relay
# A change to the route pdf/pdf3's weights is a patch here: literal integers, never both 0 (see
# ../relay/httproute.yaml).
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pdf3-relay
      spec:
        template:
          spec:
            containers:
              - name: pdf3-relay
                env:
                  # DIS Edge, which forwards to the environment's DIS Core
                  - name: PDF3_UPSTREAM_URL
                    value: https://studio.platform.yt01.altinn.cloud/pdf/v3/generate
# pdf3-app's targetNamespace moves every object to runtime-pdf3. Replacements run after that, so
# this puts the route back in its Service's namespace, the only place it applies to apps' requests.
replacements:
- source:
    kind: HTTPRoute
    name: pdf3
    fieldPath: spec.parentRefs.0.namespace
  targets:
  - select:
      kind: HTTPRoute
      name: pdf3
    fieldPaths:
      - metadata.namespace
