apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
components:
  - ../relay
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pdf3-relay
      spec:
        template:
          spec:
            containers:
              - name: pdf3-relay
                env:
                  # tt02's DIS Edge, since at24 has no DIS Core of its own
                  - name: PDF3_UPSTREAM_URL
                    value: https://studio.platform.tt02.altinn.no/pdf/v3/generate
