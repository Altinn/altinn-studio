# For environments whose route pdf/pdf3 sends every request to the relay: keeps one local proxy and
# worker, so that a weight change back to the local proxy still has somewhere to go.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: pdf3-proxy-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: pdf3-worker-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
