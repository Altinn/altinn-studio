# Splits apps' PDF requests between the local proxy and the relay to DIS Core. The Flux
# Kustomization pdf3-route in the runtime syncroot (infra/runtime/syncroot/pdf3-relay) applies it
# in the environments with a DIS Core and sets the weights. The defaults here only apply if its
# ConfigMap lacks one.
#
# pdf/pdf3-migration (infra/runtime/syncroot/base/pdf.yaml) also routes the Service, to the proxy
# only. This route's longer path match takes precedence over it, so it decides for /pdf, the only
# path apps call. Where this route doesn't exist, pdf3-migration routes everything.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pdf3
  namespace: pdf
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: pdf-generator
    namespace: pdf
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /pdf
    backendRefs:
    - name: pdf3-proxy
      namespace: runtime-pdf3
      kind: Service
      port: 80
      weight: ${PDF3_PROXY_WEIGHT:=100}
    - name: pdf3-relay
      namespace: runtime-pdf3
      kind: Service
      port: 80
      weight: ${PDF3_RELAY_WEIGHT:=0}
