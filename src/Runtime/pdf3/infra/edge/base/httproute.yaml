# The relays' upstream, https://studio.platform.<env>.altinn.cloud/pdf/v3/generate, forwarded to
# DIS Core with the path unchanged. Both hostnames are set per environment. The relay gives up
# on a request after 2 minutes, so a longer request timeout here would not be used.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: studio-pdf
spec:
  hostnames:
    - set-per-environment
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: studio
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - name: default
      matches:
        - path:
            type: PathPrefix
            value: /pdf
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: set-per-environment
      timeouts:
        request: 3m
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: pdf-dis-upstream
