# The environment's DIS Core pdf3 host (core/base/httproute.yaml), verified against the system
# CAs. The hostname is set per environment, here and in the TLS policy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: pdf-dis-upstream
spec:
  endpoints:
    - fqdn:
        hostname: set-per-environment
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: pdf-dis-upstream-tls
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: pdf-dis-upstream
  validation:
    wellKnownCACertificates: System
    hostname: set-per-environment
