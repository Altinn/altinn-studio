apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/without-traffic

patches:
  # The object ID of the Entra group DIS AKS Admin Dev STUDIO.
  - target:
      kind: Vault
      name: pdf3
    patch: |-
      - op: add
        path: /spec/groupObjectId
        value: 0ff23f19-87a9-455c-928d-226b4ea41f16
  - target:
      kind: ConfigMap
      name: pdf3-environment
    patch: |-
      - op: replace
        path: /data/environment
        value: yt01
      - op: replace
        path: /data/cluster
        value: dis-core-yt01-aks
  - target:
      kind: HTTPRoute
      group: gateway.networking.k8s.io
      name: pdf3-proxy
    patch: |-
      - op: replace
        path: /spec/hostnames
        value:
          - pdf3.yt01.dis-core.altinn.cloud
