apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/without-traffic

patches:
  # The object ID of the Entra group DIS AKS Admin Prod STUDIO.
  - target:
      kind: Vault
      name: pdf3
    patch: |-
      - op: add
        path: /spec/groupObjectId
        value: b56fb340-2ffb-4f09-bf87-80d4458a43fe
  - target:
      kind: ConfigMap
      name: pdf3-environment
    patch: |-
      - op: replace
        path: /data/environment
        value: prod
  - target:
      kind: HTTPRoute
      group: gateway.networking.k8s.io
      name: pdf3-proxy
    patch: |-
      - op: replace
        path: /spec/hostnames
        value:
          - pdf3.prod.dis-core.altinn.cloud
