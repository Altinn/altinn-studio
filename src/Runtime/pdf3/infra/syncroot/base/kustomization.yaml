apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: product-studio-pdf3

resources:
  - identity.yaml
  - vault.yaml
  - environment.yaml
  - secrets.yaml
  - proxy.yaml
  - worker.yaml
  - collector.yaml
  - httproute.yaml
  - linkerd-policies.yaml
  - network-policies.yaml

# A hash in the name rolls the collector when its configuration changes.
configMapGenerator:
  - name: pdf3-collector-config
    files:
      - config.yaml=collector-config.yaml

# The images come from the annotations, which deploy-runtime-pdf3.yaml sets to the build it
# publishes this artifact with, as in the tenant manifests (infra/kustomize/base).
replacements:
- source:
    kind: Deployment
    name: pdf3-proxy
    fieldPath: metadata.annotations.[altinn.studio/image]
  targets:
  - select:
      kind: Deployment
      name: pdf3-proxy
    fieldPaths:
      - spec.template.spec.containers.[name=pdf3-proxy].image
- source:
    kind: Deployment
    name: pdf3-worker
    fieldPath: metadata.annotations.[altinn.studio/image]
  targets:
  - select:
      kind: Deployment
      name: pdf3-worker
    fieldPaths:
      - spec.template.spec.containers.[name=pdf3-worker].image
