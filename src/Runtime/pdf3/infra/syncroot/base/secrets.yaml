# The API keys the proxy accepts, from the Key Vault secret pdf3-api-keys through the SecretStore
# the Vault creates. The secret holds every valid key, one per line; the proxy ignores empty
# lines and lines starting with #. If the secret doesn't exist, neither does the Secret, and the
# proxy doesn't start.
#
# One secret rather than one per key: a deleted Key Vault secret stays soft-deleted for 90 days,
# and writing a new secret under its name fails with 409 Conflict until then.
#
# Write pdf3-api-keys once the Vault exists and before the proxy is first deployed. Without it, the
# proxy's pods wait for the missing Secret, the Deployment exceeds its 60s progress deadline and
# the Kustomization pdf3 goes Ready=False. ESO retries a failed sync with a backoff of up to
# 7 minutes (about 17 before ESO 0.14), so the first sync can lag the write by that much. To sync
# at once:
#   kubectl -n product-studio-pdf3 annotate externalsecret pdf3-api-keys force-sync=$(date +%s) --overwrite
#
# To rotate a key:
# 1. Add the new key to pdf3-api-keys on a new line.
# 2. Wait about 7 minutes: this ExternalSecret's refresh (5m), the kubelet's sync of the mounted
#    Secret (about 1m) and the proxy's check of the file (30s). The proxy logs "Reloaded API
#    keys" with the number of keys.
# 3. Switch the relays to the new key.
# 4. Remove the old key's line, which takes as long to reach the proxy.
#
# Never delete pdf3-api-keys; only write a new version of it. Deleting it revokes nothing, because
# ESO keeps the Secret it created, and soft delete then blocks the name for 90 days.
#
# A secret without keys doesn't revoke them: the proxy keeps its current keys until its pods
# restart, and then fails to start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdf3-api-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: pdf3-secret-store
  target:
    name: pdf3-api-keys
    creationPolicy: Owner
  data:
    - secretKey: keys
      remoteRef:
        key: pdf3-api-keys
