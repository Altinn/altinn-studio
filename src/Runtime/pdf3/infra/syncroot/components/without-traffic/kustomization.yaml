apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Sizing for an environment without traffic. Size the HPAs in the environment's overlay instead
# when the relays start sending it traffic.
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: pdf3-proxy
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: pdf3-worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 5
