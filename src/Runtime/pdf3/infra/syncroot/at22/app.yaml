apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pdf3
  namespace: product-studio-pdf3
  annotations:
    # The root Kustomization points the sourceRef of an annotated Kustomization at its own
    # source, the artifact this file is in.
    clusterconfig.azure.com/use-managed-source: "true"
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  path: ./at22/app
  targetNamespace: product-studio-pdf3
  serviceAccountName: flux-applier
  sourceRef:
    kind: OCIRepository
    name: product-studio-pdf3
    namespace: product-studio-pdf3
