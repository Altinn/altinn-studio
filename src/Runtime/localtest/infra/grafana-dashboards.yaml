apiVersion: 1

providers:
  # The dashboards land in the same folder as in the shared Grafana, grafana.dis.altinn.cloud.
  - name: "Dashboard provider"
    orgId: 1
    folder: Altinn Studio
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
