receivers:
  otlp:
    protocols:
      # Collector 0.104.0 changed the default receiver host from 0.0.0.0 to
      # localhost, which makes the published port unreachable from the host.
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 10000

exporters:
  otlphttp/victoria-logs:
    logs_endpoint: http://localtest_victoria_logs:9428/insert/opentelemetry/v1/logs
  otlphttp/victoria-traces:
    traces_endpoint: http://localtest_victoria_traces:10428/insert/opentelemetry/v1/traces
  prometheusremotewrite/victoria-metrics:
    endpoint: http://localtest_victoria_metrics:8428/api/v1/write

service:
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victoria-traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite/victoria-metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victoria-logs]
