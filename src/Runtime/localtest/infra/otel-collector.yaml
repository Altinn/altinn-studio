receivers:
  otlp:
    protocols:
      # The receiver listens on localhost by default, which the published port cannot reach.
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 10000

# Every signal is exported as OTLP. VictoriaMetrics stores metrics under their OpenTelemetry
# names and attributes (http.server.request.duration{service.name="..."}), as it does in prod.
exporters:
  otlphttp/victoria-logs:
    logs_endpoint: http://localtest-victoria-logs:9428/insert/opentelemetry/v1/logs
  otlphttp/victoria-metrics:
    metrics_endpoint: http://localtest-victoria-metrics:8428/opentelemetry/v1/metrics
  otlphttp/victoria-traces:
    traces_endpoint: http://localtest-victoria-traces:10428/insert/opentelemetry/v1/traces

service:
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victoria-traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victoria-metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victoria-logs]
