apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    orgId: 1
    url: http://localtest-victoria-metrics:8428
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: GET
      prometheusType: Prometheus
      prometheusVersion: 2.24.0
      timeInterval: "10s"

  # VictoriaTraces implements the Tempo HTTP API, so the Tempo datasource gives
  # TraceQL and Traces Drilldown. /select/jaeger is also served, if ever needed.
  - name: Traces
    type: tempo
    uid: traces
    access: proxy
    orgId: 1
    url: http://localtest-victoria-traces:10428/select/tempo
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    apiVersion: 1
    jsonData:
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus

  - name: Logs
    type: victoriametrics-logs-datasource
    uid: logs
    access: proxy
    orgId: 1
    url: http://localtest-victoria-logs:9428
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
