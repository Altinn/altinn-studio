apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: studio-slack-critical
  namespace: grafana
spec:
  name: Studio Slack Critical
  receivers:
    - type: slack
      disableResolveMessage: false
      settings:
        title: '{{ .Status }} {{ .CommonLabels.Env }}'
        text: '{{ range $i, $a := .Alerts }}{{ $a.Labels.job }}{{ end }}'
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: grafana-slack-webhooks
              key: studio-critical
