apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-kvm-device-plugin
  namespace: kube-system
  annotations:
    altinn.studio/image: k8s-kvm-device-plugin:latest
    altinn.studio/image-tag: latest
  labels:
    app.kubernetes.io/name: k8s-kvm-device-plugin
    app.kubernetes.io/part-of: altinn-studio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-kvm-device-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-kvm-device-plugin
        app.kubernetes.io/part-of: altinn-studio
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
        purpose: sandbox
      tolerations:
        - key: purpose
          operator: Equal
          value: sandbox
          effect: NoSchedule
      containers:
        - name: plugin
          image: ''
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: kvm
              mountPath: /dev/kvm
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
