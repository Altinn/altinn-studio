apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - daemonset.yaml
replacements:
  - source:
      kind: DaemonSet
      name: k8s-kvm-device-plugin
      fieldPath: metadata.annotations.[altinn.studio/image]
    targets:
      - select:
          kind: DaemonSet
          name: k8s-kvm-device-plugin
        fieldPaths:
          - spec.template.spec.containers.[name=plugin].image
