[files]
# Hidden directories are scanned; see the note in the engine's typos.toml. Without this, .k6 here was
# skipped before its exclude was ever consulted, so neither was doing anything.
ignore-hidden = false
extend-exclude = [
    "**/bin/**",
    "**/obj/**",
    "*.svg",
    "*.drawio*"
]

[default]
locale = "en-us"

[default.extend-words]
# Domain words and acronyms that should not be flagged.
# Add entries as `word = "word"` to whitelist a token.
