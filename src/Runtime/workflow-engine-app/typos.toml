[files]
# Hidden directories are scanned; see the note in the engine's typos.toml.
ignore-hidden = false
extend-exclude = [
    "**/bin/**",
    "**/obj/**",
    "*.svg",
    "*.drawio*"
]

[default]
locale = "en-us"

[default.extend-words]
# Domain words and acronyms that should not be flagged.
# Add entries as `word = "word"` to whitelist a token.
