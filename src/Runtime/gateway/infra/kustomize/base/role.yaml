apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-role
rules:
  # Core Kubernetes resources
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      # To restart apps. Flux applies this with the gateway's targetNamespace, which would move a Role in `default`
      # to the gateway's namespace, so the grant is cluster-wide like the rest, and the gateway patches only `default`.
      - patch
  # To find the pods of a Deployment's latest revision.
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  # Flux CD resources
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - get
      - list
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - ocirepositories
    verbs:
      - get
      - patch
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - patch
