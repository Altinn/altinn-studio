# Overrides for the observability playground — the stack `perpetual-mix.js` is meant to drive.
#
# Everything here, and in the `playground.env` it loads, exists so a human can watch the Grafana
# dashboard move within a couple of minutes instead of an hour. None of it belongs in a shared
# default:
#
#   * Namespace throttling ships dark (`ThrottlingSettings.Enabled` has no initializer), so the
#     throttle panels have nothing to draw until it is switched on. It is switched on in
#     `playground.env`, and there only — never in `appsettings.json`, `Defaults.cs` or the shared
#     `docker-compose.yaml`.
#   * The sweep and the recovery windows are shrunk hard; the trip thresholds keep their defaults.
#     Production defaults are a 30 s sweep and a 10 min first window, which means the first
#     `altinn.workflow_engine.throttle.cleared` on a healthy recovery is ten minutes after the trip.
#     At the values in `playground.env` a namespace trips within ~30 s of the storm starting and
#     clears within ~2 min of it stopping, so trip → extend → release → clear all fit inside one
#     sitting.
#
# The engine exports to an OTLP collector on the host, as `docker-compose.yaml` sets it up, and the
# Workflow Engine dashboard reads it under the `workflow-engine-testapp` service (docs/docker.md#monitoring).
#
# Usage (from `src/Runtime/workflow-engine`), with a collector on the host:
#
#   make playground                 # up, with these overrides
#   make playground-stop            # down
#
# or, spelled out:
#
#   docker compose -f docker-compose.yaml -f .k6/docker-compose.playground.yaml \
#       --profile core up -d --build
#
# `make playground-host` runs the same settings with the engine on the host, which reaches a
# collector published on the host's loopback where this container cannot (.k6/README.md).
services:
  workflow-engine-testapp:
    # Relative to the project directory, the first compose file's, not to this file.
    env_file: .k6/playground.env
