services:
  postgres:
    image: postgres:18
    container_name: workflow-engine-postgres
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_DB: workflow_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      TZ: Europe/Oslo
    ports:
      - "9543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./.docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-tuning.sql:ro
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    networks:
      - workflow-engine-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: workflow-engine-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@altinn.no
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      GUNICORN_ACCESS_LOGFILE: '/dev/null'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - workflow-engine-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./.docker/servers.json:/pgadmin4/servers.json

  workflow-engine-testapp:
    build:
      context: ../../
      dockerfile: Runtime/workflow-engine/Dockerfile
    container_name: workflow-engine-testapp
    restart: unless-stopped
    networks:
      - workflow-engine-network
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: "9090"
      ConnectionStrings__WorkflowEngine: "Host=postgres;Database=workflow_engine;Username=postgres;Password=postgres123"
      # Telemetry goes to the collector `studioctl env up --monitoring` publishes on the host. When
      # nothing listens on 4317, the exporter fails quietly and the engine runs on. Docker Engine on
      # Linux does not route host-gateway to the host's loopback, where the collector is published.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
      OTEL_SERVICE_NAME: workflow-engine-testapp
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    volumes:
      - ./src/WorkflowEngine.Core/wwwroot:/app/wwwroot:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core]

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: workflow-engine-wiremock
    restart: unless-stopped
    ports:
      - "6060:8080"
    networks:
      - workflow-engine-network
    volumes:
      - ./.docker/wiremock:/home/wiremock
    command:
      - "--global-response-templating"
      - "--verbose"
      - "--max-request-journal-entries=1000"

volumes:
  postgres_data:
  pgadmin_data:

networks:
  workflow-engine-network:
    driver: bridge
