[files]
# Hidden directories are scanned: without this, `typos` skips every dot-directory before any exclude is
# consulted, so .k6 and .claude were never checked. Put a false positive in extend-words below rather
# than a directory back in extend-exclude.
ignore-hidden = false
extend-exclude = [
    "**/bin/**",
    "**/obj/**",
    "*.svg",
    "*.drawio*",
    "**/docs/presentation/**"
]

[default]
locale = "en-us"

[default.extend-words]
# Domain words and acronyms that should not be flagged.
# Add entries as `word = "word"` to whitelist a token.
OCE = "OCE" # OperationCanceledException
