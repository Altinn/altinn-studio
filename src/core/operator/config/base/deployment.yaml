apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-operator
  namespace: core-operator
  labels:
    app.kubernetes.io/name: core-operator
  # The deploy workflow pins the image here, and kustomization.yaml copies it to the container.
  annotations:
    altinn.studio/image: altinntjenestercontainerregistry.azurecr.io/altinn-studio/core-operator:latest
    altinn.studio/image-tag: latest
spec:
  # The queue lives in the operator's memory, so two pods must not admit runs at once: the old pod stops before the
  # new one starts. The run API is down for a few seconds; callers and the engine retry.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: core-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-operator
    spec:
      serviceAccountName: core-operator
      # The operator calls the Kubernetes API: it reviews tokens, and creates and deletes Jobs.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core-operator
          image: altinntjenestercontainerregistry.azurecr.io/altinn-studio/core-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: callbacks
              containerPort: 8090
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.uid=$(POD_UID)"
            - name: OTEL_SERVICE_NAME
              value: core-operator
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-router.observability.svc.cluster.local:4317"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # The operator's default folder for its configuration.
          volumeMounts:
            - name: config
              mountPath: /etc/core-operator
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: core-operator-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
