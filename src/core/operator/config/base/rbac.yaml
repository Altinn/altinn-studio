# The operator checks the ServiceAccount tokens of its callers and of the engine with TokenReviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: core-operator-tokenreviews
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core-operator-tokenreviews
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: core-operator-tokenreviews
subjects:
  - kind: ServiceAccount
    name: core-operator
    namespace: core-operator
