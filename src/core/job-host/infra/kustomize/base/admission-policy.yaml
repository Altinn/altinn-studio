# The Role allows the core operator to create Jobs. RBAC cannot limit what a Job contains. This policy makes sure that
# the operator can start only job host pods. It accepts a Job from the operator only when the pod of the Job is the pod
# of the PodTemplate job-host.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandbox-run-jobs
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: PodTemplate
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [jobs]
  matchConditions:
    - name: from-the-core-operator
      expression: request.userInfo.username == "system:serviceaccount:core-operator:core-operator"
  validations:
    - expression: object.spec.template.spec == params.template.spec
      message: The pod spec of the Job must be the pod spec of the PodTemplate job-host.
    - expression: >-
        (has(object.spec.template.metadata.annotations) ? object.spec.template.metadata.annotations : {}) ==
        (has(params.template.metadata.annotations) ? params.template.metadata.annotations : {})
      message: The pod annotations of the Job must be the pod annotations of the PodTemplate job-host.
    - expression: has(object.spec.backoffLimit) && object.spec.backoffLimit == 0
      message: A run Job must not retry its pod.
    # The Job lives through the upload of the caller, the run and the time that the job host keeps the result.
    - expression: has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds <= 1800
      message: A run Job must stop within 1800 seconds.
    - expression: has(object.spec.ttlSecondsAfterFinished)
      message: A run Job must have a TTL, so that Kubernetes removes it when the operator does not.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandbox-run-jobs
spec:
  policyName: sandbox-run-jobs
  validationActions: [Deny]
  paramRef:
    name: job-host
    namespace: sandbox-runs
    parameterNotFoundAction: Deny
