apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
# Where browsers reach preview, and the Studio origin that may show it in a frame.
configMapGenerator:
  - name: altinn-preview-environment
    literals:
      - publicBaseUrl=https://preview.altinnusercontent.studio
      - studioOrigin=https://altinn.studio
