apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - service.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - redis.yaml
  - externalsecret.yaml
replacements:
  - source:
      kind: Deployment
      name: altinn-preview
      fieldPath: metadata.annotations.[altinn.studio/image]
    targets:
      - select:
          kind: Deployment
          name: altinn-preview
        fieldPaths:
          - spec.template.spec.containers.[name=preview].image
