# The sessions' Redis password. Only preview and its Redis use it, so External Secrets generates it in the cluster
# instead of copying it from a vault. Both read it when they start, so the Secret never changes on its own: a pod that
# restarts alone, such as on a node drain, gets the same password as the other.
#
# To change the password, delete the altinn-preview-redis Secret, and External Secrets generates a new one. Then
# restart Redis and preview. Restarting Redis ends every session.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: altinn-preview-redis
spec:
  length: 64
  digits: 16
  # Letters and digits only. The password goes into a Redis connection string, where a comma ends it.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: altinn-preview-redis
spec:
  refreshPolicy: CreatedOnce
  target:
    name: altinn-preview-redis
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: altinn-preview-redis
