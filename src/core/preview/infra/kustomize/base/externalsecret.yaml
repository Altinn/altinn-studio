# The sessions' Redis password, from the Studio Key Vault, where altinn-studio-infra generates it. Redis and preview
# read it when they start, so after a change both must restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: altinn-preview-redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: studio-key-vault
  target:
    name: altinn-preview-redis
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: preview-redis-password
