# The core operator creates one Job here for each run of app code. The Job pods mount hostPath folders and request
# /dev/kvm, because they start a microVM on a sandbox node. The namespace allows privileged pods, because the Pod
# Security level baseline does not allow hostPath. The policy in admission-policy.yaml limits what the operator can
# create.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-runs
  labels:
    pod-security.kubernetes.io/enforce: privileged
