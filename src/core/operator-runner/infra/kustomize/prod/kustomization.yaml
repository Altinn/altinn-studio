apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
# Four runs at the same time. Measure how callers use the runs before you change it.
patches:
  - target:
      kind: ResourceQuota
      name: core-operator-runners
    patch: |-
      - op: replace
        path: /spec/hard
        value:
          requests.devices.altinn.studio/kvm: "4"
          requests.cpu: "12"
          requests.memory: 22Gi
          count/jobs.batch: "20"
