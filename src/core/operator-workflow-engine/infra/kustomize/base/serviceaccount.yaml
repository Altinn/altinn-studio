# The engine's Entra identity. It logs in to the engine's Postgres server, and the SecretStore in secrets.yaml uses it
# to read the connection string from the Studio Key Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-workflow-engine
  annotations:
    azure.workload.identity/client-id: "${OPERATOR_WORKFLOW_ENGINE_ENTRA_CLIENT_ID}"
automountServiceAccountToken: false
