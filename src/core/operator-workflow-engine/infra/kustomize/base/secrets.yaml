# An ExternalSecret can only use a SecretStore in its own namespace, and the Studio Key Vault's SecretStore is in
# default. This one reads the same Key Vault as the engine's identity, which needs read access to the secret below.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: studio-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      tenantId: "${TENANT_ID}"
      vaultUrl: "${STUDIO_KV_URI}"
      serviceAccountRef:
        name: core-operator-workflow-engine
---
# README.md describes the connection string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-operator-workflow-engine-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: studio-key-vault
  target:
    name: core-operator-workflow-engine-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        secrets.json: '{"ConnectionStrings": {"WorkflowEngine": {{ .connectionString | toJson }}}}'
  data:
    - secretKey: connectionString
      remoteRef:
        key: core-operator-workflow-engine-connection-string
