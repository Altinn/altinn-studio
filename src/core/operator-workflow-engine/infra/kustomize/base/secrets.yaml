# The Studio Key Vault's SecretStore lives in the default namespace, and an ExternalSecret can only use a SecretStore
# in its own namespace. This one reads the same Key Vault as the engine's own identity, which needs read access to
# the secret below.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: studio-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      tenantId: "${TENANT_ID}"
      vaultUrl: "${STUDIO_KV_URI}"
      serviceAccountRef:
        name: operator-workflow-engine
---
# The host reads its connection string from /app/secrets/secrets.json. README.md describes the value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-workflow-engine-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: studio-key-vault
  target:
    name: operator-workflow-engine-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        secrets.json: '{"ConnectionStrings": {"WorkflowEngine": {{ .connectionString | toJson }}}}'
  data:
    - secretKey: connectionString
      remoteRef:
        key: operator-workflow-engine-connection-string
