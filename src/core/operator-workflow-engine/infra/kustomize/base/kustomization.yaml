apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: operator-workflow-engine

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secrets.yaml
  - service.yaml
  - deployment.yaml
  - networkpolicy.yaml

# Copy the image annotation onto the container spec. The deploy workflow pins the annotation with yq before it pushes
# the manifests.
replacements:
  - source:
      kind: Deployment
      name: operator-workflow-engine
      fieldPath: metadata.annotations.[altinn.studio/image]
    targets:
      - select:
          kind: Deployment
          name: operator-workflow-engine
        fieldPaths:
          - spec.template.spec.containers.[name=operator-workflow-engine].image
