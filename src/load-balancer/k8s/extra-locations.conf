location /kuberneteswrapper/ {
  proxy_pass          http://kwlocation/;
}

location ^~ /internal/observability/ {
  # The upstream is a variable, so nginx resolves it per request through the resolver
  # below instead of once at startup. A missing observability-proxy Service then fails
  # this location with a 502 rather than stopping the load balancer from starting.
  # nginx's resolver ignores the search domains in /etc/resolv.conf, so both names are
  # fully qualified; the resolver's own name is looked up once, at startup.
  resolver            kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
  resolver_timeout    5s;
  set                 $observability_proxy observability-proxy.observability.svc.cluster.local;
  # No URI part, so the request URI goes upstream exactly as the client sent it.
  proxy_pass          http://$observability_proxy;
  proxy_http_version  1.1;

  # Declaring any proxy_set_header here stops the server-level ones from being inherited,
  # so the server block's headers in nginx.conf.template are restated. Keep them in step.
  proxy_set_header    Host $host;
  proxy_set_header    X-Real-IP $remote_addr;
  proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header    X-Forwarded-Proto $scheme;
  proxy_set_header    Authorization $http_authorization;

  # 50 MiB, the same as MaxRequestBodyBytes in the proxy
  # (src/observability-proxy/src/Altinn.Studio.Observability.Proxy/Hosting/ObservabilityProxyExtensions.cs).
  # The server default is also 50M today; this is set here so the pair cannot drift apart.
  client_max_body_size 50m;

  # OTLP exports are telemetry about telemetry; tracing them would put a span per export
  # into Application Insights.
  otel_trace          off;
}
