upstream kwlocation {
  server kuberneteswrapper:3000;
}

upstream lhci {
  server lhci-server.lhci:9001;
}

# Rollout order: nginx resolves upstream host names once, at startup, and refuses to
# start when one does not resolve. This image has no resolver directive, so there is no
# runtime re-resolution to fall back on, and the load balancer must therefore not roll
# in a cluster before the Flux observability artifact has created this Service. The lhci
# upstream above has the same property; it is an accepted pattern here, not an oversight.
upstream observability_proxy {
  server observability-proxy.observability.svc.cluster.local;
}
