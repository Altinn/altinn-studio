upstream kwlocation {
  server kuberneteswrapper:3000;
}

upstream lhci {
  server lhci-server.lhci:9001;
}

upstream nvt_agent_gateway {
  zone nvt_agent_gateway 64k;
  server nvt-agent-gateway.nvt.svc.cluster.local:80 resolve;
}

upstream nvt_credential_portal {
  zone nvt_credential_portal 64k;
  server nvt-credential-portal.nvt.svc.cluster.local:80 resolve;
}
