apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

metadata:
  name: altinn-minimal-worktree

spec:
  sandbox:
    mounts:
      - type: bind
        source: ../..
        target: /home/agent/code/altinn-studio
        readOnly: false
      # Arrays replace inherited arrays, so retain the default Agent's build scratch space.
      - type: tmpfs
        target: /tmp
        capacity: "2Gi"
