apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: altinn-minimal
spec:
  sandbox:
    image:
      type: reference
      reference: ghcr.io/altinn/altinn-studio/agent-minimal:latest
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: layered
    initSystem: image
    # The deployed apps, copied from the host when the Agent is created. See src/tools/altinn-fleet/README.md.
    mounts:
      - type: volume
        volume: altinn-apps-prod
        target: /home/agent/code/.reference/altinn-apps/prod
        readOnly: true
        optional: true
      - type: volume
        volume: altinn-apps-tt02
        target: /home/agent/code/.reference/altinn-apps/tt02
        readOnly: true
        optional: true
  home:
    source: ../home
  instructions:
    - source: ../instructions.md
    - source: environment.md
    - source: ../improving.md
  skills:
    - source: ../_skills/app-development
      name: altinn-studio-app-development
    - source: ../_skills/pr-evidence
    - source: ../_skills/fix-dependabot-alerts
    - source: ../_skills/changelog
    - source: ../_skills/tekstforfatter-docs
    - source: ../_skills/text-content-review
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
      # Uses whichever Claude Code login is stored on the host, whatever it is named.
      login: any
      # The mediated token cannot list Fable in the /model picker, so new Sessions select it at launch.
      defaults:
        model: fable
    # Optional: an Agent is created without Codex when the host has no Codex login, so nobody who
    # only uses Claude Code is blocked. Run `agentctl codex login` and the next convergence
    # installs it.
    - type: codex
      auth: mediated
      login: any
      optional: true
    # Pi has no platform login: its providers and models come from ~/.pi/agent/models.json in the
    # `home` overlay, and the gateway key from the optional AIVAR_API_KEY secret below. Without the
    # key Pi starts, but a prompt's wait times out.
    - type: pi
      defaults:
        model: aivar/sigma2:Qwen3.8-27B
  # The GitHub account stored with `agentctl github login default`: a GITHUB_TOKEN for GitHub's hosts, whose
  # placeholder carries the fine-grained PAT prefix gh needs to attach files, and Git commits as the account.
  accounts:
    - type: github
      login: default
  # Stored on the host with `agentctl secret set NAME --hosts HOST`; the agent sees only placeholders.
  secrets:
    - name: azure-devops-pat
      environment: AZURE_DEVOPS_PAT
      optional: true
      allowedHosts:
        - dev.azure.com
    - name: studio-prod-api-key
      environment: STUDIO_PROD_API_KEY
      optional: true
      allowedHosts:
        - altinn.studio
    - name: studio-staging-api-key
      environment: STUDIO_STAGING_API_KEY
      optional: true
      allowedHosts:
        - staging.altinn.studio
    - name: studio-dev-api-key
      environment: STUDIO_DEV_API_KEY
      optional: true
      allowedHosts:
        - dev.altinn.studio
    - name: aivar-api-key
      environment: AIVAR_API_KEY
      optional: true
      allowedHosts:
        - api.aivar.no
  access:
    - type: ssh
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
