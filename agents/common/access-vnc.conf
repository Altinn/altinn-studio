# What this image provides for `access: [{type: vnc}]`, read by agentd: the units it enables to
# grant access and disables to withdraw it, and the ports they serve. The ports must be the ones
# agentd expects. `web-port` is optional, for an image without a browser viewer.
units=agent-vnc.socket agent-vnc-web.service
port=5900
web-port=6080
