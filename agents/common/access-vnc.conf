# What this image provides for `access: [{type: vnc}]`, read by agentd.
#
# The platform turns these units on when the Agent declares VNC access and off when it stops,
# and asserts afterwards that the declared ports are listening or gone. Everything the units
# do — where the display socket is, which viewer is served, at what URL — belongs to the image
# and is never named on the platform side.
#
# The ports are the wire contract both sides agree on; agentd refuses an image that declares
# different ones rather than discovering a viewer it cannot describe to the caller.
units=agent-vnc.socket agent-vnc-web.service
port=5900
web-port=6080
