# The Agent desktop's display, geometry and VNC port, read by the desktop systemd units. The image
# also sets DISPLAY to the same value for every Session. The geometry is Anthropic's 1568-tile image
# budget at 28 px tiles and sits inside OpenAI's recommended 1440-1600 pixel width band: a
# screenshot of this display costs about 1.5k image tokens and is sent without being resized, so
# the coordinates a model reads off it address the pixels it clicks.
AGENT_DESKTOP_DISPLAY=:1
AGENT_DESKTOP_GEOMETRY=1456x819
AGENT_DESKTOP_SOCKET=/run/agent-desktop/vnc.sock
