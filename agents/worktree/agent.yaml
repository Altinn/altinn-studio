apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: altinn-worktree
spec:
  sandbox:
    image:
      type: reference
      reference: ghcr.io/altinn/altinn-studio/agent-full:latest
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: direct
    initSystem: image
    mounts:
      - type: bind
        source: ../..
        target: /home/agent/code/altinn-studio
        readOnly: false
      # The Sandbox default sizes /tmp at a quarter of guest memory, capped at 512 MiB, which is
      # too small for a large build's scratch space. A tmpfs holds only what is written to it.
      - type: tmpfs
        target: /tmp
        capacity: "2Gi"
  home:
    source: home
  instructions:
    - source: ../instructions.md
    - source: ../full/environment.md
  skills:
    - source: ../skills/pr-evidence
  harnesses:
    - type: claudeCode
      auth: mediated
  environment:
    - name: GIT_USER_NAME
    - name: GIT_USER_EMAIL
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
