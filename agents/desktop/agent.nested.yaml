apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

metadata:
  name: altinn-desktop-nested

spec:
  sandbox:
    resources:
      cpu: "2"
      memory: "3Gi"
      rootFilesystem:
        capacity: "24Gi"
        mode: direct
      # A nested Agent runs no Agents of its own.
      nestedSandboxes: null
