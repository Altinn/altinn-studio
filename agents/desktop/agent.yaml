apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: altinn-desktop
spec:
  sandbox:
    image:
      type: reference
      reference: ghcr.io/altinn/altinn-studio/agent-desktop:latest
    platform:
      os: linux
    resources:
      cpu: "4"
      # The desktop itself idles at about 40 MiB; the browser, containers and builds need the memory.
      memory: "8Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: direct
    initSystem: image
    # The Sandbox default sizes /tmp at a quarter of guest memory, capped at 512 MiB, which is
    # too small for a large build's scratch space. A tmpfs holds only what is written to it.
    # Chromium's shared memory lands here too, through --disable-dev-shm-usage.
    mounts:
      - type: tmpfs
        target: /tmp
        capacity: "2Gi"
  home:
    source: home
  instructions:
    - source: ../instructions.md
    - source: environment.md
    - source: desktop.md
  skills:
    - source: ../../src/cli/resources/agent/skills/app-development
      name: altinn-studio-app-development
    - source: ../skills/pr-evidence
    - source: ../skills/fix-dependabot-alerts
    # Repository-wide Skills live where Claude Code discovers them in a plain checkout, and the
    # manifests reach across so every harness in an Agent gets them too.
    - source: ../../.claude/skills/changelog
    - source: ../../.claude/skills/tekstforfatter-docs
    - source: ../../.claude/skills/text-content-review
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
      # The mediated token cannot list Fable in the /model picker, so new Sessions select it at launch.
      defaults:
        model: fable
    # Optional: an Agent is created without Codex when the host has no Codex login, so nobody who
    # only uses Claude Code is blocked. Run `agentctl codex login` and the next convergence
    # installs it.
    - type: codex
      auth: mediated
      optional: true
    # Pi has no platform login: its providers and models come from ~/.pi/agent/models.json in the
    # `home` overlay, and the gateway key from the optional AIVAR_API_KEY secret below. Without the
    # key Pi starts, but a prompt's wait times out.
    - type: pi
      defaults:
        model: aivar/sigma2:Qwen3.8-27B
  environment:
    - name: GIT_USER_NAME
    - name: GIT_USER_EMAIL
  secrets:
    - environment: GITHUB_TOKEN
      # gh only attaches files with a token it classifies by prefix; the inert placeholder
      # therefore carries the fine-grained PAT prefix and is far shorter than a real token.
      placeholder: github_pat_AGENT_MEDIATED_GITHUB_TOKEN
      allowedHosts:
        - github.com
        - api.github.com
        - gist.github.com
        - uploads.github.com
    - environment: AZURE_DEVOPS_PAT
      optional: true
      allowedHosts:
        - dev.azure.com
    - environment: STUDIO_PROD_API_KEY
      optional: true
      allowedHosts:
        - altinn.studio
    - environment: STUDIO_STAGING_API_KEY
      optional: true
      allowedHosts:
        - staging.altinn.studio
    - environment: STUDIO_DEV_API_KEY
      optional: true
      allowedHosts:
        - dev.altinn.studio
    - environment: AIVAR_API_KEY
      optional: true
      allowedHosts:
        - api.aivar.no
  access:
    - type: ssh
    # Enables the image's VNC access units; without it the desktop runs with no port open.
    - type: vnc
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
