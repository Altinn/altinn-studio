[workspace]
members = [
  "src/AI/assistant-runner",
  "src/ci/github-runner/coordinator",
  "src/common/rust/sandbox-host",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.4", features = ["json"] }
# The Sandbox crates from digdir/digdir-agents, at the commit tagged `agentctl/v0.1.0-preview.10`.
# They pin the Microsandbox version; keep MICROSANDBOX_RUNTIME_VERSION in every Dockerfile that sets it
# in step with it. The microsandbox-pins workflow checks this.
sandbox = { git = "https://github.com/digdir/digdir-agents.git", rev = "a58229f7f9125784b8c4a195329a124b2e1552f9" }
sandbox-authorization = { git = "https://github.com/digdir/digdir-agents.git", rev = "a58229f7f9125784b8c4a195329a124b2e1552f9" }
sandbox-microsandbox = { git = "https://github.com/digdir/digdir-agents.git", rev = "a58229f7f9125784b8c4a195329a124b2e1552f9" }
sandbox-host = { path = "src/common/rust/sandbox-host" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"
unreachable_pub = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"
expect_used = "deny"
future_not_send = "allow"
iter_with_drain = "allow"
multiple_crate_versions = "allow"
panic = "deny"
redundant_pub_crate = "allow"
unwrap_used = "deny"
