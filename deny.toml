# This policy intentionally contains no per-crate allowlist. New dependencies remain ordinary
# Cargo.toml and Cargo.lock changes.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
ignore = [
  # bincode 2 is unmaintained and has no maintained successor release. Microsandbox and its
  # libkrun crates use it to serialize their own data; the advisory reports no vulnerability.
  { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode 2 used by Microsandbox; no known vulnerability or safe upgrade" },
  # astral-tokio-tar is unmaintained and has no maintained successor release. Microsandbox uses it to read and write
  # image layers and snapshot archives.
  { id = "RUSTSEC-2026-0440", reason = "unmaintained astral-tokio-tar used by Microsandbox; no safe upgrade" },
  # The fixed libsqlite3-sys is 0.39, and sqlx-sqlite 0.9.0, its latest release, allows only versions below 0.38.
  # Remove this entry when Microsandbox can move to a sqlx release that allows it.
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys fix needs a sqlx release that Microsandbox can use" },
]

[sources]
# crates.io is allowed by default. Additional registries fail until deliberately configured.
unknown-registry = "deny"
# Do not maintain a git repository allowlist, but require an explicit revision specifier.
unknown-git = "allow"
required-git-spec = "rev"
